# Generated by starci app sync (app root). Do not edit: run "npx starci app sync --execute".
name: ci

# CI judges pull requests, main, release candidates and release tags, and a green release tag deploys.
#   profile branch  a push to a branch the declaration gives a branch profile (.starcistacks/application-stacks.yaml branches): the checks, with each gate
#                 the profile lowers in its mode (lint reports through the app check and keeps the lint ratchet blocking; a reported sonar or codecov runs
#                 and uploads, never judged); a pull request into main always runs the full gate
#   pull_request  the checks and the image builds of a change to main, with no secret and no environment (a Dependabot or fork run has none anyway);
#                 and no run of this workflow executes a pull request's code with a token that can write
#   main          a push is refused unless its commit is on origin/dev (the pre-push hook's rule, held again here for a push that bypassed the hook); judged only when no release tag points at the pushed commit (the release push sends main and its tag together; the tag run is the release run)
#   candidate     release/candidate-<version>: the run of a release the tag run then reuses
#   tag v*        the release run: plan, checks and images in parallel, the verdict, then the deploy of every environment with deploy.auto
on:
  push:
    branches:
      - "main"
      - "release/candidate-*"
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# The committed check cache (.starcistacks/cache, contexts/project/check-cache.md): a run judges only what differs from the cache at its trusted base
# (the first parent of a push to main, the merge-base with main of a release candidate or tag, whose cache main's CI verified); the nightly
# cache-verify.yml proves that trust.
env:
  STARCI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

# One run per ref. A pull request run is replaced by the next push to it; every other run, a release tag above all, is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The job shape of the StarCi CI standard (knowledge/hfs/ci-standard.yaml): plan, fast, lint per side, the unit run in shards, one coverage merge, build, images,
# sonar, the verdict and the deploy jobs. Timeouts and the shard count come from ci.jobs of .starcistacks/application-stacks.yaml (defaults in the standard).
# A job the plan leaves out is never a green one: the verdict job requires every job it needs to be green or, where the plan left it out on purpose, not run.
jobs:
  plan:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      checks: ${{ steps.plan.outputs.checks }}
      images: ${{ steps.plan.outputs.images }}
      push: ${{ steps.plan.outputs.push }}
      full: ${{ steps.plan.outputs.full }}
      sonar: ${{ steps.plan.outputs.sonar }}
      codecov: ${{ steps.plan.outputs.codecov }}
      release: ${{ steps.plan.outputs.release }}
      ci_run: ${{ steps.plan.outputs.ci_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: plan
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          checks=true images=true push=false full=false release=false ci_run="$GITHUB_RUN_ID" note="checks and image builds" sonar=blocking codecov=blocking
          if [[ "$EVENT" == push ]]; then
            full=true push=true
            if [[ "$REF_TYPE" == tag ]]; then
              release=true
              [[ "$GITHUB_REF_NAME" == "v$(node -p "require('./package.json').version")" ]] || { echo "::error::the release tag does not match the package version"; exit 1; }
              reused=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&status=success&per_page=100" --jq '[.workflow_runs[] | select(.head_branch | startswith("release/candidate-"))] | first | .id // empty')
              if [[ -n "$reused" ]]; then checks=false ci_run="$reused" note="release run: the green candidate run $reused judged this commit; images are built and pushed here"; else note="release run: the release checks (Sonar included) against the warm cache, and images"; fi
            elif [[ "$GITHUB_REF" == refs/heads/release/candidate-* ]]; then
              note="candidate run: the release checks (Sonar included) against the warm cache; images are built and pushed under sha-<sha>"
            elif [[ -n "$(git tag --points-at "$GITHUB_SHA" --list 'v*')" ]]; then
              checks=false images=false push=false full=false note="deferred: the release tag run of this commit judges it"
            else
              images=false push=false full=false note="main without a release tag: checks only"
            fi
          fi
          if [[ "$EVENT" == push && "$REF_TYPE" == branch && "$GITHUB_REF_NAME" == main ]]; then
            git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/dev || { echo "::error::main moves only to a commit on dev (contexts/project/branches.md PROJECT-BRANCH-1)"; exit 1; }
          fi
          { echo "checks=$checks"; echo "images=$images"; echo "push=$push"; echo "full=$full"; echo "release=$release"; echo "ci_run=$ci_run"; echo "sonar=$sonar"; echo "codecov=$codecov"; } >> "$GITHUB_OUTPUT"
          echo "plan: $note" >> "$GITHUB_STEP_SUMMARY"
          echo "gate lint: off (declared: owner 2026-11-17: product model not settled; code first, quality gates later)" >> "$GITHUB_STEP_SUMMARY"
          echo "gate sonar: off (declared: owner 2026-11-17: product model not settled; code first, quality gates later)" >> "$GITHUB_STEP_SUMMARY"
          echo "gate test: off (declared: owner 2026-11-17: product model not settled; code first, quality gates later)" >> "$GITHUB_STEP_SUMMARY"
          echo "gate coverage: off (declared: owner 2026-11-17: product model not settled; code first, quality gates later)" >> "$GITHUB_STEP_SUMMARY"
          echo "gate codecov: off (declared: owner 2026-11-17: product model not settled; code first, quality gates later)" >> "$GITHUB_STEP_SUMMARY"

  fast:
    needs: plan
    if: ${{ needs.plan.outputs.checks == 'true' }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: deps
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}
      # The build cache is restored in every job and saved by the build job always (build-cache-save.yml), keyed by the lockfile and the run.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo
            fe/apps/*/.next/cache
          key: ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-node22-build-
      - run: npm ci --ignore-scripts
        if: steps.deps.outputs.cache-hit != 'true'
      - name: production dependency audit
        run: npx --no-install starci app audit --omit-dev --level=high
      - name: format
        run: npx --no-install starci app check --gate format --env prod
      - name: boot proof
        run: npx --no-install starci app check --gate wiring --env prod
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: typecheck
        run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  lint:
    needs: plan
    if: ${{ needs.plan.outputs.checks == 'true' && false }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        side: [be, fe]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: deps
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}
      # The build cache is restored in every job and saved by the build job always (build-cache-save.yml), keyed by the lockfile and the run.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo
            fe/apps/*/.next/cache
          key: ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-node22-build-
      - run: npm ci --ignore-scripts
        if: steps.deps.outputs.cache-hit != 'true'
      - name: lint baseline
        shell: bash
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
        run: |
          base="origin/$DEFAULT_BRANCH"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base="origin/$BASE_BRANCH"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            base=$(git describe --tags --abbrev=0 "$GITHUB_REF^" 2>/dev/null) || base="origin/$DEFAULT_BRANCH"
          elif [[ "$GITHUB_EVENT_NAME" == push && -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]]; then
            base="$BEFORE"
          fi
          echo "STARCI_BASE_REF=$base" >> "$GITHUB_ENV"
      - name: lint
        run: "echo 'lint: off (declared: owner 2026-11-17: product model not settled; code first, quality gates later)'"

  test:
    needs: plan
    if: ${{ needs.plan.outputs.checks == 'true' && false }}
    timeout-minutes: 25
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: deps
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}
      # The build cache is restored in every job and saved by the build job always (build-cache-save.yml), keyed by the lockfile and the run.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo
            fe/apps/*/.next/cache
          key: ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-node22-build-
      - run: npm ci --ignore-scripts
        if: steps.deps.outputs.cache-hit != 'true'
      - name: Jest cache restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .jest-cache
          key: ${{ runner.os }}-node22-jest-${{ hashFiles('package-lock.json') }}-shard${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-node22-jest-${{ hashFiles('package-lock.json') }}-shard${{ matrix.shard }}-
            ${{ runner.os }}-node22-jest-${{ hashFiles('package-lock.json') }}-
      # A shard (STARCI_COVERAGE_SHARD=1, the jest preset) measures only the files its specs load, without the per-file threshold, and writes istanbul
      # JSON; the coverage job merges the shards by source location and proves 100 per file on the merged report. The shard count never exceeds what the unit specs fill.
      - name: unit
        run: "echo 'test: off (declared: owner 2026-11-17: product model not settled; code first, quality gates later)'"
        env:
          STARCI_COVERAGE_SHARD: "1"
      - name: Jest cache save
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .jest-cache
          key: ${{ runner.os }}-node22-jest-${{ hashFiles('package-lock.json') }}-shard${{ matrix.shard }}-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && hashFiles('be/coverage/coverage-final.json') != ''
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: be/coverage/coverage-final.json

  coverage:
    needs: [plan, test]
    if: ${{ false }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Codecov OIDC authentication requires a job-scoped identity token.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: deps
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}
      # The build cache is restored in every job and saved by the build job always (build-cache-save.yml), keyed by the lockfile and the run.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo
            fe/apps/*/.next/cache
          key: ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-node22-build-
      - run: npm ci --ignore-scripts
        if: steps.deps.outputs.cache-hit != 'true'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-shard-*
          path: be/coverage/shards
      - name: merge coverage
        run: npx --no-install starci app coverage merge --out be/coverage/lcov.info be/coverage/shards
      - name: coverage proof
        run: "echo 'coverage: off (declared: owner 2026-11-17: product model not settled; code first, quality gates later)'"
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && hashFiles('be/coverage/lcov.info') != ''
        with:
          name: coverage-lcov
          path: be/coverage/lcov.info
      - name: coverage upload
        run: echo "codecov disabled in .starcistacks/application-stacks.yaml"

  build:
    needs: plan
    if: ${{ needs.plan.outputs.checks == 'true' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: deps
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}
      # The build cache is restored in every job and saved by the build job always (build-cache-save.yml), keyed by the lockfile and the run.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo
            fe/apps/*/.next/cache
          key: ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-node22-build-
      - run: npm ci --ignore-scripts
        if: steps.deps.outputs.cache-hit != 'true'
      - name: build be
        run: npm run build:be
      - name: build fe
        run: npm run build:fe
        env:
          NEXT_PUBLIC_API_URL: "https://api.next.starci.org"
          NEXT_PUBLIC_AUTH_GOOGLE: "false"
          NEXT_PUBLIC_LOCAL_API_URL: "http://localhost:3201"
          NEXT_PUBLIC_SITE_URL: "https://next.starci.org"
          NEXT_PUBLIC_STATICS_URL: "https://minio.next.starci.org/starci-next-production/statics"
      - name: build cache save
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo
            fe/apps/*/.next/cache
          key: ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
      - name: database migration checks
        run: npm run db:lint && npx starci app db drift
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  images:
    needs: plan
    if: ${{ needs.plan.outputs.images == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      push: ${{ needs.plan.outputs.push == 'true' }}
      release: ${{ needs.plan.outputs.release == 'true' }}

  verdict:
    needs: [plan, fast, lint, test, coverage, build, images]
    if: ${{ always() }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: verdict
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
          CHECKS: ${{ needs.plan.outputs.checks }}
          IMAGES: ${{ needs.plan.outputs.images }}
          FULL: ${{ needs.plan.outputs.full }}
          SONAR: ${{ needs.plan.outputs.sonar }}
          RELEASE: ${{ needs.plan.outputs.release }}
        run: |
          set -euo pipefail
          fail=0
          expect() {
            got=$(jq -r --arg job "$1" '.[$job].result' <<<"$NEEDS")
            case "$2" in
              success) [[ "$got" == success ]] || { echo "::error::job $1 is $got, expected success"; fail=1; } ;;
              idle) [[ "$got" != success && "$got" != failure && "$got" != cancelled ]] || { echo "::error::job $1 ran ($got) where the plan left it out"; fail=1; } ;;
            esac
          }
          expect plan success
          if [[ "$CHECKS" == true ]]; then want=success; else want=idle; fi
          for job in fast build; do expect "$job" "$want"; done
          expect lint idle
          expect test idle
          expect coverage idle
          if [[ "$IMAGES" == true ]]; then expect images success; else expect images idle; fi
          # The deploy jobs run only on a release run with this verdict green; the summary says which, so a deploy that does not run is never silent.
          if [[ "$RELEASE" != true ]]; then echo "deploy: not run, because this is not a release tag run" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$fail" != 0 ]]; then echo "::error::deploy blocked, because the verdict failed (see the errors above)"; echo "deploy: blocked, because the verdict failed" >> "$GITHUB_STEP_SUMMARY"
          else echo "deploy: runs (release tag run, verdict green)" >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$fail"
