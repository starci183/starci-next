screen: harness/build
title: Harness, một build
route: /harness/build/[build]
area: harness
summary: "Chặng đang khóa nói bằng Alert thông tin, không còn chữ in đậm tự dựng. Route:
  /harness/build/{build}?stage={stage}. Mã: fe/apps/app/src/components/blocks/HarnessBuild/, dữ liệu
  qua fe/apps/app/src/hooks/harnessBuild/useHarnessBuildScreen.ts (harnessBuild.shared.ts dựng
  view). Kết quả e2e đư"
