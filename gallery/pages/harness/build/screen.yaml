    title: Hướng dẫn từng bước
    shows: mỗi bước một mục có tiêu đề đánh số, thân là markdown có khối mã sao chép được. Chặng đang
      khóa không hiện bước, chỉ nói khi nào mở.
    why: FE-FUNCTION-4, no-nested-label của Grammar (bước là mục con của mục "Hướng dẫn từng bước").
