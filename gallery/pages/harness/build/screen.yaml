sections:
  - id: s1
    title: Băng đầu trang (tên build, mô tả, chip e2e)
    shows: dòng meta "e2e 9 / 20" là con số học viên theo dõi khi làm; đường dẫn Harness / Build / tên
      build cho lối quay lại.
    why: FE-FUNCTION-2, page-header-left-sublabel-xs.md.
    actions: []
    states:
      loading: null
      empty: null
      error: null
    needsApi: []
  - id: s2
    title: Danh sách các chặng
    shows: các chặng nằm đầu trang, mỗi chặng một hàng phẳng với chip kết quả (Xanh, Đỏ, Chưa chạy) và
      số ca đạt làm meta. Hàng chặng đang mở được tô nhẹ. Chọn chặng là một liên kết (?stage=), nên
      mở thẳng được từ lệnh của CLI.
    why: FE-ERROR-1, FE-UI-1.
    actions: []
    states:
      loading: null
      empty: null
      error: null
    needsApi: []
  - id: s3
    title: Kết nối repo để chứng minh
    shows: 'kết quả chạy trên máy học viên chỉ là "đang luyện"; muốn "đã chứng minh" thì build phải chạy
      trong CI có chữ ký của repo GitHub của họ. Chưa kết nối: một ô nhập owner/repo và nút "Kết nối
      repo" (không cần Project). Đã kết nối: tên repo và audience mà workflow phải xin trong token
      OIDC, có nút sao chép. Mục cũng liệt kê key cần có trong .env.'
    why: FE-ERROR-1, FE-DATA-COMMAND (ghi qua hook lệnh, đọc lại build sau khi ghi).
    actions: []
    states:
      loading: null
      empty: null
      error: null
    needsApi: []
  - id: s4
    title: Lệnh tải source mẫu
    shows: một lệnh một dòng, sao chép được, kèm dòng nhắc key AI nằm trong .env trên máy học viên và
      không gửi lên StarCi.
    why: FE-I18N-1 (mọi chữ đến từ catalog), FE-UI-1.
    actions: []
    states:
      loading: null
      empty: null
      error: null
    needsApi: []
  - id: s5
    title: Ca e2e của chặng
    shows: bảng phẳng ba cột (ca, kết quả, lý do), chip màu theo kết quả, cột lý do ẩn ở màn hẹp. Công
      tắc nhỏ "Chỉ ca chưa xanh" nằm trên bảng để việc còn lại nổi lên.
    why: table-heroui-native-section-head.md, FE-FUNCTION-4.
    actions: []
    states:
      loading: null
      empty: null
      error: null
    needsApi: []
  - id: s6
    title: Lần chạy e2e gần nhất
    shows: khối log đen trình bày đúng những gì terminal của học viên in ra (dấu ✓, ✗, ·), để học viên
      đối chiếu với máy mình.
    why: FE-ERROR-1.
    actions: []
