  - id: s4
    title: Chọn công cụ (Claude Code hoặc Codex)
    shows: chọn công cụ là chọn một giá trị cho cả khu (hướng dẫn, kiểm tra máy và bẫy thử đều theo nó), nên dùng một Select (dropdown, kiểu compact) chọn một giá trị, không phải tab chuyển màn hình. Lựa chọn được nhớ riêng cho từng học viên trong trình duyệt (fe/apps/app/src/modules/harness-tool).
    why: FE-STORAGE (chỉ module chạm localStorage), FE-STATE-1.
