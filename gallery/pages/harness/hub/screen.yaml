  - id: s3
    title: Danh sách ba phần
    shows: ba phần là ba hàng phẳng, mỗi hàng có số thứ tự, tên phần, một câu mô tả, các chủ đề trong phần làm dòng meta, chip tiến độ ở cuối ("2 / 4 build xanh") và cả hàng là liên kết. Phần 1 có kiểm thử nên chip xanh khi mọi build xong; phần 3 chỉ đếm bài vì không có kiểm thử.
    why: FE-FUNCTION-4 (hàng nhận chữ đã dựng sẵn), table-heroui-native-section-head.md.
