  - id: s1
    title: Băng đầu trang (tiêu đề, dòng phụ, bốn tab)
    shows: Harness là khu riêng, không nằm trong Essentials hay Projects, nên trang gốc không có đường dẫn. Bốn tab gạch chân (Tổng quan, Build, Xài, Hiểu sâu) là liên kết thật, mở được ở tab mới và dùng chung ở mọi trang của khu.
    why: FE-FUNCTION-2 (băng do Page vẽ từ dữ liệu), page-header-left-sublabel-xs.md.
    actions: []
    states:
      loading: null
      empty: null
      error: null
    needsApi: []
  - id: s2
    title: Dải số liệu tiến độ
    shows: bốn con số (build xong, chặng đang luyện, chặng đã chứng minh, kiểm tra máy đạt) đứng thành một dải full-width giữa hai đường kẻ mảnh, không thẻ, không nền. Học viên thấy mình đang ở đâu trong một cái liếc, không phải mở từng phần.
    why: FE-ERROR-1 (dải là một vùng đọc dữ liệu, loading vẽ lại đúng khung), FE-UI-1 (ribbon thay cho thẻ số liệu).
    actions: []
    states:
      loading: null
