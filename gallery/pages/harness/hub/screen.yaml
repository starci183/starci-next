sections:
  - id: s1
    title: Băng đầu trang (tiêu đề, dòng phụ, bốn tab)
    shows: Harness là khu riêng, không nằm trong Essentials hay Projects, nên trang gốc không có đường
      dẫn. Bốn tab gạch chân (Tổng quan, Build, Xài, Hiểu sâu) là liên kết thật, mở được ở tab mới
      và dùng chung ở mọi trang của khu.
    why: FE-FUNCTION-2 (băng do Page vẽ từ dữ liệu), page-header-left-sublabel-xs.md.
    actions: []
    states:
      loading: null
      empty: null
      error: null
    needsApi: []
  - id: s2
    title: Dải số liệu tiến độ
    shows: bốn con số (build xong, chặng đang luyện, chặng đã chứng minh, kiểm tra máy đạt) đứng thành
      một dải full-width giữa hai đường kẻ mảnh, không thẻ, không nền. Học viên thấy mình đang ở đâu
      trong một cái liếc, không phải mở từng phần.
    why: FE-ERROR-1 (dải là một vùng đọc dữ liệu, loading vẽ lại đúng khung), FE-UI-1 (ribbon thay cho
      thẻ số liệu).
    actions: []
    states:
      loading: null
      empty: null
      error: null
    needsApi: []
  - id: s3
    title: Danh sách ba phần
    shows: ba phần là ba hàng phẳng, mỗi hàng có số thứ tự, tên phần, một câu mô tả, các chủ đề trong
      phần làm dòng meta, chip tiến độ ở cuối ("2 / 4 build xanh") và cả hàng là liên kết. Phần 1 có
      kiểm thử nên chip xanh khi mọi build xong; phần 3 chỉ đếm bài vì không có kiểm thử.
    why: FE-FUNCTION-4 (hàng nhận chữ đã dựng sẵn), table-heroui-native-section-head.md.
    actions: []
    states:
      loading: null
      empty: null
      error: null
    needsApi: []
  - id: s4
    title: Chọn công cụ (Claude Code hoặc Codex)
    shows: chọn công cụ là chọn một giá trị cho cả khu (hướng dẫn, kiểm tra máy và bẫy thử đều theo nó),
      nên dùng nhóm chip chọn một, không phải tab chuyển màn hình. Lựa chọn được nhớ riêng cho từng
      học viên trong trình duyệt (fe/apps/app/src/modules/harness-tool).
    why: FE-STORAGE (chỉ module chạm localStorage), FE-STATE-1.
