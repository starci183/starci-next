      empty: khóa chưa có bài nào
      error: SlotView
    needsApi: []
considered:
  - option: Một hàng mỗi bài trong danh sách phẳng của khóa.
    chosen: true
    why: Một khóa hiện có một bài; danh sách phẳng đọc được ở 390 và lớn lên theo số bài, không cần thẻ.
  - option: Thẻ lớn cho mỗi bài.
    chosen: false
    why: Bài không phải vật thật để cầm lên; luật surface-layering chỉ cho thẻ vào vật thật.
  - option: "Ẩn dòng khái niệm khi nó trùng tên bài."
    chosen: true
    why: "'Saga' dưới 'Saga' nói hai lần; audit next-audit-010."
