summary: "Route: `/essentials-v2/[course]/[lesson]?page=intro|setup|happy|unhappy|pattern|submit`. Mục tiêu: học viên chạy một bài lab trên máy mình, làm xanh từng ca bằng cách sửa một file, rồi gọi tên thứ vừa dựng và nộp bài. Dữ liệu: courseLesson (bản ghi lab@2), courseCases (trạng thái từng ca, đọc lại mỗi 3 giây khi ở trang vòng lặp), openCourseHint (mở mẹo từng mức), courseLab (bảng Lab của máy học viên). Sáu trang là các tab của đầu trang; trang đứng sau trang chưa xong vẫn đọc được và nói rõ còn thiếu gì."
