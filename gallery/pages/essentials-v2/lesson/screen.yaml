considered:
  - option: Chi tiết ca đang chọn nằm dưới dòng của nó trong danh sách.
    chosen: true
    why: "Hàng danh sách của Grammar chưa có trạng thái được chọn, và ở 390 chi tiết nằm ngay dưới ca nó thuộc về; một danh sách, không thẻ trong thẻ."
  - option: Bảng Lab là rail bên phải của main-rail, sau danh sách ở màn hẹp.
    chosen: true
    why: "Học viên đọc bảng Lab song song khi làm việc, nên nó là phần hỗ trợ có vai trò rõ, không phải vùng độc lập."
  - option: Sáu trang là sáu tab gạch chân thay cho một thanh bước.
    chosen: true
    why: "Trang đổi theo URL là tab trang; mọi trang vào được, trang đến sớm chỉ nói còn thiếu gì."
  - option: Ba tab nhỏ Đỏ, Hỏi trợ giảng, Đã xanh như bản vẽ.
    chosen: false
    why: "Trạng thái là dữ liệu của ca, không phải lựa chọn của học viên: trang tự đổi khi relay báo kết quả; trợ giảng là AI riêng của học viên qua `starci-relay mcp`, nên không có khung chat trong trang."
  - option: Trang Giới thiệu nêu tên khái niệm của bài.
    chosen: false
    why: "Luật REF của Essentials v2: khái niệm chỉ được gọi tên ở trang Gọi tên, sau khi học viên đã tự dựng nó."
