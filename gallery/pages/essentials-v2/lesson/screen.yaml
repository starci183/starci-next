    shows: "bên trái danh sách ca theo thứ tự, mỗi ca một dòng với trạng thái (Xanh, Đỏ, Lỗi khi chạy, Chưa chạy, Khóa); ca đang chọn mở chi tiết ngay dưới dòng của nó: điều phải giữ đúng bằng lời, sự cố đang bật bằng lời thường, lệnh `starci-relay case run <id>` có nút sao chép, chỗ đỏ kèm mong đợi và thực tế, thang mẹo ba mức mở từng mức một, lệnh xem bản tham khảo khi ca đã xanh, lệnh về bước tham khảo kèm một dòng cảnh báo file được giữ ở nhánh cua-toi-luu-<id>; cuối danh sách một dòng nói AI của học viên gọi công cụ của bài qua `starci-relay mcp`. Bên phải là bảng Lab ở stage work với kết quả ca đang chọn."
