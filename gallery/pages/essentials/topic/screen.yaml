      rồi dòng muted "6 bài · khoảng 135 phút đọc". Nút chính "Học tiếp: <bài> · phần N" (lần đầu
      "Bắt đầu bài 1", tài khoản miễn phí "Học tiếp phần 1"). Ở 390 nút xuống dưới và rộng cả hàng.'
