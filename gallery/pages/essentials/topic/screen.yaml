sections:
  - id: s1
    title: "Dải đầu: breadcrumb, tên, mô tả, dòng sự kiện, nút chính"
    shows: 'có breadcrumb "Essentials › <chủ đề>" vì đây là trang con; dưới tên là câu mô tả của chủ đề
      rồi dòng muted "6 bài · khoảng 135 phút đọc". Nút chính "Học tiếp: <bài> · phần N" (lần đầu
      "Bắt đầu bài 1", tài khoản miễn phí "Học tiếp phần 1"). Ở 390 nút xuống dưới và rộng cả hàng.'
    why: ui/components/page-header (breadcrumbs, description, meta, actions), ui/components/button.
    actions: []
    states:
      loading: null
      empty: null
      error: null
    needsApi: []
  - id: s2
    title: Thanh "2/6 bài xong"
    shows: một thanh màu chữ (đo lường không dùng tím) kèm "2/6 bài xong" và phần trăm; số bài xong đếm
      đúng số hàng "Đã xong" bên dưới.
    why: "`theme-and-type` (đo lường dùng foreground)."
    actions: []
    states:
      loading: null
      empty: null
      error: null
    needsApi: []
  - id: s3
    title: 'Danh sách bài: số, tên, bài toán, 4 vạch, nhãn, "Mở bài 3/5", thời lượng'
    shows: một danh sách phẳng đánh số; mỗi hàng có tên, một dòng bài toán, bốn vạch cho bốn phần, nhãn
      trạng thái, điểm mở bài (số câu đúng trong 5 câu mở bài, "—" khi chưa làm) và số phút. Hàng
      bài đang học tô xám nhẹ.
    why: ui/components/list-table, `surface-layering`.
    actions: []
    states:
      loading: null
      empty: null
      error: null
    needsApi: []
  - id: s4
    title: "Cột phải (chỉ 1440): mỗi bài có 4 phần, nên biết trước, liên quan"
    shows: hiện từ khổ rộng. "Mỗi bài có 4 phần" liệt kê Bản chất (miễn phí), Source, Kịch bản, Tự áp
      dụng; ba phần sau mờ nếu chưa có Premium, kèm dòng "Phần 2 đến 4 cần Premium". "Nên biết
      trước" lấy từ điều kiện của chủ đề, "Chủ đề liên quan" là các liên kết chữ. Khối "Chủ đề này
      dạy" của bản vẽ chưa có dữ liệu (xem Phản biện).
    why: ui/components/pane-grid (cột phụ ẩn ở khổ hẹp), `surface-layering` (aside là section có
      hairline, không thẻ).
    actions: []
    states:
