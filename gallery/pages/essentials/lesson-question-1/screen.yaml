considered:
  - option: Bản vẽ đã duyệt 2026-11-20 (Duyệt hết)
    chosen: true
    why: "Mã theo canvas đã duyệt; luật Grammar 0.50: một nút chính, nút cao 40, không minh họa trong
      thẻ, chỉ SlotView rẽ nhánh tải"
  - option: "Đường dẫn: dải đầu đặt dòng sự kiện trên câu bài toán, còn bản vẽ đặt dưới; `PageHeader` cố
      định thứ tự `meta` rồi `description`. Cần Grammar cho phép đổi thứ tự, chưa sửa."
    chosen: false
    why: Ghi nhận ở lần chụp trước, chưa làm
  - option: 'Thanh năm đoạn: `Stepper kind="bar"` tô đoạn đúng bằng màu nhấn (tím), không phải xanh; chỉ
      đoạn sai có màu đỏ. Bản vẽ muốn xanh/đỏ (GRAMMAR-GAPS #3). Dùng phần tử gần nhất, ghi vào báo
      cáo.'
    chosen: false
    why: Ghi nhận ở lần chụp trước, chưa làm
  - option: 'Đáp án có hàng số "1." đến "4." thay cho vòng chữ A đến D của bản vẽ: `ListRow` chỉ có số
      thứ tự (không có chữ cái); cần Grammar nếu chủ muốn chữ cái.'
    chosen: false
    why: Ghi nhận ở lần chụp trước, chưa làm
