summary: 'Route: `/essentials/[topic]/[lesson]`. Lần đầu vào bài: chưa có câu nào được trả lời. Nút
  chính "Câu tiếp theo" xám đến khi câu 1 được chấm; dòng "Câu 1/5 · khoảng 1 phút". Code:
  `fe/apps/app/src/components/blocks/EssentialLesson/` (vỏ trang, `parts/partEssence.tsx`,
  `parts/partLocked.tsx`), hook `fe/apps/app/src/hooks/essence/`, composite
  `fe/packages/starci-next-ui/src/composites/LessonEssence/` và `LessonLockedPar'
code:
  - features/pages/LessonPage
  - components/blocks/EssentialLesson
