summary: 'Route: `/essentials/[topic]/[lesson]`. Tài khoản miễn phí đọc hết phần 1, làm lại năm câu
  và thấy điểm trước, sau; ba tab sau có ổ khóa; nút chính là "Nâng cấp Premium". Code:
  `fe/apps/app/src/components/blocks/EssentialLesson/` (vỏ trang, `parts/partEssence.tsx`,
  `parts/partLocked.tsx`), hook `fe/apps/app/src/hooks/essence/`, composite
  `fe/packages/starci-next-ui/src/composites/LessonEssence/` và `LessonLockedPart/`'
