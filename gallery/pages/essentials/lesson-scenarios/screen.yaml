summary: >-
  Route: `/essentials/[topic]/[lesson]?part=scenarios`. Mục tiêu: chạy từng kịch bản lỗi trên máy mình, thấy đỏ, hiểu vì sao, nhờ AI sửa rồi check lại tới khi xanh. Dữ liệu: lesson(id).essential.scenarios, lessonScenarioRuns (đọc lại mỗi 2 giây khi một lần chạy còn đang chạy), requestLessonRun (nút Chạy kịch bản), revealLessonHint (gợi ý khóa tới lần đỏ đầu), relayDevices. Nút chính theo trạng thái: Chạy kịch bản, Chec
