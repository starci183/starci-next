title: Essentials (danh mục)
route: /essentials
area: essentials
summary: "Route: `/essentials`. Danh mục các bài cụm theo chủ đề: thấy mình đang ở đâu, vào đúng bài
  đang dở hoặc chọn bài theo bài toán. Ảnh chụp ở 1440, 1920 và 390; khung (thanh trên, thanh bên)
  thuộc lane khác. Bản vẽ được duyệt: `design/starci-next/pages/02-essentials.html`
  (essentials-catalog). Code: `fe/apps/app/src/components/blocks/EssentialsCatalog/component.tsx`,
  mapper `fe/apps/app/src/hooks/catalog/catalog.shared."
