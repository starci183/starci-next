summary: "Route: `/essentials`. Mục tiêu: học viên chọn bài lab của một khóa. Dữ liệu: courses
  (khóa, tên, mô tả, các bài với khái niệm của chính bài và trạng thái có lab). Mỗi bài có lab là
  một hàng dẫn tới sáu trang của bài."
