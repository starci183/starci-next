schema: 1
screen: essentials/lesson
title: Bài lab · sáu trang
route: /essentials/[course]/[lesson]?page=
area: essentials
summary: "Route: `/essentials/[course]/[lesson]?page=intro|setup|happy|unhappy|pattern|submit`.
  Mục tiêu: học viên chạy một bài lab trên máy mình, làm xanh từng ca bằng cách sửa một file, rồi
  gọi tên thứ vừa dựng và nộp bài. Dữ liệu: courseLesson (bản ghi lab@2), courseCases (trạng thái
  từng ca, đọc lại mỗi 3 giây khi ở trang vòng lặp), openCourseHint (mở mẹo từng mức), courseLab
  (bảng Lab của máy học viên). Sáu trang là các tab của đầu trang; trang đứng sau trang chưa xong
  vẫn đọc được và nói rõ còn thiếu gì."
code:
  - features/pages/CourseLessonPage
  - components/blocks/CourseLesson
  - hooks/courseLesson
shots:
  "390":
    file: 390.png
    sha256: 9aa52e7c0862bc3daeb3f03073a63d4eecaa6d76c7cfcae547ab94030cbfc76e
  "1440":
    file: 1440.png
    sha256: 01ee8dc0fc0a52d069a4ddb16a5726993767245129cee7b6169d132a46efbf86
sections:
  - id: header
    title: Đầu trang và sáu tab
    shows: "dấu vết khu học và khóa, tên bài (bốn trang đầu dùng tên bài lấy từ `hook.title` của bản ghi lab,
      không gọi tên khái niệm; trang Tổng kết và Nộp bài dùng tên bài của danh mục khóa), một dòng số
      liệu (dịch vụ, ca bình thường, ca sự cố, ca đã qua) và sáu tab gạch chân: Giới thiệu, Cài đặt,
      Đơn bình thường, Khi có sự cố, Tổng kết, Nộp bài (en: Intro, Setup, Normal order, When things
      fail, Recap, Submit). Trang Giới thiệu thêm một dòng mô tả và nút chính Bắt đầu cài đặt; trang Đơn
      bình thường có nút chính Sang câu hỏi đầu tiên; các trang khác không có nút chính ở đầu trang."
    why: "`ui/components/tabs.md` (trang đổi theo URL là tab gạch chân thứ cấp trong `Page
      header.tabs`), `ui/components/page-header.md`, `essentials` (sáu trang, luật REF cho tên bài)."
    grammar: Page header.tabs (kind views), Page chrome=panes
    actions:
      - Chuyển trang bằng tab (?page=)
      - Đi tiếp bằng nút chính (trang 1 và 3)
    states:
      loading: tab và tên giữ chữ thật, thân là khung xương cùng hình
      empty: null
      error: "SlotView: thông báo lỗi kèm Thử lại; học viên chưa có Premium thấy khóa và nút Xem Premium;
        khách thấy nút Đăng nhập"
    needsApi: []
  - id: intro
    title: Giới thiệu
    shows: "câu phỏng vấn mở bài từ `hook` của bản ghi: thời điểm (chữ mờ), tình huống, câu hỏi của người
      phỏng vấn là dòng lớn nhất trang, chỗ học viên khựng lại và lời hứa của bài; rồi danh sách những
      việc học viên làm được (mỗi ca sự cố một dòng có dấu tích, dòng nhỏ dưới là tên ca, dòng cuối là
      trả lời trọn câu phỏng vấn); sơ đồ hệ thống vẽ từ bản ghi bằng MermaidDiagram, mọi dịch vụ nằm
      trong khung Docker trên máy bạn, mỗi nút ghi tên công nghệ bằng `R@{ icon: \"express\" }`
      (`icon` của dịch vụ và hạ tầng, `stack.host: docker` cho khung; Grammar vẽ logo theo tên, tên lạ thì không vẽ gì); danh sách dịch vụ (cổng và vai trò); khái niệm cần biết trước."
    why: "`ui/components/diagram.md` (cấu trúc có sẵn dạng dữ liệu vẽ bằng MermaidDiagram),
      `ui/components/list-table.md`, `ui/components/text.md` (reading.title, reading.body cho văn xuôi),
      `essentials` (luật REF: chưa gọi tên khái niệm của bài; giới thiệu là câu phỏng vấn cho chạm)."
    grammar: Text role=reading.*, Section kind=list (leading icon), MermaidDiagram, DescriptionList
    actions: []
    states:
      loading: khung xương cùng hình
      empty: null
      error: sơ đồ lỗi hiện tiêu đề lỗi và giữ nguyên văn bản nguồn
    needsApi: []
  - id: setup
    title: Cài đặt
    shows: "một đoạn nói relay làm gì, rồi bảng Lab ở bước setup: chọn hệ điều hành, cài relay, ghép máy,
      chọn thư mục, nút chính Tải code và dựng lab; dưới đó luôn có danh sách năm việc relay làm (chờ,
      rồi chạy, xong) để học viên biết bấm nút thì chuyện gì xảy ra."
    why: "`learner-cli-relay` (mã chạy trên máy học viên), bảng Lab do khối CourseLab sở hữu."
    grammar: khối CourseLab (stage setup), Tabs, CopyField, InlineStatus
    actions:
      - Các lệnh cài và ghép máy do bảng Lab đưa
    states:
      loading: bảng Lab tự vẽ khung xương
      empty: null
      error: bảng Lab tự nói lỗi và thử lại
    needsApi: []
  - id: loop
    title: Đơn bình thường và Khi có sự cố
    shows: "bên trái danh sách ca theo thứ tự, mỗi ca một dòng có trạng thái (Đã qua, Chưa qua, Chạy bị
      lỗi, Chưa chạy, Chưa mở); trang sự cố đánh số từng câu hỏi. Ca đang chọn mở chi tiết ngay dưới dòng
      của nó, không viền màu nhấn: câu hỏi của người phỏng vấn (trích nguyên văn, từ `question` của ca),
      trục trặc đang bật bằng lời thường, điều phải đúng thành từng dòng, lệnh `starci-relay case run
      <id>` có nút sao chép, thang gợi ý ba mức mở từng mức một, lệnh xem bản tham khảo khi ca đã qua,
      lệnh về bước tham khảo kèm một dòng cảnh báo file được giữ ở nhánh cua-toi-luu-<id>; cuối danh
      sách một dòng nói AI của học viên gọi công cụ của bài qua `starci-relay mcp`. Bên phải là bảng Lab
      ở stage work: code học viên sửa, kết quả ca đang chọn (điều chưa đúng kèm Mong đợi và Thực tế),
      nhật ký dịch vụ."
    why: "`ui/components/list-table.md` (một danh sách phẳng, chi tiết nằm trong hàng),
      `ui/components/lesson.md`, `essentials` (luật 1 đến 3: ca mở theo thứ tự, gợi ý mở từng mức,
      chỉ chữ đã mở được gửi), `learner-cli-relay` (lệnh case)."
    grammar: Grid kind=main-rail, Section kind=list (row detail, InlineStatus), CopyField,
      Text role=reading.body, khối CourseLab (stage work)
    actions:
      - Chọn một ca
      - Mở gợi ý kế tiếp
      - Sao chép lệnh
    states:
      loading: danh sách ba hàng khung xương
      empty: bài chưa có ca nào
      error: SlotView; gợi ý không mở được hiện thông báo vàng, thiếu Premium dẫn tới trang gói
    needsApi: []
  - id: pattern
    title: Tổng kết
    shows: "mở bằng dòng `recall.title` (\"Nhớ câu hỏi ... không?\") rồi kể lại bằng lời thường những gì học viên
      đã làm (`recall.paragraphs`, đoạn cuối gọi tên khái niệm lần đầu trong bài); cuối trang bảy hàng, mỗi
      ca sự cố một hàng: câu hỏi, điều học viên đã làm, khách được gì, tên tiếng Anh trên dòng mờ riêng
      `lang=en`, và trạng thái. `recall`, `recap` (did, gain, en) chỉ đến từ máy chủ khi ca đã xanh một lần."
    why: "`ui/components/list-table.md`, `ui/components/text.md`, `essentials` (luật REF: khái niệm
      chỉ được gọi tên từ đây; tên tiếng Anh ở nhãn riêng theo luật giọng)."
    grammar: Text role=reading.*, Section kind=list (detail, InlineStatus)
    actions: []
    states:
      loading: khung xương cùng hình
      empty: danh sách trống nói chưa có ca để đối chiếu
      error: SlotView
    needsApi: []
  - id: submit
    title: Nộp bài
    shows: "bảng Lab ở stage submit: bộ chấm ẩn là ma trận bước và kiểu hỏng (mỗi ô một dấu trạng thái,
      không chip màu), nút chấm trên máy học viên, kết quả chấm. Khi bài qua, bên dưới là \"Muốn biết hệ
      thống thật làm việc này thế nào?\": bảng so code của học viên (hàng đầu) với các repo thật, mỗi
      cột là một ca (Có, Nền tảng lo, Một phần, Không, Tự viết, Không rõ), mỗi repo đọc bằng một dòng kèm file
      ghim theo commit, điều học viên làm mà không repo nào có sẵn, câu trả lời cho câu phỏng vấn đầu
      bài, và một nút chính mở repo gần code của học viên nhất. Không còn phần thưởng bản NestJS: NestJS
      nếu có là một mục của danh sách `production`."
    why: "`learner-cli-relay` (chấm trên máy, mức Đang luyện), bảng Lab do khối CourseLab sở hữu,
      `essentials` (bước cuối là muốn hiểu cách làm thật, không phải phần thưởng)."
    grammar: khối CourseLab (stage submit), DataTable, Section kind=list, InlineStatus, Link external,
      Button primary
    actions:
      - Chấm trên máy tôi, chấm lại
      - Mở repo gần nhất
    states:
      loading: bảng Lab tự vẽ khung xương
      empty: bảng so sánh không hiện khi bản ghi không có `production`
      error: bảng Lab tự nói lỗi
    needsApi: []
  - id: missing
    title: Trang đến sớm
    shows: một thông báo vàng đầu trang nói còn thiếu gì (lab chưa dựng xong, còn bao nhiêu ca chưa
      xanh) kèm nút về đúng trang hoặc ca còn thiếu; nội dung bên dưới vẫn đọc được.
    why: "`ui/components/toast-alert.md` (Alert nói trạng thái trong trang), `essentials` (trang sau
      vẫn đọc được)."
    grammar: Alert
    actions:
      - Về trang còn thiếu
    states:
      loading: null
      empty: null
      error: null
    needsApi: []
considered:
  - option: Chi tiết ca đang chọn nằm dưới dòng của nó trong danh sách.
    chosen: true
    why: Hàng danh sách của Grammar chưa có trạng thái được chọn, và ở 390 chi tiết nằm ngay dưới ca nó
      thuộc về; một danh sách, không thẻ trong thẻ.
  - option: Bảng Lab là rail bên phải của main-rail, sau danh sách ở màn hẹp.
    chosen: true
    why: Học viên đọc bảng Lab song song khi làm việc, nên nó là phần hỗ trợ có vai trò rõ, không phải
      vùng độc lập.
  - option: Sáu trang là sáu tab gạch chân thay cho một thanh bước.
    chosen: true
    why: Trang đổi theo URL là tab trang; mọi trang vào được, trang đến sớm chỉ nói còn thiếu gì.
  - option: Ba tab nhỏ Đỏ, Hỏi trợ giảng, Đã xanh như bản vẽ.
    chosen: false
    why: "Trạng thái là dữ liệu của ca, không phải lựa chọn của học viên: trang tự đổi khi relay báo kết
      quả; trợ giảng là AI riêng của học viên qua `starci-relay mcp`, nên không có khung chat trong
      trang."
  - option: Trang Giới thiệu nêu tên khái niệm của bài.
    chosen: false
    why: "Luật REF của Essentials: khái niệm chỉ được gọi tên ở trang Gọi tên, sau khi học viên đã tự
      dựng nó."
  - option: Mô tả service và hạ tầng là detail xuống dòng.
    chosen: true
    why: "Ở 390 description một dòng cắt mất 'Database riêng: ...', là điều hàng đó để đọc; audit
      next-audit-010."
  - option: "Vá khung mở đầu của MermaidDiagram riêng trong app (chiều cao khung, mức phóng)."
    chosen: false
    why: "Luật owner: lỗi ui gom về ui, sửa một lần trong Grammar; lens layout giữ open tới khi Grammar sửa; audit next-audit-r3 vòng 3."
  - option: Giới thiệu mở bằng câu phỏng vấn thật của người phỏng vấn (từ `hook`), không bằng mô tả hệ thống.
    chosen: true
    why: 'Owner 2026-11-26: "giới thiệu = câu phỏng vấn cho chạm"; bài bắt đầu từ câu học viên sẽ rớt và kết thúc bằng việc trả lời nó.'
  - option: Trang Nộp bài kết thúc bằng thưởng tải bản NestJS.
    chosen: false
    why: 'Owner 2026-11-26: "bước cuối k phải thưởng mà là MUỐN hiểu cách implement chuẩn trong production"; bảng so với repo thật thay cho phần thưởng.'
  - option: Dịch vụ của học viên tô màu nhấn trong sơ đồ.
    chosen: false
    why: 'Owner 2026-11-26: "bỏ mấy cái màu tím này đi"; màu nhấn chỉ dành cho nút chính và tab đang chọn, nút dịch vụ ghi tên file trong chữ.'
