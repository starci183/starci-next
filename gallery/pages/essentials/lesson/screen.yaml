sections:
  - id: s1
    title: Dải đầu bài (đường dẫn, tên bài, bài toán, dòng sự kiện, nút chính, bốn tab)
    shows: 'đường dẫn Essentials, chủ đề, bài; tên bài; một câu bài toán nghiệp vụ; dòng sự kiện "Bài
      3/6 trong chủ đề · 20 phút đọc · 5 kịch bản · 4 mức tự áp dụng" (số bài lấy từ đường đi của
      chủ đề). Nút chính duy nhất do phần đang mở giao cho dải: Câu tiếp theo, Câu n, Xem kết quả,
      Đọc bài viết, Làm lại 5 câu, Nâng cấp Premium. Bốn tab phần nằm trên đường kẻ đáy; phần đang
      dở có chip đếm số đã xong, phần xong có dấu tích, phần cần Premium có ổ khóa; nhãn tab luôn
      hiện chữ.'
    why: "`app.essentials.essential` trong thông điệp; `ui/components/page-header.md` (một nút chính ở
      cuối hàng tiêu đề); `ui/components/tabs.md` (tab trang có đếm)."
    actions: []
    states:
      loading: null
      empty: null
      error: null
    needsApi: []
  - id: s2
    title: Câu hỏi mở bài (thanh năm đoạn, câu, bốn đáp án)
    shows: 'mỗi lần một câu. Thanh năm đoạn cho biết câu đang trả lời và kết quả từng câu (đúng tô màu
      nhấn, sai tô đỏ); dòng dưới thanh ghi "Câu 2/5 · đúng 1". Trước khi chọn, bốn đáp án là một
      nhóm radio dạng hàng; chọn là gửi chấm ngay, máy chủ trả đúng sai và lời giải. Sau khi chấm,
      bốn đáp án thành bốn hàng: hàng đúng viền xanh kèm "Đáp án đúng", đáp án sai đã chọn viền đỏ
      kèm "Bạn chọn"; dưới là "Vì sao." với liên kết gạch chân tới mục cần đọc (`sectionRef`) và tới
      kịch bản liên quan (`scenarioId`). Không có ô viết tự do; đáp án đúng không đi xuống trình
      duyệt trước khi chọn.'
    why: "`.starciwork/concepts/essentials.md` (Bản chất: năm câu trắc nghiệm chấm ngay),
      `conventions.md` luật 4 (không gửi đáp án trước submit);
      `ui/components/tabs.md`/`ui/loading.md` cho trạng thái chờ chấm."
    actions: []
    states:
      loading: null
      empty: null
      error: null
    needsApi: []
  - id: s3
    title: Bài viết và mục lục
    shows: 'dưới câu hỏi (hoặc một mình khi đã làm xong): dòng "Bài viết · 20 phút đọc", mục lục sáu mục
      (mục mà câu sai trỏ tới mang nhãn "Nên đọc kỹ", hết nhãn khi đã đánh dấu đọc), rồi từng mục là
      markdown với neo `#section-<id>` để liên kết từ lời giải nhảy tới.'
    why: '`ui/composition.md` (đọc dài là Section phẳng, không thẻ); `essentials.md` (mục đánh dấu "nên
      đọc kỹ").'
    actions: []
    states:
      loading: null
      empty: null
      error: null
    needsApi: []
  - id: s4
    title: Cột phải (chỉ từ 1440)
    shows: '"Bài này gồm 4 phần" liệt kê bốn phần (phần xong có dấu tích, phần cần Premium là hàng không
      mở được) và "Cuối bài": nhắc làm lại 5 câu để thấy điểm trước và sau. Dưới 70rem cột này ẩn;
      mục lục không nằm ở cột phải mà nằm trong thân (xem Phản biện).'
    why: "`ui/composition.md` (cột phải là các khối phẳng ngăn bằng đường kẻ, không thẻ)."
    actions: []
