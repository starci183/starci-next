title: Xác nhận email, liên kết hết hạn
route: /sign-in/confirm
area: auth
summary: '**Concept: Xác nhận email, liên kết hết hạn.** Trạng thái của màn này: liên kết đã dùng,
  hết hạn hoặc thiếu token (`IDENTITY_RESET_TOKEN_INVALID`). Mục tiêu: chỉ đường để lấy liên kết
  mới. Thao tác: `POST /auth/confirm`; lấy liên kết mới bằng `POST /auth/resend` sau khi đăng nhập.
  Bố cục: như màn Xác nhận email. Nút chính: "Đăng nhập". Lọc: không có. Khác bản hiện tại: trang
  mới. Lưu ý xung đột: không có.'
