            canvas đã duyệt đặt logo và tên ở góc trên trái, giới thiệu canh giữa theo chiều dọc, có
            hairline dọc giữa hai ô. Chờ biến thể context="intro". Sửa ở app: tiêu đề "Học bản chất,
            để vibe-code mà không mất kiểm soát." đang là chữ thân ~14px đậm, canvas là Heading lớn
            hai dòng; ba khu vực Essentials, Projects, Harness viết liền trong đoạn văn ("Essentials
            Kiến thức..."), canvas và luật của mục là danh sách phẳng có hàng hairline, cột tên và
            cột mô tả. Sửa ở app: liên kết "Quên mật khẩu?" và "Đăng ký" vẽ chữ đen đậm, không gạch
            chân; canvas và Grammar Link variant="inline" gạch chân lúc nghỉ (COLOR-3), dùng variant
            inline. Sửa ở app: dấu * bắt buộc chỉ có ở ô Email, ô Mật khẩu cùng form không có: một
            form hai kiểu nhãn; canvas không dùng *, chọn một cách cho mọi ô. Checklist: nút và ô ở
