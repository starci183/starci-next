schema: 1
screen: auth/forgot-sign-in-after-reset
title: Đăng nhập sau khi đặt lại
route: /sign-in
area: auth
summary: '**Concept: Đăng nhập sau khi đặt lại.** Trạng thái của màn này: vừa đặt lại mật khẩu xong.
  Mục tiêu: vào lại với mật khẩu mới. Thao tác: cổng đăng nhập của API (`POST /auth/login` email +
  mật khẩu, kết quả là phiên trong bộ nhớ và cookie làm mới httpOnly của API; `POST /auth/logout` ở
  menu avatar); GraphQL `viewerRoles` sau khi có phiên. Bố cục: như màn Đăng nhập, thêm một Alert
  xanh. Nút chính: "Đăng nhập". Lọc: không có. Khác bản hiện tại: người học đến từ trang Đặt mật
  khẩu mới, địa chỉ có `?reset=1`. Lưu ý xung đột: không có.'
