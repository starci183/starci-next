schema: 1
screen: auth/reset-expired
title: Đặt mật khẩu mới, liên kết hết hạn
route: /sign-in/reset
area: auth
summary: '**Concept: Đặt mật khẩu mới, liên kết hết hạn.** Trạng thái của màn này: liên kết đã dùng,
  hết hạn hoặc thiếu token (`IDENTITY_RESET_TOKEN_INVALID`). Mục tiêu: chỉ đường để xin liên kết
  mới. Thao tác: `POST /auth/reset`. Bố cục: như màn Đặt mật khẩu mới, form được thay bằng một Alert
  đỏ nhạt và một nút. Nút chính: "Về trang đăng nhập". Lọc: không có. Khác bản hiện tại: trang mới.
  Lưu ý xung đột: không có.'
code:
  - app/[locale]/(pages)/(entry)/sign-in/reset/page.tsx
  - features/pages/SignInResetPage/
  - components/blocks/ResetPassword/
  - features/layouts/EntryLayout/
