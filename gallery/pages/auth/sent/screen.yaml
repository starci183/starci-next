sections:
  - id: khung-vao-app
    title: Khung vào app
    why: trang vào app chưa có khung ứng dụng, chỉ logo, tên và đổi ngôn ngữ.
    law: nền trắng, hairline 1px, không bóng (skills/claude-design/SKILL.md, mục The look; brand.css của
      app).
    grammar: "`EntryFrame`, `Form`"
  - id: hoc-ban-chat-de-vibe-code-ma-khong-mat-kiem-soat
    title: Học bản chất, để vibe-code mà không mất kiểm soát.
    why: vùng giới thiệu nằm ở 1440 để người học biết mình đang vào đâu; 390 bỏ vùng này.
    law: danh sách nằm phẳng trên nền với hàng hairline, không viền ngoài (brand.css của app).
    grammar: "`Stack`, `Heading`, `Text`"
  - id: bao-da-gui
    title: Báo đã gửi
    why: người học cần biết đã gửi tới đâu và làm gì nếu không thấy.
    law: nhãn ô 16/400, ô nhập và nút cùng cao 40px, lỗi là một dòng dưới ô hoặc một Alert (brand.css
      của app).
    grammar: "`Heading`, `Text`, `Button` intent `alternative`, `TextAction`"
  - id: thay-doi-so-voi-ban-da-duyet
    title: "Thay đổi so với bản đã duyệt:"
    why: luồng đăng nhập chuyển sang tài khoản do chính ứng dụng quản lý, xác nhận và đặt lại mật khẩu
      bằng liên kết trong email.
    law: chủ sản phẩm duyệt lại mọi thay đổi so với bản đã duyệt trước khi code (PROJECT-GALLERY-7).
    grammar: không thêm phần tử mới; dùng lại các phần tử đã nêu ở trên. – Thay màn nhập mã 6 số bằng
      màn "Kiểm tra email của bạn". – Gửi lại email có thông báo xanh "Đã gửi lại email".
considered:
  - option: "Để lens layout open chỉ vì khoảng trống Grammar đã ghi (GRAMMAR-GAPS #11) rồi chuyển chủ
      sản phẩm sau vòng 4"
    chosen: false
    why: Builder không sửa được trong app; giữ open chỉ làm cổng đỏ vì việc của hàng Grammar, còn chủ
      sản phẩm đã thấy khoảng trống trong GRAMMAR-GAPS.
  - option: Pass lens khi mục còn lại chỉ là khoảng trống Grammar, ghi tên khoảng trống trong notes
    chosen: true
    why: 'Đúng luật lane "chỉ dùng Grammar, thiếu thì ghi cần Grammar": app đã làm hết phần của mình,
      phần thiếu có hàng chờ ở Grammar và được nêu tên.'
  - option: Đòi gạch chân lúc nghỉ cho Quên mật khẩu?, Đăng ký, Đăng nhập, Dùng email khác
    chosen: false
    why: Đây là TextAction đổi chế độ thẻ tại chỗ, không phải Link tới trang khác; Grammar chỉ gạch chân
      Link lúc nghỉ (COLOR-3).
