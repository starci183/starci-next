schema: 1
screen: auth/sent
title: Đã gửi email
route: /sign-in
area: auth
summary: '**Concept: Đã gửi email.** Mục tiêu: báo người học mở email để hoàn tất đăng ký. Thao tác:
  `POST /auth/resend` (email, ngôn ngữ) cho nút Gửi lại; liên kết trong email mở trang xác nhận. Bố
  cục: cùng thẻ với đăng nhập, thay ruột bằng một dòng giải thích và hai hành động. Nút chính: "Gửi
  lại email". Lọc: không có. Khác bản hiện tại: thay cho màn nhập mã 6 số; không còn ô mã, đếm lần
  thử hay hạn 10 phút. Lưu ý xung đột: không có.'
code:
