            logo, tên và phần giới thiệu dồn xuống chân ô trái (từ y≈590), nửa trên ô trái trống;
            canvas đã duyệt đặt logo và tên ở góc trên trái, giới thiệu canh giữa theo chiều dọc, có
            hairline dọc giữa hai ô. Chờ biến thể context="intro". Sửa ở app: tiêu đề "Học bản chất,
            để vibe-code mà không mất kiểm soát." đang là chữ thân ~14px đậm, canvas là Heading lớn
            hai dòng; ba khu vực Essentials, Projects, Harness viết liền trong đoạn văn ("Essentials
            Kiến thức..."), canvas và luật của mục là danh sách phẳng có hàng hairline, cột tên và
            cột mô tả. Sửa ở app: liên kết "Đăng nhập" vẽ chữ đen đậm, không gạch chân; canvas và
            Grammar Link variant="inline" gạch chân lúc nghỉ (COLOR-3), dùng variant inline.
            Checklist: nút và ô ở 1440 cao 40px; ở 390 nút 40px nhưng ô nhập đo được ~42px (Input
            của Grammar tăng cỡ chữ ở phone, cần Grammar xác nhận); không nhãn nút nào xuống dòng ở
            390; trang vào app không có TopBar, chỉ một nút đổi ngôn ngữ 40px nên không có tràn;
            vùng chạm: nút, ô nhập đạt 44 theo touch floor của Grammar, còn liên kết chữ "Đăng nhập"
            chỉ cao ~20px và Grammar Link không có vùng chạm mở rộng ở 390 (cần Grammar).'
