schema: 1
screen: auth/sign-up-validation-error
title: Đăng ký, lỗi nhập
route: /sign-in
area: auth
summary: '**Concept: Đăng ký, lỗi nhập.** Trạng thái của màn này: nhập sai (mật khẩu ngắn, mật khẩu
  nhập lại không khớp). Mục tiêu: tạo tài khoản. Thao tác: kiểm tra ngay trên máy trước khi gọi
  `POST /auth/signup`; API cũng từ chối `IDENTITY_PASSWORD_INVALID`. Bố cục: như màn Đăng ký, lỗi là
  một dòng đỏ dưới từng ô. Nút chính: "Đăng ký". Lọc: không có. Khác bản hiện tại: giới hạn mật khẩu
  8 đến 72. Lưu ý xung đột: không có.'
code:
