schema: 1
screen: auth/sign-in-wrong-password
title: Đăng nhập, sai mật khẩu
route: /sign-in
area: auth
summary: '**Concept: Đăng nhập, sai mật khẩu.** Trạng thái của màn này: sai email hoặc mật khẩu
  (`IDENTITY_INVALID_CREDENTIALS`). Mục tiêu: vào lại để học tiếp. Thao tác: cổng đăng nhập của API
  (`POST /auth/login` email + mật khẩu, kết quả là phiên trong bộ nhớ và cookie làm mới httpOnly của
  API; `POST /auth/logout` ở menu avatar); GraphQL `viewerRoles` sau khi có phiên. Bố cục: như màn
  Đăng nhập, thêm một Alert đỏ nhạt trên ô email, không nói ô nào sai. Nút chính: "Đăng nhập". Lọc:
  không có. Khác bản hiện tại: Đăng nhập chỉ còn email và mật khẩu; không còn mã 6 số sau khi nhập
  mật khẩu: phiên mở ngay tại chỗ, thẻ đóng lại (modal giữ nguyên chỗ người học đang đứng). Lưu ý
  xung đột: không có.'
