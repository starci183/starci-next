schema: 1
screen: auth/confirm
title: Xác nhận email
route: /sign-in/confirm
area: auth
summary: '**Concept: Xác nhận email.** Mục tiêu: người học bấm liên kết trong email và biết tài
  khoản đã hoạt động. Thao tác: `POST /auth/confirm` (token trong địa chỉ), gọi một lần khi mở
  trang; liên kết trong email là `/auth/confirm?token=…` và được chuyển tới trang này. Bố cục: logo,
  nút đổi ngôn ngữ và một thẻ ở giữa. Lúc đang xác nhận thẻ chỉ có vòng quay. Nút chính: "Đăng
  nhập". Lọc: không có. Khác bản hiện tại: trang mới. Lưu ý xung đột: không có.'
code:
