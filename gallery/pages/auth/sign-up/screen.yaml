schema: 1
screen: auth/sign-up
title: Đăng ký
route: /sign-in
area: auth
summary: '**Concept: Đăng ký.** Mục tiêu: tạo tài khoản bằng email và mật khẩu. Thao tác: `POST
  /auth/signup` (email, mật khẩu, ngôn ngữ); API gửi email có liên kết xác nhận và luôn trả thành
  công, kể cả khi email đã có tài khoản. Bố cục: như màn Đăng nhập. Nút chính: "Đăng ký", chỉ bật
  khi đã tick điều khoản. Lọc: không có. Khác bản hiện tại: không còn ô mã 6 số; sau khi bấm Đăng ký
  người học thấy màn "Kiểm tra email của bạn". Không còn báo "email này đã có tài khoản" (API không
  tiết lộ). Không còn nút xã hội trừ Google khi đã cấu hình. Lưu ý xung đột: không có.'
