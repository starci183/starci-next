schema: 1
screen: auth/sign-in
title: Đăng nhập
route: /sign-in
area: auth
summary: '**Concept: Đăng nhập.** Mục tiêu: vào lại để học tiếp bằng email và mật khẩu. Thao tác:
  cổng đăng nhập của API (`POST /auth/login` email + mật khẩu, kết quả là phiên trong bộ nhớ và
  cookie làm mới httpOnly của API; `POST /auth/logout` ở menu avatar); GraphQL `viewerRoles` sau khi
  có phiên. Bố cục: không có khung ứng dụng, chỉ logo, tên và nút đổi ngôn ngữ. 1440 chia đôi: trái
  giới thiệu ba khu vực, phải là thẻ biểu mẫu; 390 chỉ còn biểu mẫu. Cùng thẻ này nằm trong modal
  khi người học bấm Đăng nhập ở đầu trang. Hai ô, "Quên mật khẩu?" cùng hàng nhãn mật khẩu, dòng
  chuyển sang Đăng ký. Nút chính: "Đăng nhập". Lọc: không có. Khác bản hiện tại: Đăng nhập chỉ còn
  email và mật khẩu; không còn mã 6 số sau khi nhập mật khẩu: phiên mở ngay tại chỗ, thẻ đóng lại
  (modal giữ nguyên chỗ người học đang đứng). Bỏ nút Facebook và GitHub. Nút Google chỉ hiện khi hệ
  thống đã cấu hình Google; chưa cấu hình thì không có nút nào, không có nút chết. Tài khoản cũ từ
  hệ thống trước không có mật khẩu: dùng Quên mật khẩu một lần, nhận email có liên kết và đặt mật
  khẩu. Lưu ý xung đột: không có.'
