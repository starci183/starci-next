sections:
  - id: khung-vao-app
    title: Khung vào app
    why: trang vào app chưa có khung ứng dụng, chỉ logo, tên và đổi ngôn ngữ.
    law: nền trắng, hairline 1px, không bóng (skills/claude-design/SKILL.md, mục The look; brand.css của
      app).
    grammar: "`EntryFrame`, `Form`"
  - id: hoc-ban-chat-de-vibe-code-ma-khong-mat-kiem-soat
    title: Học bản chất, để vibe-code mà không mất kiểm soát.
    why: vùng giới thiệu nằm ở 1440 để người học biết mình đang vào đâu; 390 bỏ vùng này.
    law: danh sách nằm phẳng trên nền với hàng hairline, không viền ngoài (brand.css của app).
    grammar: "`Stack`, `Heading`, `Text`"
  - id: the-bieu-mau
    title: Thẻ biểu mẫu
    why: một thẻ cho đăng nhập, đăng ký và quên mật khẩu; chỉ đổi ruột thẻ.
    law: nhãn ô 16/400, ô nhập và nút cùng cao 40px, lỗi là một dòng dưới ô hoặc một Alert (brand.css
      của app).
    grammar: "`Form`, `Field`, `Input`, `Button`, `Link`"
  - id: thay-doi-so-voi-ban-da-duyet
    title: "Thay đổi so với bản đã duyệt:"
    why: luồng đăng nhập chuyển sang tài khoản do chính ứng dụng quản lý, xác nhận và đặt lại mật khẩu
      bằng liên kết trong email.
    law: chủ sản phẩm duyệt lại mọi thay đổi so với bản đã duyệt trước khi code (PROJECT-GALLERY-7).
    grammar: "không thêm phần tử mới; dùng lại các phần tử đã nêu ở trên. – Đăng nhập chỉ còn email và
      mật khẩu; không còn mã 6 số sau khi nhập mật khẩu: phiên mở ngay tại chỗ, thẻ đóng lại (modal
      giữ nguyên chỗ người học đang đứng). – Bỏ nút Facebook và GitHub. Nút Google chỉ hiện khi hệ
      thống đã cấu hình Google; chưa cấu hình thì không có nút nào, không có nút chết. – Tài khoản
      cũ từ hệ thống trước không có mật khẩu: dùng Quên mật khẩu một lần, nhận email có liên kết và
      đặt mật khẩu."
considered:
  - option: "Pass lens khi mục còn lại chỉ là khoảng trống Grammar đã ghi (#11, #12, #13), nêu tên trong
      notes"
    chosen: true
    why: Luật lane "chỉ dùng Grammar, thiếu thì ghi cần Grammar"; app đã làm hết phần của mình, ba
      khoảng trống đã có hàng trong GRAMMAR-GAPS.
  - option: Giữ lens open đến hết vòng 4 rồi chuyển chủ sản phẩm vì khoảng trống Grammar
    chosen: false
    why: Builder không sửa được trong app; chủ sản phẩm đã thấy các khoảng trống trong GRAMMAR-GAPS.
