schema: 1
screen: auth/sent-not-confirmed
title: Chưa xác nhận email
route: /sign-in
area: auth
summary: '**Concept: Chưa xác nhận email.** Trạng thái của màn này: đăng nhập đúng mật khẩu nhưng
  email chưa xác nhận (`IDENTITY_EMAIL_NOT_CONFIRMED`). Mục tiêu: đưa người học tới việc còn thiếu.
  Thao tác: `POST /auth/resend` (email, ngôn ngữ) cho nút Gửi lại; liên kết trong email mở trang xác
  nhận. Bố cục: như màn Đã gửi email, thêm một Alert vàng. Nút chính: "Gửi lại email". Lọc: không
  có. Khác bản hiện tại: trạng thái mới, trước đây không có bước xác nhận email riêng. Lưu ý xung
  đột: không có.'
