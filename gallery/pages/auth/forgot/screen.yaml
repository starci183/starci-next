schema: 1
screen: auth/forgot
title: Quên mật khẩu
route: /sign-in
area: auth
summary: '**Concept: Quên mật khẩu.** Mục tiêu: lấy lại quyền vào tài khoản; cũng là đường cho tài
  khoản chuyển từ hệ thống trước, chưa có mật khẩu. Thao tác: `POST /auth/forgot` (email, ngôn ngữ),
  luôn trả thành công kể cả khi email chưa có tài khoản. Bố cục: cùng thẻ với đăng nhập, một ô
  email. Nút chính: "Gửi liên kết". Lọc: không có. Khác bản hiện tại: gửi liên kết thay vì mã 6 số.
  Lưu ý xung đột: không có.'
