            hai dòng; ba khu vực Essentials, Projects, Harness viết liền trong đoạn văn ("Essentials
            Kiến thức..."), canvas và luật của mục là danh sách phẳng có hàng hairline, cột tên và
            cột mô tả. Sửa ở app: liên kết "Đăng nhập" vẽ chữ đen đậm, không gạch chân; canvas và
