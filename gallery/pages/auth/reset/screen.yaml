schema: 1
screen: auth/reset
title: Đặt mật khẩu mới
route: /sign-in/reset
area: auth
summary: '**Concept: Đặt mật khẩu mới.** Mục tiêu: đặt mật khẩu mới từ liên kết trong email. Thao
  tác: `POST /auth/reset` (token trong địa chỉ, mật khẩu mới); API đặt mật khẩu, xác nhận email và
  kết thúc mọi phiên đang mở; liên kết trong email là `/auth/reset?token=…` và được chuyển tới trang
  này. Bố cục: logo, nút đổi ngôn ngữ và một thẻ ở giữa. Nút chính: "Đặt mật khẩu"; xong thì về màn
  Đăng nhập kèm thông báo xanh. Lọc: không có. Khác bản hiện tại: trang mới. Lưu ý xung đột: không
  có.'
