schema: 1
screen: auth/reset-error
title: Đặt mật khẩu mới, lỗi nhập
route: /sign-in/reset
area: auth
summary: '**Concept: Đặt mật khẩu mới, lỗi nhập.** Trạng thái của màn này: nhập sai (mật khẩu ngắn,
  nhập lại không khớp). Mục tiêu: đặt mật khẩu mới. Thao tác: kiểm tra trên máy trước khi gọi `POST
  /auth/reset`. Bố cục: như màn Đặt mật khẩu mới, lỗi là một dòng đỏ dưới từng ô. Nút chính: "Đặt
  mật khẩu". Lọc: không có. Khác bản hiện tại: trang mới. Lưu ý xung đột: không có.'
