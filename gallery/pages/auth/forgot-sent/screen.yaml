schema: 1
screen: auth/forgot-sent
title: Quên mật khẩu, đã gửi email
route: /sign-in
area: auth
summary: '**Concept: Quên mật khẩu, đã gửi email.** Trạng thái của màn này: đã gửi liên kết đặt lại
  mật khẩu. Mục tiêu: báo người học mở email. Thao tác: `POST /auth/forgot` cho nút Gửi lại. Bố cục:
  như màn Đã gửi email, câu giải thích không nói email có tài khoản hay không. Nút chính: "Gửi lại
  email". Lọc: không có. Khác bản hiện tại: thay cho màn nhập mã và mật khẩu mới trong cùng thẻ. Lưu
  ý xung đột: không có.'
code:
