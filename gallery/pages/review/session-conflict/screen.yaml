schema: 1
screen: review/session-conflict
title: Phiên ôn, xung đột chấm
route: /review/session
area: review
summary: 'Route: `/review/session`. Phiên ôn: nhớ lại trước, xem đáp án sau, tự chấm (ảnh chụp: học
  viên seed `gallery-review-conflict` lật thẻ đầu, một phiên khác của cùng học viên chấm thẻ đó
  trước, rồi trình duyệt chấm "Lại": thẻ báo đã được cập nhật ở máy khác và mời tải lại thẻ). Bước 1
  chỉ có "Hiện đáp án" (phím Space); bước 2 có bốn nút Lại, Khó, Tốt, Dễ với khoảng hẹn ngay dưới.'
