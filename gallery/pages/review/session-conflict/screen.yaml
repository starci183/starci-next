sections:
  - id: trang-thai
    title: Trạng thái
    why: 'Chấm ở máy khác làm lệch revision: báo xung đột và nút "Tải lại thẻ".'
    law: "`FE-ERROR-1` (chỉ `SlotView` rẽ nhánh), `grammar-slot-interface`"
    grammar: "`SlotView` với `Alert`, `EmptyNotice` và `isLoading` của Section, ListRow."
  - id: dau-trang
    title: Đầu trang
    why: 'Đầu trang (tên, dòng số liệu, một nút chính) đi qua `SlotView` cùng nội dung: tiêu đề giữ
      nguyên khi đọc lỗi hay rỗng. Đường dẫn Ôn tập / Phiên ôn nằm trong `Page header`; khi chưa có
      thẻ nào, nút chính "Chọn bộ thẻ" đứng ở đầu trang.'
    law: "`grammar-slot-interface`."
    grammar: "`SlotView` với `header`, `headerFallback` và `frame`."
  - id: phan-bien
    title: Phản biện
    why: Chưa thấy chỗ lệch so với bản vẽ ở lần chụp này; chủ dự án duyệt rồi mới sửa tiếp.
    law: "`PROJECT-GALLERY-6`"
    grammar: không đổi Grammar; chỗ lệch được ghi lại để chủ dự án quyết.
considered:
  - option: Coi backtick là nội dung thẻ
    chosen: false
    why: Thẻ viết bằng markdown; người học thấy dấu thô là lỗi hiển thị, không phải chữ của thẻ.
