schema: 1
screen: commerce/premium-loading
title: "Premium, đang tải"
route: "/premium"
area: commerce
summary: "Trang Premium khi danh sách gói chưa về: bảng so sánh có sẵn, thẻ gói là khung xám giữ đúng hình."
