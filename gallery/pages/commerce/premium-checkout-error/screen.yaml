schema: 1
screen: commerce/premium-checkout-error
title: Premium, lỗi tạo thanh toán
route: /premium
area: commerce
summary: "Trang Premium khi máy chủ từ chối tạo thanh toán: khối lỗi nói chưa bị trừ tiền và bảo bấm
  Thanh toán để thử lại, các lựa chọn giữ nguyên. Bản vẽ viết Thử tạo lại mã QR; mã hiện chuyển sang
  cổng thanh toán nên chữ nói đúng việc đó, câu về mã QR sẽ có khi API trả dữ liệu QR (cần API)."
shots:
  "390":
    file: 390.png
    sha256: 53f1f799cffc40adb76d52ca17369c46b851feb9ca0570363a2effcd9290a8cd
  "1440":
    file: 1440.png
    sha256: 716515d3724b7a16e52403bacea7de08f4ae874db10604e6cdc4ed3717e9b39c
code:
  - features/pages/PlansPage
  - components/blocks/PremiumPlans
sections:
  - id: header
    title: Dải đầu trang
    shows: "Tên trang Premium và một dòng: gói hiện tại của học viên và điều luôn miễn phí (Harness,
      phần 1 của Essentials), hoặc Premium đến ngày nào."
    why: "Học viên cần biết mình đang ở gói nào trước khi so sánh. Dải đầu không có nút: việc trả tiền
      nằm ở thẻ gói."
    actions: []
    states:
      loading: Dải đầu giữ khung, chữ là khối xám
      empty: null
      error: Tên trang giữ nguyên
    needsApi: []
  - id: compare
    title: Premium mở khóa gì
    shows: "Bảng phẳng theo khu vực học: Harness, Essentials phần 1, phần 2 đến 4, Projects, Luyện code
      và Ôn tập, số máy CLI. Mỗi dòng có hai cột Miễn phí và Premium với dấu Có hoặc Khóa."
    why: "So sánh theo khu vực thay cho danh sách quyền lợi chung chung: học viên thấy đúng phần nào
      đang khóa với mình."
    actions: []
    states:
      loading: null
      empty: null
      error: null
    needsApi:
      - "Bảng so sánh và giới hạn máy là chữ trong bộ từ; cần API: kế hoạch trả về quyền theo từng
        gói"
  - id: faq
    title: Hỏi nhanh
    shows: "Ba câu hỏi: thanh toán thế nào, có tự gia hạn không, hết hạn thì sao, mỗi câu trả lời đầy đủ."
    why: Giải đáp ba nỗi lo trước khi trả tiền, ở ngay cạnh bảng so sánh.
    actions: []
    states:
      loading: null
      empty: null
      error: null
    needsApi: []
  - id: plan
    title: Chọn gói
    shows: "Cột phải: hai gói (tháng, năm có nhãn Tiết kiệm 2 tháng) với giá do máy chủ giữ, tóm tắt
      (thanh toán, tự gia hạn, tổng), một dòng nói trang sẽ chuyển sang cổng thanh toán và một nút
      chính."
    why: Một nút chính duy nhất của màn hình, kèm đúng số tiền. Ở 390 thẻ gói lên đầu để việc trả tiền
      không bị đẩy xuống dưới bảng.
    actions:
      - Thanh toán / Gia hạn
      - Đăng nhập để tiếp tục (khi chưa đăng nhập)
    states:
      loading: Hai hàng gói và tóm tắt là khung xám
      empty: "Không có gói: thông báo ngay trong thẻ"
      error: Thông báo lỗi kèm nút Thử lại trong thẻ
    needsApi:
      - "cần API: startPremiumCheckout trả dữ liệu QR để trả ngay trên trang (hiện chuyển hướng)"
      - "cần Grammar: QrCode"
considered:
  - option: "Giữ bản cũ: thẻ có viền, ngăn kéo, trang riêng cho kết nối AI"
    chosen: false
    why: "Trái luật Grammar mới: thẻ trong khung, ngăn kéo thay hộp thoại, hai nơi cho cùng việc nối
      công cụ"
  - option: Dựng đúng bản vẽ đã duyệt bằng thành phần Grammar
    chosen: true
    why: Không có thành phần riêng của ứng dụng lặp lại thứ Grammar đã có; chỗ Grammar chưa có được ghi
      cần Grammar
