schema: 1
screen: commerce/premium-result-failed
title: Kết quả thanh toán, thất bại
route: /premium/result?order=<mã đơn>
area: commerce
summary: "Kết quả của một đơn thanh toán thất bại: cảnh báo, thông tin đơn và một nút Thử lại về trang gói."
