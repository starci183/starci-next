code:
  - features/pages/CheckoutResultPage
  - components/blocks/CheckoutResult
sections:
  - id: header
    title: Dải đầu trang
    shows: "Đường dẫn Premium, Đơn <mã>, tên trang Kết quả thanh toán và một dòng: gói, trạng thái của
      đơn."
    why: Nói rõ đơn nào đang ở trạng thái nào; địa chỉ quay về không bao giờ được coi là bằng chứng đã
      trả.
    actions: []
    states:
      loading: Dải đầu giữ khung, chữ là khối xám
      empty: null
      error: Tên trang giữ nguyên
    needsApi: []
  - id: notice
    title: Thông báo trạng thái
    shows: Biểu tượng cảnh báo, tiêu đề Thanh toán không thành công và câu nói Premium chưa được kích
      hoạt.
    why: Một cột giữa, một thông báo, không thẻ lồng thẻ; trạng thái do máy chủ trả lời.
    actions: []
    states:
      loading: Khung thông báo là khối xám
      empty: null
      error: Thông báo lỗi đọc đơn kèm nút Thử lại
    needsApi: []
  - id: facts
    title: Thông tin đơn
    shows: Mã đơn, gói, số tiền, cổng và (khi đã mở) Premium đến ngày nào, dạng danh sách phẳng có kẻ.
    why: Có mã đơn để tra khi cần hỗ trợ.
    actions: []
    states:
      loading: Giá trị là khối xám
      empty: null
      error: null
    needsApi: []
  - id: action
    title: Nút đi tiếp
    shows: "Đúng một nút theo trạng thái: đã mở thì Mở Projects, thất bại thì Thử lại, hết hạn thì Tạo
      đơn mới, đang chờ thì Về trang Học (trung tính)."
    why: Một nút chính mỗi màn hình; đang chờ không có nút chính vì chưa có việc gì để làm.
    actions:
      - Mở Projects
      - Thử lại
      - Tạo đơn mới
      - Về trang Học
    states:
      loading: null
      empty: null
      error: null
    needsApi: []
considered:
  - option: "Giữ bản cũ: thẻ có viền, ngăn kéo, trang riêng cho kết nối AI"
    chosen: false
    why: "Trái luật Grammar mới: thẻ trong khung, ngăn kéo thay hộp thoại, hai nơi cho cùng việc nối
      công cụ"
  - option: Dựng đúng bản vẽ đã duyệt bằng thành phần Grammar
    chosen: true
    why: Không có thành phần riêng của ứng dụng lặp lại thứ Grammar đã có; chỗ Grammar chưa có được ghi
      cần Grammar
