  rounds:
    - n: 1
      at: 2026-11-20T21:42:25.908Z
      lenses:
        order:
          verdict: open
          notes: 'Thiếu đường dẫn "Học / Sự cố" mà canvas có, và thanh bên không có mục Sự cố nào sáng lên:
            người dùng không thấy trang này nằm ở đâu. Dòng meta "2 bài học · 1 sự cố đã mở" đứng
            trên đoạn mô tả, canvas đặt mô tả trước rồi mới tới meta.'
        layout:
          verdict: open
          notes: 'Nút "Mở sự cố" cao 32px (đo: 1440 ở x 1318–1391, y 321–352; 390 ở y 503–534), trong khi phần
            dai-dau-trang/cac-nhom-theo-chu-de và canvas ghi 40px; ở 390 nút 32px nhỏ hơn vùng chạm
            44px (cả hàng là liên kết nhưng ảnh không cho thấy vùng chạm mở rộng). Tiêu đề nhóm "Độ
            tin cậy của API" thiếu số đếm như canvas. Ở 390 huy hiệu và nút xuống hai dòng riêng
            dưới tên bài, hàng cao gấp đôi. Đầu trang: điều khiển 40px, không nhãn gãy, không tràn.'
        actionable:
          verdict: pass
          notes: ""
        live:
          verdict: pass
          notes: ""
        words:
          verdict: open
          notes: 'Chữ "mở" mang hai nghĩa trên cùng một hàng: huy hiệu "Đã mở" (học viên đã mở) và nút "Mở sự
            cố"; canvas dùng "Sẵn sàng" cho trạng thái. Tên hàng "Outbox + Idempotency" là tên bài
            tiếng Anh, canvas đặt tên sự cố tiếng Việt ("Hàng đợi tràn khi retry") và dòng phụ "Bài:
            …".'
        states:
          verdict: open
          notes: Gallery chỉ có incidents/list và incidents/list-none; canvas đã vẽ incidents/list-loading và
            incidents/list-error nhưng chưa có ảnh chụp ở 1440 và 390.
        truth:
          verdict: open
          notes: 'Hàng hiện bài ("Outbox + Idempotency", "Nâng cao · 40 phút") chứ không phải tên sự cố; meta
            "2 bài học" đếm cả bài chưa có sự cố trong khi danh sách chỉ có một hàng. Tên sự cố cho
            mỗi hàng: cần API nếu câu trả lời Incidents chưa có trường này.'
