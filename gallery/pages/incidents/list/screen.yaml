schema: 1
screen: incidents/list
title: Sự cố, danh sách các sự cố đã viết
route: /incidents
area: incidents
summary: "Route: `/incidents`. Mã: `fe/apps/app/src/components/blocks/IncidentsList/component.tsx`.
  Danh sách chỉ liệt kê các sự cố đã viết, gom theo chủ đề (ảnh chụp: chủ đề Độ tin cậy của API có
  một sự cố đã viết, Outbox + Idempotency, học viên đã mở). Khi chưa có sự cố nào được viết, xem
  `incidents/list-none`."
