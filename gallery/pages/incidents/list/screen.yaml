sections:
  - id: dai-dau-trang
    title: Dải đầu trang
    why: tên trang, mô tả và dòng số liệu (số bài, số sự cố đã mở, điều kiện cần thiết bị đã kết nối)
      nằm trong dải đầu, không còn một dòng chữ nhạt ghép bằng dấu chấm giữa.
    law: "`page-header-left-sublabel-xs.md`, `type-scale-14-12.md`."
    grammar: "`Page header={{ title, description, meta, breadcrumbs }}`."
  - id: cac-nhom-theo-chu-de
    title: Các nhóm theo chủ đề
    why: mỗi chủ đề là một `Section` danh sách phẳng; mỗi hàng là một bài có sự cố sẵn sàng, huy hiệu "Sẵn
      sàng" có chấm và một lệnh "Mở sự cố" cỡ sm của hàng danh sách (32px, luật cho phép sm trong hàng); cả hàng là liên kết. Bài chưa có sự cố không hiện.
    law: "`rows-in-card.md`, một kiểu cho một hàng."
    grammar: '`Section kind="list"` với `ListRow badges action`.'
considered:
  - option: Giữ hàng theo bài (tên bài, cấp độ, thời lượng) như mã đang chạy
    chosen: false
    why: Trang là danh sách sự cố; canvas đã duyệt đặt tên sự cố làm tên hàng và bài gốc ở dòng phụ.
  - option: Cho nút "Mở sự cố" cỡ sm vì nằm trong hàng danh sách
    chosen: false
    why: Luật cho phép sm trong hàng, nhưng chính phần màn và canvas hứa 40px, và ở 390 nút là mục tiêu
      chạm chính.
  - option: Đổi huy hiệu "Đã mở" thành "Sẵn sàng" như canvas
    chosen: true
    why: Tách nghĩa trạng thái khỏi động từ của nút, một thuật ngữ cho một khái niệm.
  - option: Bắt "Mở sự cố" phải cao 40px
    chosen: false
    why: Checklist cho phép control sm lồng trong hàng danh sách, và cả hàng là liên kết; chỉ cần sửa
      lời trong phần màn cho khớp.
  - option: Chấm words theo mã vi.json thay vì theo ảnh
    chosen: false
    why: Người kiểm chỉ chấm theo ảnh; ảnh incidents/list chụp trước khi đổi chữ nên vẫn sai.
  - option: Giữ truth mở tới khi có tên sự cố
    chosen: false
    why: Lăng kính truth chấp nhận dữ liệu thật hoặc ghi rõ cần API; app đã hiện đúng dữ liệu đang có.
