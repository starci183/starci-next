            "(StarCi Bản chất)" trong câu còn huy hiệu nguồn ghi "Essentials": một khoá hai tên. Lời người ký đã thống
            nhất (Thầy ký / Người duyệt thầy chỉ định ký, bước 3 giải thích cả hai).'
        states:
          verdict: open
          notes:
            "Đang tải, lỗi tải, không tìm thấy và ít dòng đã có ở gallery. Nhưng cv/public-many-lines trùng từng byte với màn
            này (cùng sha 1d98…/701c…, 3 dòng), nên trạng thái từ 8 dòng (Tabs lọc nguồn, Xem thêm) chưa được thấy ở
            đâu; cv/public-not-found mất thanh trên (xem màn đó)."
        truth:
          verdict: open
          notes:
            'Dữ liệu ảnh là thật (seed, mã xác minh thật). Nhưng summary nói "CV của Minh Nguyễn, bốn dòng từ bốn nguồn"
            trong khi ảnh là Học viên StarCi, 3 dòng, 2 nguồn; considered "Hiện bộ lọc Mọi nguồn theo số dòng" còn ghi
            quy tắc từ hai nguồn, ngược với mã (PUBLIC_CV_CHIPS_FROM = 8); phần s6 "hai điều chưa chắc" không nêu điều
            nào.'
