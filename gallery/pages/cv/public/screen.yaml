            sẻ CV, chân trang có lối tạo CV."
        live:
          verdict: pass
          notes: "CV công khai chỉ có dòng đã ký; mỗi dòng có biểu tượng đã xác minh, không có trạng thái chạy hay chờ để hiện."
        words:
          verdict: open
          notes:
            'Câu "Không hiện điểm số hay tên người duyệt" lặp hai lần trên một trang (chú thích dưới danh sách và dòng cuối
