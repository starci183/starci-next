considered:
  - option: Giữ bố cục đã duyệt trên canvas
    chosen: true
    why:
      "Chủ sản phẩm duyệt cả bảng vẽ ngày 20/11 và luật mới: một kiểu cho mỗi phần tử, bộ lọc là Tabs filter, chọn giá
      trị là ChoiceChips hoặc Select."
  - option: Vẽ bộ lọc thành nhóm chip như canvas
    chosen: false
    why:
      'Theo quyết định của điều phối ngày 20/11: bộ lọc một danh sách là Grammar Tabs kind="filter" có số đếm; chip chỉ
      dành cho giá trị của biểu mẫu'
  - option: Hiện bộ lọc Mọi nguồn theo số dòng
    chosen: false
    why: "Quy tắc đã chọn: hiện Mọi nguồn khi các dòng của CV đến từ hai nguồn trở lên, vì lọc một nguồn chỉ cho ra đúng
      danh sách cũ. Khung 4 dòng của canvas và CV 3 dòng của seed (Dự án và Essentials) đều có bộ lọc vì lý do đó."
