            hộp đăng nhập); canvas ghi luật "app không dựng thanh trên bằng Cluster" và một kiểu cho mỗi phần tử. Phụ: ở
            390 biểu tượng đầu hàng canh giữa một hàng cao 5-6 dòng nên lơ lửng giữa câu và nút Xác minh.'
        actionable:
