      /verify/{mã}. Chỉ dòng Đã xác minh mà học viên bật Công khai, mới ký trước; dòng bị thu hồi biến mất.
    why:
      verified-experience.md điều 4 và 10 (chỉ mục Đã xác minh lên CV; số bài luyện là bằng chứng, không tự thành dòng
