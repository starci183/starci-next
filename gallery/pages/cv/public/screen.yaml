    shows:
      'nhà tuyển dụng thấy ngay CV của ai và ai bảo đảm: ảnh hoặc chữ đầu, tên, dấu "CV đã xác minh bởi StarCi", dòng
      sự kiện (số dòng đã ký, ngày ký mới nhất); không email, không gói, không lộ trình. Nút chính "Chia sẻ CV".'
    why: verified-experience.md điều 7 (chỉ hiện vai trò người ký và ngày, không hiện tên người duyệt).
