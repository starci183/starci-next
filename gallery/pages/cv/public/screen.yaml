sections:
  - id: s1
    title: Thanh trên công khai
    shows: người xem chưa đăng nhập; chỉ cần biết đây là StarCi và đổi ngôn ngữ (dòng CV đọc theo ngôn
      ngữ đang chọn).
    why: route nằm trong nhóm (auth), không có phiên và không có thanh bên của app.
    actions: []
    states:
      loading: null
      empty: null
      error: null
    needsApi: []
  - id: s2
    title: Chủ CV
    shows: 'nhà tuyển dụng thấy ngay CV của ai và ai bảo đảm: ảnh hoặc chữ đầu, tên, dấu "CV đã xác minh
      bởi StarCi", dòng sự kiện (số dòng đã ký, ngày ký mới nhất); không email, không gói, không lộ
      trình. Nút chính "Chia sẻ CV".'
    why: verified-experience.md điều 7 (chỉ hiện vai trò người ký và ngày, không hiện tên người duyệt).
    actions: []
    states:
      loading: null
      empty: null
      error: null
    needsApi: []
  - id: s3
    title: Dòng CV đã ký
    shows: mỗi dòng là câu CV, nguồn, chủ đề và vết tin cậy Luyện xong, AI chấm, Thầy ký, kèm liên kết
      "Xác minh" và mã tới /verify/{mã}. Chỉ dòng Đã xác minh mà học viên bật Công khai, mới ký
      trước; dòng bị thu hồi biến mất.
    why: verified-experience.md điều 4 và 10 (chỉ mục Đã xác minh lên CV; số bài luyện là bằng chứng,
      không tự thành dòng CV).
    actions: []
    states:
      loading: null
      empty: null
      error: null
    needsApi: []
  - id: s4
    title: Vì sao tin được CV này
    shows: giải thích một lần ba tín hiệu mà mỗi dòng mang (Luyện xong, AI chấm, Thầy ký), và nói trang
      không hiện điểm số hay tên người duyệt.
    why: verified-experience.md điều 3 (AI không tự xác minh, nên "AI chấm" là một bước của vết, không
      có điểm) và điều 7.
    actions: []
    states:
      loading: null
      empty: null
      error: null
    needsApi: []
  - id: s5
    title: Chân trang xác minh
    shows: nói cách đọc mã xác minh và mời người xem tạo CV của họ.
    why: verified-experience.md điều 6 (dòng bị thu hồi hiện "đã thu hồi" ở trang xác minh).
    actions: []
