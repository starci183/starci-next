sections:
  - id: thanh-tren-cong-khai
    title: Thanh trên công khai
    why: người xem chưa đăng nhập chỉ cần biết đây là StarCi, đổi ngôn ngữ và đăng nhập.
    law: Một cỡ nút cao 40px; app không dựng thanh trên bằng Cluster.
    grammar: "`TopBar (cần Grammar nếu bản hiện tại buộc có avatar), Button`"
  - id: chu-cv-va-chia-se-cv
    title: Chủ CV và Chia sẻ CV
    why: nhà tuyển dụng thấy ngay CV của ai và ai bảo đảm; nút chính duy nhất là Chia sẻ CV.
    law: "Ngân sách đỏ: một nút chính; tên người xuất hiện trong chữ 500."
    grammar: "`Avatar, Heading, Button, Popover, Drawer`"
  - id: dong-cv-da-ky
    title: Dòng CV đã ký
    why: mỗi dòng là câu CV, nguồn và vết tin cậy; lọc theo nguồn là nhóm chip chọn một có số đếm.
    law: Lọc theo giá trị là ChoiceChips (Tabs chỉ chuyển ngăn); danh sách phẳng, hàng px-4 py-3.
    grammar: '`Section kind="list" filter, ChoiceChips, ListRow`'
considered: []
