route: /cv/[slug]
area: cv
summary: "**Concept: CV công khai, lỗi tải.** Lõi không trả lời và trình duyệt cũng không đọc được. Mục tiêu: thông báo
  lỗi với nút Thử lại. Bố cục: một thông báo lỗi trang giữa trang, thanh trên giữ nguyên."
