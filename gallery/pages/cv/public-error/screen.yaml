schema: 1
screen: cv/public-error
title: CV công khai, lỗi tải
route: /cv/[slug]
area: cv
summary: "Route: `/cv/{slug}` (ảnh chụp: truy vấn PublicCv bị từ chối). Thanh trên công khai giữ
  nguyên; giữa trang là thông báo lỗi trang Không tải được CV này với câu giải thích và nút Thử lại
  40px; chân trang giữ câu về mã xác minh. Mã: `fe/apps/app/src/components/blocks/PublicCv/`."
code:
  - app/[locale]/(pages)/(auth)/cv/[slug]/page.tsx
  - features/pages/PublicCvPage/
