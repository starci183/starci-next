sections:
  - id: thanh-tren
    title: Thanh trên công khai
    why: Người xem vẫn đổi được ngôn ngữ và đăng nhập khi CV không tải được.
    law: page-header-left-sublabel-xs.md
    grammar: PublicTopBar
  - id: thong-bao-loi
    title: Thông báo lỗi trang
    why: Một thông báo giữa trang nói điều gì hỏng và một việc làm tiếp (Thử lại); không vẽ chủ CV hay
      dòng CV nào vì chưa đọc được.
    law: unhandled-case-tells-customer.md
    grammar: EmptyNotice, Button
  - id: chan-trang
    title: Chân trang
    why: Câu về mã xác minh và lời mời tạo CV giữ nguyên như trang đã tải.
    law: verified-experience.md điều 6
    grammar: Text, Link
considered:
  - option: Alert ở đầu trang
    chosen: false
    why: Canvas vẽ thông báo lỗi trang ở giữa; Alert dành cho lỗi một vùng khi phần còn lại vẫn hiện.
  - option: Thông báo lỗi giữa trang với Thử lại
    chosen: true
    why: Cả trang chỉ có một lần đọc; khi nó hỏng thì cả trang hỏng.
