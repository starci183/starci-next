sections:
  - id: chu-cv
    title: Chủ CV
    why: khung xương đúng chỗ avatar, tên, dòng sự kiện và nút, để trang không nhảy khi dữ liệu tới. Nút
      Chia sẻ chưa bấm được cho tới khi biết CV có thật, để không chia sẻ một liên kết không có CV.
    law: một vùng đang tải đi qua `SlotView`, chỉ nó rẽ nhánh; lá và vùng ghép chỉ nhận `isLoading`.
    grammar: "`Avatar`, `Heading`, `Text`, `Button` với `isLoading`."
  - id: dong-cv-da-ky
    title: Dòng CV đã ký
    why: ba dòng xương với ba vạch (câu, nguồn, vết tin cậy), giữ tiêu đề "Dòng CV đã ký" thật.
    law: như trên.
    grammar: '`Section kind="list" isLoading` + `ListRow`.'
  - id: vi-sao-tin-duoc-cv-nay
    title: Vì sao tin được CV này
    why: khối giải thích cũng là khung xương vì nó đi cùng CV; không vẽ khi kết quả là không có CV.
    law: như trên.
    grammar: "`Section isLoading`, `Stepper isLoading`."
  - id: cap-nhat-2026-11-20-pending-seed
    title: Cập nhật 2026-11-20 (pending-seed)
    why: "Trạng thái: pending-seed. Màn này cần dữ liệu thật mà dev DB chưa có (mục kinh nghiệm đã xác
      minh, CV công khai). Lane next-gallery-seed gieo dữ liệu; ảnh chụp sẽ được chụp lại khi đó. Mã
      hiện tại đã theo luật Grammar 0.50 (nút một cỡ 40px, Tabs filter cho bộ lọc, isLoading từ
      SlotView)."
    law: Grammar 0.50, một nút chính mỗi màn, nút một cỡ 40px, bộ lọc một danh sách là Tabs
      kind="filter" (quyết định điều phối 20/11), ảnh chụp chỉ dùng dữ liệu thật.
    grammar: '`Section kind="list"` + `Tabs kind="filter"`, `Stepper`, `Button`, `Popover`'
considered:
  - option: Chấm các lăng kính trên ảnh hiện có
    chosen: false
    why: Ảnh là màn khác (CV đã tải); chấm pass sẽ là pass cho thứ chưa được nhìn thấy.
