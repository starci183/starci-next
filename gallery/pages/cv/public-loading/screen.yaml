schema: 1
screen: cv/public-loading
title: CV công khai, đang tải
route: /cv/{slug}
area: cv
summary: "Route: `/cv/{slug}` (ảnh chụp: CV công khai của học viên seed `gallery-cv-multi` khi truy
  vấn PublicCv bị giữ lại). Thanh trên công khai (PublicTopBar, chung với trang xác minh) giữ thật;
  cả phần dưới là khung xương phẳng theo bố cục của trang đã tải. Mã:
  `fe/apps/app/src/components/blocks/PublicCv/` (PublicCvSkeleton)."
code:
  - app/[locale]/(pages)/(auth)/cv/[slug]/page.tsx
  - features/pages/PublicCvPage/
