schema: 1
screen: cv/public-loading
title: CV công khai, đang tải
route: /cv/{slug}
area: cv
summary: "Route: `/cv/{slug}` (ảnh chụp: CV công khai của học viên seed `gallery-cv-multi` khi truy vấn PublicCv bị giữ
  lại). Thanh trên công khai (PublicTopBar, chung với trang xác minh) giữ thật; cả phần dưới là khung xương phẳng theo
  bố cục của trang đã tải. Mã: `fe/apps/app/src/components/blocks/PublicCv/` (PublicCvSkeleton)."
code:
  - app/[locale]/(pages)/(auth)/cv/[slug]/page.tsx
  - features/pages/PublicCvPage/
shots:
  "390":
    file: 390.png
    sha256: 19ab9726c8930f95efc17369772804f24703c5bcfa2fc2c2cf049f718b427ed1
  "1440":
    file: 1440.png
