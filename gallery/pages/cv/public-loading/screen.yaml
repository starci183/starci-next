sections:
  - id: thanh-tren
    title: Thanh trên công khai
    why: Người xem chưa đăng nhập vẫn biết đây là StarCi, đổi được ngôn ngữ và đăng nhập trong lúc chờ; đây là khung của
      trang nên không thành khung xương.
    law: page-header-left-sublabel-xs.md
    grammar: PublicTopBar
  - id: chu-cv
    title: Chủ CV
    why:
      "Ảnh, tên, dòng sự kiện và nút Chia sẻ CV đều là thanh: không đoán tên hay số dòng trước khi đọc xong, và không có
      nút bấm được khi chưa biết CV có thật."
    law: "Luật của chủ sản phẩm 2026-11-21 cho trạng thái đang tải: dưới đường kẻ của dải đầu trang, mọi thứ là thanh
      Skeleton phẳng, một kiểu, không viền, không màu; dải đầu trang, thanh trên và thanh bên giữ nguyên."
    grammar: Skeleton circle, Skeleton text
  - id: dong-cv-da-ky
    title: Dòng CV đã ký
    why:
      Tiêu đề phần, ba dòng (dấu, câu, vết tin cậy) và dòng chú thích đều là thanh, cùng bố cục hai cột với cột phải, để
      trang không nhảy khi dữ liệu tới.
    law: "Luật của chủ sản phẩm 2026-11-21 cho trạng thái đang tải: dưới đường kẻ của dải đầu trang, mọi thứ là thanh
      Skeleton phẳng, một kiểu, không viền, không màu; dải đầu trang, thanh trên và thanh bên giữ nguyên."
    grammar: Grid, Skeleton text
  - id: vi-sao-tin-duoc
    title: Vì sao tin được CV này
    why: "Ba bước Luyện xong, AI chấm, Thầy ký và câu cuối cũng là thanh: chữ thật chỉ hiện khi CV đã đọc xong."
    law: "Luật của chủ sản phẩm 2026-11-21 cho trạng thái đang tải: dưới đường kẻ của dải đầu trang, mọi thứ là thanh
      Skeleton phẳng, một kiểu, không viền, không màu; dải đầu trang, thanh trên và thanh bên giữ nguyên."
    grammar: Skeleton circle, Skeleton text
considered:
  - option: Giữ tiêu đề phần thật (Section isLoading của Grammar)
    chosen: false
    why:
      "Chủ sản phẩm yêu cầu vùng nội dung là khung xương từ mép tới mép; Grammar chưa có chế độ đó (GRAMMAR-GAPS #14),
      nên app vẽ trang khung xương riêng."
  - option: Trang khung xương vẽ tay theo bố cục trang đã tải
    chosen: true
    why: "Luật của chủ sản phẩm 2026-11-21 cho trạng thái đang tải: dưới đường kẻ của dải đầu trang, mọi thứ là thanh
      Skeleton phẳng, một kiểu, không viền, không màu; dải đầu trang, thanh trên và thanh bên giữ nguyên."
