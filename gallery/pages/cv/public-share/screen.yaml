considered:
  - option: Giữ bố cục đã duyệt trên canvas
    chosen: true
    why: "Chủ sản phẩm duyệt cả bảng vẽ ngày 20/11 và luật mới: một kiểu cho mỗi phần tử, bộ lọc là Tabs
      filter, chọn giá trị là ChoiceChips hoặc Select."
  - option: Vẽ bộ lọc thành nhóm chip như canvas
    chosen: false
    why: 'Theo quyết định của điều phối ngày 20/11: bộ lọc một danh sách là Grammar Tabs kind="filter"
      có số đếm; chip chỉ dành cho giá trị của biểu mẫu'
  - option: Đặt hộp chia sẻ trong lề 1408 của trang
    chosen: false
    why: "Cần Grammar: Popover tự canh vào mép phải của nút kích hoạt và có thể vượt lề trang; app không
      đặt lại vị trí của lớp phủ."
  - option: Ảnh xem trước có tên chủ CV và số dòng trong ảnh chụp
    chosen: false
    why: Route ảnh xem trước đọc CV với hạn 3 giây; trong next dev của ảnh chụp nó biên dịch lần đầu quá
      hạn nên vẽ bản chung. Mã đã đúng (opengraph-image đọc tên và số dòng); ảnh thật sẽ có tên khi
      chạy bản dựng.
