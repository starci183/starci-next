sections:
  - id: chu-cv
    title: Chủ CV
    why: "Như `cv/public`: ảnh, tên, dòng CV đã xác minh bởi StarCi, dòng sự kiện 11 dòng đã ký và ngày
      cập nhật, nút chính Chia sẻ CV."
    law: verified-experience.md điều 7
    grammar: Avatar, Button
  - id: dong-cv-da-ky
    title: Dòng CV đã ký
    why: "Nhà tuyển dụng thường tìm một mảng: từ 8 dòng hiện tab lọc Mọi nguồn, Essentials, Dự án, Luyện
      code có đếm, một chạm là lọc. Danh sách hiện 10 dòng (390: 6) rồi Xem thêm N dòng mở tiếp tại
      chỗ; mỗi dòng có nút Xác minh 40px tới trang xác minh."
    law: verified-experience.md điều 4 và 10
    grammar: Tabs kind=filter, Section kind=list, Button
  - id: vi-sao-tin-duoc
    title: Vì sao tin được CV này
    why: Ba bước Luyện xong, AI chấm, Thầy ký (hoặc người duyệt thầy chỉ định); câu nói trang không hiện
      điểm số hay tên người duyệt chỉ đứng một lần ở đây.
    law: verified-experience.md điều 3 và 7
    grammar: Stack, Text
considered:
  - option: Tab lọc theo nguồn (Tabs kind=filter) thay cho ChoiceChips
    chosen: true
    why: "Luật Grammar: lọc một danh sách là Tabs filter có số đếm; ChoiceChips là giá trị của form."
  - option: Sửa chữ trong câu CV (StarCi Bản chất, typescript viết thường)
    chosen: false
    why: "Câu dòng CV do AI soạn theo mẫu của backend
      (be/src/modules/domain/career/messages/career.messages.ts): cần API, ghi FOLLOWUPS."
  - option: Đổi chữ Accepted sang tiếng Việt
    chosen: false
    why: Accepted là thuật ngữ chung của khu Luyện code trên toàn app (kết quả của máy chấm); đổi ở một
      nơi sẽ lệch các nơi khác.
  - option: "Close the audit cycle and open a new one: owner decided 2026-11-21: keep Accepted (app-wide
      grading term); the AI-drafted CV line wording is fixed later in the backend template
      (FOLLOWUPS)"
    chosen: true
    why: 'The closed cycle ran 4 rounds (2026-11-20T22:23:59.845Z to 2026-11-21T05:07:21.126Z), builder
      mig-auth-fe, auditor next-ux-auditor-r; its last round: order pass, layout pass, actionable
      pass, live pass, words open, states pass, truth fixed; escalated: owner decided 2026-11-21
      ("ok" to the coordinator proposal): keep "Accepted" as the app-wide grading term; the
      AI-drafted CV line wording ("(StarCi Bản chất)" beside the Essentials badge, lowercase
      "typescript") is fixed later in the backend template
      be/src/modules/domain/career/messages/career.messages.ts with a seed refresh (FOLLOWUPS).. Its
      rounds are in git history.'
