summary: "Route: `/cv/{slug}` (ảnh chụp: CV công khai của học viên seed `gallery-cv-multi`, ba dòng
  đã ký thuộc hai nguồn Dự án và Essentials, có tab theo nguồn; seed của dev chỉ sinh được ba dòng
  đã xác minh cho một học viên). Mã: `fe/apps/app/src/components/blocks/PublicCv/`."
