sections:
  - id: dong-cv-da-ky
    title: Dòng CV đã ký
    why:
      'nhà tuyển dụng thường tìm một mảng (dự án, sự cố): từ 8 dòng hiện chip nguồn có đếm, một chạm là lọc. Danh sách
      hiện 10 dòng (390: 6) rồi "Xem thêm" mở tiếp tại chỗ, không đổi trang. Nguồn Luyện code là một nguồn như các nguồn
      khác: cả nhóm bài Accepted thành một dòng, bài đã xem lời giải trước khi Accepted không tính.'
    law: "`verified-experience.md` điều 10 (số bài là bằng chứng của dòng, không tự thành dòng CV) và điều 4."
    grammar: '`ChoiceChips`, `Section kind="list"` + `ListRow`, `Button`.'
  - id: chu-cv
    title: Chủ CV
    why: như `cv/public`; dòng sự kiện nói "14 dòng đã ký".
    law: "`verified-experience.md` điều 7."
    grammar: "`Avatar`, `Heading`, `Text`, `Button`."
  - id: cap-nhat-2026-11-20-pending-seed
    title: Cập nhật 2026-11-20 (pending-seed)
    why:
      "Trạng thái: pending-seed. Màn này cần dữ liệu thật mà dev DB chưa có (mục kinh nghiệm đã xác minh, CV công khai).
      Lane next-gallery-seed gieo dữ liệu; ảnh chụp sẽ được chụp lại khi đó. Mã hiện tại đã theo luật Grammar 0.50 (nút
      một cỡ 40px, Tabs filter cho bộ lọc, isLoading từ SlotView)."
    law:
      Grammar 0.50, một nút chính mỗi màn, nút một cỡ 40px, bộ lọc một danh sách là Tabs kind="filter" (quyết định điều
      phối 20/11), ảnh chụp chỉ dùng dữ liệu thật.
    grammar: '`Section kind="list"` + `Tabs kind="filter"`, `Stepper`, `Button`, `Popover`'
considered:
  - option: Ẩn tab nguồn dưới 8 dòng như phần màn ghi
    chosen: false
    why:
      "Cần chọn một: sửa lời trong screen.yaml theo quyết định Tabs filter ngày 20/11, hoặc ẩn tab dưới 8 dòng; hiện tại
      lời và ảnh lệch nhau."
  - option: Chấp nhận tên trung tính "Học viên StarCi" trên CV công khai
    chosen: true
    why: Học viên seed chưa đặt tên hiển thị; đó là nhãn trung tính đã định, không phải lỗi app.
