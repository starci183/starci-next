summary: "Route: `/cv/{slug}` (ảnh chụp: CV công khai của học viên seed `cv-eight`, Minh Nguyễn,
  `/cv/minh-nguyen`: 11 dòng đã ký từ ba nguồn, Essentials 5, Dự án 2, Luyện code 4). Từ 8 dòng hiện
  tab lọc theo nguồn có số đếm; danh sách hiện 10 dòng (390: 6) rồi nút Xem thêm. Mã:
  `fe/apps/app/src/components/blocks/PublicCv/`."
