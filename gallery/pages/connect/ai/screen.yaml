    title: Địa chỉ MCP và tạo mã
    shows: Địa chỉ MCP có nút sao chép, ô Tên mã và nút Tạo mã. Mã vừa tạo hiện một lần trong khối cảnh
      báo kèm nút sao chép.
    why: "Việc đầu tiên: có địa chỉ và có mã để dán. Mã chỉ hiện một lần nên cảnh báo nằm ngay chỗ vừa
      tạo."
    actions:
      - Sao chép
      - Tạo mã
      - Tôi đã lưu mã
    states:
      loading: null
      empty: null
      error: Lỗi tạo mã hiện ngay dưới nút
    needsApi: []
  - id: tokens
    title: Mã truy cập của bạn
    shows: Các mã đã tạo (tên, đuôi mã, lần dùng cuối) kèm nút Thu hồi; tối đa 5 mã.
    why: Thu hồi một mã là nó ngừng chạy ngay, nên nút nằm ngay hàng.
    actions:
      - Thu hồi
    states:
      loading: Hàng là khối xám
      empty: Câu hướng dẫn Đặt tên cho mã rồi bấm Tạo mã
      error: Thông báo lỗi trong phần này kèm nút Thử lại
    needsApi: []
  - id: guide
    title: Cách thêm connector
    shows: Hai nhóm bước đánh số cho Claude và ChatGPT, lệnh trong khối mã khi có và một dòng giải thích.
    why: Từng bước nhỏ, mỗi bước một việc; nói thật OAuth sẽ đến sau.
    actions: []
    states:
      loading: null
      empty: null
      error: null
    needsApi:
      - "cần Grammar: khối mã tự xuống dòng (lệnh claude mcp add dài hiện phải cuộn ngang)"
  - id: aside
    title: Cột phụ
    shows: "Ba đoạn: AI đọc và làm được gì, AI không bao giờ thấy, về đăng nhập."
    why: Ranh giới quyền của AI, đọc đầy đủ không bị cắt.
    actions: []
    states:
      loading: null
      empty: null
      error: null
