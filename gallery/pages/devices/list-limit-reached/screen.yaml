schema: 1
screen: devices/list-limit-reached
title: Máy của bạn, đã đủ giới hạn
route: /devices
area: devices
summary: "Học viên miễn phí đã nối một máy nối thêm máy thứ hai: hộp thoại cho thấy máy sẽ nối rồi
  nói gói miễn phí chỉ nối được 1 máy."
