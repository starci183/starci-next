    shows: "Tên trang Máy của bạn, dòng: số máy đã dùng trên giới hạn, gói và việc CLI làm; nút Kết nối máy; hai tab Máy đã nối và Claude Code & MCP, mỗi tab có số đếm."
    why: "Kết nối máy là việc chính của trang nên nút nằm ở dải đầu; MCP cho Claude Code và Codex là phần thứ hai cùng một việc nối công cụ, không còn trang riêng."
