    title: "Token MCP"
    shows: "Khối cảnh báo Sao chép token ngay bây giờ với token và nút sao chép, nút Tôi đã lưu token, rồi danh sách token."
    why: "Token chỉ hiện một lần nên cảnh báo nằm ngay chỗ vừa tạo."
    actions: ["Sao chép", "Tôi đã lưu token", "Thu hồi", "Tạo token"]
