  - id: body
    title: "Hộp thoại Kết nối máy"
    shows: "Ô mã viền đỏ với câu Mã không đúng hoặc đã hết hạn, chạy lại npx @starci/next để lấy mã mới."
    why: "Nói cách sửa ngay dưới ô lỗi."
    actions: ["Hủy"]
    states:
      loading: "Hàng là khối xám giữ đúng khung"
      empty: null
      error: "Thông báo lỗi kèm nút Thử lại"
    needsApi: []
  - id: aside
    title: "CLI làm được gì"
    shows: "Năm dòng: ba việc được (chạy kịch bản, gửi kết quả, chuyển ngữ cảnh cho Claude qua MCP) và hai việc không (chứng minh dự án, đọc file ngoài thư mục bài)."
    why: "Học viên cần biết CLI không làm gì trước khi cho nó chạy trên máy mình. Bỏ mục mức chứng minh vì dự án giờ chứng minh bằng CI OIDC."
    actions: []
