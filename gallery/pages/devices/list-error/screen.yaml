    title: "Thông báo lỗi"
    shows: "Khối lỗi Không tải được kèm nút Thử lại thay cho nội dung."
    why: "Lỗi không giả làm trống."
    actions: ["Thử lại"]
    states:
      loading: "Hàng là khối xám giữ đúng khung"
      empty: null
