sections:
  - id: header
    title: "Dải đầu trang và hai phần"
    shows: "Tên trang Máy của bạn, dòng: số máy đã dùng trên giới hạn, gói và việc CLI làm; nút Kết nối máy; hai tab Máy đã nối và Claude Code & MCP, mỗi tab có số đếm."
    why: "Kết nối máy là việc chính của trang nên nút nằm ở dải đầu; MCP cho Claude Code và Codex là phần thứ hai cùng một việc nối công cụ, không còn trang riêng."
    actions: ["Kết nối máy"]
    states:
      loading: "Dải đầu giữ khung, chữ là khối xám"
      empty: null
      error: "Chỉ còn tên trang"
    needsApi: []
  - id: body
    title: "Kết nối máy mới và Máy đã nối"
    shows: "Ba bước nối máy, rồi phần Máy đã nối với số 0 và câu Chưa có máy nào được nối kèm lời dẫn quay lại ba bước."
    why: "Trạng thái trống vẫn dạy cách nối máy, không có nút thứ hai vì nút Kết nối máy đã ở dải đầu."
    actions: []
    states:
      loading: "Hàng là khối xám giữ đúng khung"
      empty: "Chưa có máy nào được nối"
      error: "Thông báo lỗi kèm nút Thử lại"
    needsApi: []
  - id: aside
    title: "CLI làm được gì"
    shows: "Năm dòng: ba việc được (chạy kịch bản, gửi kết quả, chuyển ngữ cảnh cho Claude qua MCP) và hai việc không (chứng minh dự án, đọc file ngoài thư mục bài)."
    why: "Học viên cần biết CLI không làm gì trước khi cho nó chạy trên máy mình. Bỏ mục mức chứng minh vì dự án giờ chứng minh bằng CI OIDC."
    actions: []
    states:
      loading: null
      empty: null
      error: null
    needsApi: []
