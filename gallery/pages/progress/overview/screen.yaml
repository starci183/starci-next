  - id: s3
    title: "Năm vùng: Essentials, Harness, Dự án, Luyện code, Ôn tập"
    shows: "Năm vùng: Essentials, Harness, Dự án, Luyện code, Ôn tập"
    why: mỗi vùng có liên kết "Mở …" ở cuối dòng tiêu đề và các hàng chi tiết. Essentials liệt kê bốn
      phần (Đã mở hoặc Cần Premium kèm "Xem Premium") rồi mỗi chủ đề một hàng có thanh tiến độ đen
      trên xám. Harness gộp bản dựng và Doctor trong một danh sách. Dự án là số liệu và hàng từng dự
      án, hoặc một hàng lời mời khi chưa Premium. Luyện code đọc `learnerProgress.practice` (bài
      Accepted trên tổng, pattern đang làm, pattern đã xong, tiến độ từng pattern). Ôn tập là số thẻ
      đến hạn kèm số quá hạn, đã ôn hôm nay, chuỗi hiện tại và dài nhất. Một vùng lỗi nói "Chưa tải
      được phần này" kèm nút Thử lại, không làm hỏng cả trang.
    actions: []
