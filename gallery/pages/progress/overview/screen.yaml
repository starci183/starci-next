summary: "Route: `/progress` (ảnh chụp: học viên Premium, đã làm cả năm khu vực). Mã:
  `fe/apps/app/src/components/blocks/ProgressOverview/` (`component.tsx` vẽ, `index.tsx` nối dữ
  liệu). Mọi vùng là một `Section` phẳng, không thẻ nổi. Các trạng thái khác nằm ở `progress/free`
  (chưa Premium), `progress/first` (lần đầu), `progress/partial` (một nguồn lỗi), `progress/error`
  và `progress/loading`. "
