considered:
  - option: Giữ bản vẽ cũ của ngày 17/11
    chosen: false
    why: Bản vẽ cũ lệch luật mới (nút nhỏ, chữ 600, danh sách có viền) và, ở Dự án, lệch mô hình của mã
  - option: Vẽ lại theo mã đang chạy với luật Grammar 0.50
    chosen: true
    why: Chủ duyệt "Duyệt hết" và "projects theo code" ngày 20/11
  - option: Giữ pass cả bảy lăng kính như vòng 1 và 2
    chosen: false
    why: Ảnh chụp lại cho thấy cột tên lệch ở hàng 10–20 và ghi chú thứ tự bị đẩy xuống cuối; hai vòng
      trước không ghi nhận.
  - option: Coi "Accepted" và "pattern" là chữ Anh lẫn
    chosen: false
    why: Canvas đã duyệt dùng hai từ này làm thuật ngữ cố định của Luyện code và dùng nhất quán.
  - option: Để layout mở và chuyển lên chủ
    chosen: false
    why: Cả ba điểm nằm trong component của Grammar, app không sửa được; ghi rõ là cần Grammar và cho
      pass như luật vòng cuối cho phép.
