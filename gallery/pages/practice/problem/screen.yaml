considered:
  - option: Giữ bản vẽ cũ của ngày 17/11
    chosen: false
    why: Bản vẽ cũ lệch luật mới (nút nhỏ, chữ 600, danh sách có viền) và, ở Dự án, lệch mô hình của mã
  - option: Vẽ lại theo mã đang chạy với luật Grammar 0.50
    chosen: true
    why: Chủ duyệt "Duyệt hết" và "projects theo code" ngày 20/11
  - option: Gợi ý nằm dưới đề ở 1440 như bản vẽ
    chosen: false
    why: Grid kind=pair chỉ có hai ô; gợi ý đi cùng cột mã để thứ tự ở 390 vẫn là đề, mã, kết quả, gợi
      ý. Chủ chấp nhận lệch bản vẽ 1440 (giới hạn Grammar)
  - option: Nút Về mã khởi đầu cao 40px ở đầu mục
    chosen: false
    why: Nút trong đầu mục Section bắt buộc là neutral cỡ nhỏ (starci-grammar/section-head-action). Chủ
      chấp nhận (giới hạn Grammar)
