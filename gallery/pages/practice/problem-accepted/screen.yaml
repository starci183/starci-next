schema: 1
screen: practice/problem-accepted
title: "Giải bài, Accepted"
route: "/practice/[slug]"
area: practice
summary: 'Trạng thái của màn này: Accepted. Mục tiêu: đọc đề, viết mã, chạy thử rồi nộp, mở gợi ý khi kẹt, xem lời giải khi muốn. Thao tác: practiceProblem (đề markdown, ví dụ, mã khởi đầu, giới hạn thời gian và bộ nhớ, hintsRevealed/hintsTotal, nextSlug); runPractice (chạy ví dụ); submitPractice (chấm đủ test, test ẩn chỉ hiện chỉ số); practiceSubmission (verdict queued, running, accepted, wrong-answer, time-limit, compile-error, runtime-error); revealPracticeHint (ba bậc, mở lần lượt). cần API: revealPracticeSolution (trả lời giải mẫu và ghi lại để bài không vào dòng kinh nghiệm). Bố cục: Khung chung: thanh trên (logo, StarCi Next, gói, ngôn ngữ, giao diện, avatar) và thanh bên Học · Essentials · Projects · Harness · Luyện code · Ôn tập · Hồ sơ; ở 390 thanh bên vào ngăn kéo mở bằng nút menu. 1440 hai cột: trái là đề (Đầu vào, Đầu ra, ví dụ có nhãn Vào/Ra) rồi Gợi ý; phải là chọn ngôn ngữ, ô mã có số dòng, Kết quả từng test. Tab Đề bài / Bài nộp / Lời giải. 390 theo thứ tự đề, mã, kết quả, gợi ý. Nút chính: "Nộp bài" ("Chạy thử" trung tính); đang chấm thì xám kèm lý do; Accepted thì "Bài tiếp theo". Lọc: không có. Khác bản hiện tại: bỏ thẻ đề nền xám, ba kiểu nút và cột phải lặp "Giải bài"; thêm bậc gợi ý rõ ràng. Lỗi biên dịch hiện đầu ra trình biên dịch và không tính lần sai. Lưu ý xung đột: xem lời giải trước khi Accepted thì bài không tính vào kinh nghiệm (giả định). Phần tử Grammar của màn: PageHeader, Tabs, MarkdownArticle, Select, Section kind="list", ListRow verdict, Badge, Alert, AlertDialog.'
