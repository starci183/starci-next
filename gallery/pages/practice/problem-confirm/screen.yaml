  - id: s2
    title: Xem lời giải mẫu?
    shows: "vùng này phục vụ mục tiêu của trang: đọc đề, viết mã, chạy thử rồi nộp, mở gợi ý khi kẹt,
      xem lời giải khi muốn."
    why: danh sách và bảng nằm phẳng trên nền với hàng hairline, thẻ chỉ cho vật thật
      (skills/claude-design/SKILL.md, mục The look).
