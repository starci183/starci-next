    title: Phần tử còn thiếu
    shows: bản vẽ cần một phần tử mà Grammar chưa có và vẫn vẽ nó, đánh dấu trong khung.
    why: skills/claude-design/SKILL.md, mục Method (một phần tử Grammar còn thiếu không chặn bản vẽ);
      danh sách ở GRAMMAR-GAPS.md.
