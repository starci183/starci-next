sections:
  - id: dai-tieu-de-hai-con-tro
    title: "Dải tiêu đề: Hai con trỏ"
    why: tên trang, dòng sự kiện và đúng một nút chính. "Làm bài tiếp theo"; lần đầu "Làm bài đầu tiên".
    law: một nút chính mỗi view, các nút khác trung tính (skills/claude-design/SKILL.md, mục The look).
    grammar: PageHeader
  - id: pattern-nay-chua-co-bai
    title: Pattern này chưa có bài
    why: "vùng này phục vụ mục tiêu của trang: chọn bài trong một pattern."
    law: danh sách và bảng nằm phẳng trên nền với hàng hairline, thẻ chỉ cho vật thật
      (skills/claude-design/SKILL.md, mục The look).
    grammar: Section kind="list"
  - id: chua-chup
    title: Chưa chụp
    why: màn này chưa chụp được trên kho dev; cần một pattern chưa có bài; kho dev seed mọi pattern đều
      có bài. Mở được bằng một pattern rỗng trong seed hoặc một mock của practiceProblems.
    law: không dựng dữ liệu giả cho ảnh chụp (chỉ treo hoặc từ chối một lần đọc). Trạng thái design.json
      giữ nguyên approved. Mã của màn đã theo bản vẽ đã duyệt (Section kind="list", SlotView, Tabs
      kind="filter", EmptyNotice mark="none").
    grammar: '`SlotView`, `Section kind="list"`, `Tabs kind="filter"`, `EmptyNotice mark="none"`'
