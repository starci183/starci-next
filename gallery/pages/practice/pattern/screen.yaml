schema: 1
screen: practice/pattern
title: "Pattern, các bài"
route: "/practice/patterns/[patternId]"
area: practice
summary: 'Mục tiêu: chọn bài trong một pattern. Thao tác: practiceProblems (thứ tự, tên, độ khó, nhãn, status: chưa làm, đã nộp chưa qua, Accepted) và tiến độ từ practicePatterns. cần API: practicePatternIntro (đoạn "Khi nào dùng"; hiện pattern chỉ có tên). Bố cục: Khung chung: thanh trên (logo, StarCi Next, gói, ngôn ngữ, giao diện, avatar) và thanh bên Học · Essentials · Projects · Harness · Luyện code · Ôn tập · Hồ sơ; ở 390 thanh bên vào ngăn kéo mở bằng nút menu. Đường dẫn "Luyện code / Hai con trỏ" trong dải, tên, dòng "2/5 bài Accepted"; đoạn "Khi nào dùng" ngắn; danh sách bài phẳng: số, tên, độ khó bằng chấm có chữ, nhãn kỹ thuật giữ nguyên chữ, trạng thái bằng badge (xanh Accepted, vàng đã nộp chưa qua, xám chưa làm). Cột phải: tiến độ pattern và pattern kế tiếp; 390 xuống dưới. Nút chính: "Làm bài tiếp theo"; lần đầu "Làm bài đầu tiên". Lọc: không cần, mỗi pattern vài bài. Khác bản hiện tại: nhãn không còn bị cắt, bỏ năm nút "Giải bài" lặp, cả hàng là liên kết. Lưu ý xung đột: không. Phần tử Grammar của màn: PageHeader, Breadcrumbs, Section kind="list", ListRow, Badge isDot, Progress.'
