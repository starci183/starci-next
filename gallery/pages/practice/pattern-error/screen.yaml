    why: Bản vẽ cũ lệch luật mới (nút nhỏ, chữ 600, danh sách có viền) và, ở Dự án, lệch mô hình của mã
  - option: Vẽ lại theo mã đang chạy với luật Grammar 0.50
    chosen: true
    why: Chủ duyệt "Duyệt hết" và "projects theo code" ngày 20/11
  - option: Để tiêu đề "Pattern" khi không tải được
    chosen: false
    why: Người dùng đến từ một hàng có tên; mất tên làm trang lỗi không còn nói đang ở pattern nào.
  - option: Giữ words mở vì tiêu đề "Pattern"
    chosen: false
    why: Theo builder, tên chỉ có trong lời đọc đã thất bại; đây là chỗ trống của API, không phải lỗi
      app.
