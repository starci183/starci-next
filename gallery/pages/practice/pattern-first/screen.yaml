considered:
  - option: Giữ bản vẽ cũ của ngày 17/11
    chosen: false
    why: Bản vẽ cũ lệch luật mới (nút nhỏ, chữ 600, danh sách có viền) và, ở Dự án, lệch mô hình của mã
  - option: Vẽ lại theo mã đang chạy với luật Grammar 0.50
    chosen: true
    why: Chủ duyệt "Duyệt hết" và "projects theo code" ngày 20/11
  - option: Giữ words pass theo ruling "cần API" của vòng 2
    chosen: false
    why: Ruling chỉ che nhãn và tên bài từ dữ liệu; hai cách viết cùng một số đếm là lỗi của app nên
      lăng kính phải mở.
  - option: Ở 390 đưa trạng thái lên cùng dòng tên bài, bên phải
    chosen: true
    why: Giữ hàng ba dòng như canvas, không để trạng thái trông như một nút riêng.
  - option: Giữ words mở vì nhãn tiếng Anh
    chosen: false
    why: Phần app (hai cách viết số đếm) đã sửa; nhãn và tên bài đến từ dữ liệu nên ghi là cần API.
