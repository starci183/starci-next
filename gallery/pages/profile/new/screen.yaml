sections:
  - id: s1
    title: Danh tính khi chưa có ảnh
    shows: Avatar vẽ hình mầm sinh từ tên (chưa có ảnh nên không có nút "Xoá ảnh"); nút duy nhất là "Tải
      ảnh lên". Chưa chọn lộ trình thì dòng mục tiêu ghi "Chưa chọn lộ trình" và liên kết đổi thành
      "Chọn lộ trình".
    why: learning-program.md (lộ trình là tùy chọn, không phần nào bị chặn vì chưa chọn).
