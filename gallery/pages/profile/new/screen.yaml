  - id: s2
    title: Dòng CV và liên kết xác minh khi rỗng
    shows: vùng CV nói thẳng điều cần làm ("Hoàn thành một bản dựng Harness, một dự án hoặc một bài Bản
      chất để có dòng đầu tiên") thay vì một danh sách trống; vùng liên kết nói liên kết xuất hiện
      khi một mục được xác minh. Đếm "0/3 mục Đã xác minh" vẫn hiện để học viên biết ngưỡng.
    why: verified-experience.md điều 4, unhandled-case-tells-customer.md (không để trống im lặng).
