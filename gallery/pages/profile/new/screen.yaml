    title: Tài khoản khi chưa có gì
    shows: máy và token rỗng mỗi bảng một câu ngắn ("Chưa nối máy nào.", "Chưa có token nào.") và vẫn
      giữ liên kết quản lý để học viên đi nối; gói ghi "Miễn phí" và "Phần 1 của mỗi bài Bản chất và
      toàn bộ Harness là miễn phí", liên kết "Quản lý gói" dẫn tới trang Premium.
    why: premium.md (bậc miễn phí), COOK 2026-11-17 mục access (Harness miễn phí cho mọi người).
