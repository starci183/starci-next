considered:
  - option: Như profile/overview, học viên mới.
    chosen: true
    why: "Chủ sản phẩm duyệt cả bảng vẽ ngày 20/11 và luật mới: một kiểu cho mỗi phần tử, bộ lọc là Tabs
      filter, chọn giá trị là ChoiceChips hoặc Select."
  - option: Hiện tên học viên mới bằng tên nhập sẵn
    chosen: false
    why: "Lỗi lõi đã biết (FOLLOWUPS): tên hiển thị lấy email của tài khoản khi học viên chưa chọn tên;
      sửa ở lõi, không phải ở app."
  - option: Coi ảnh trong Danh tính là ảnh mặc định
    chosen: false
    why: Thanh trên đã có avatar riêng của tài khoản; hai chỗ khác nhau làm người học không biết người
      khác thấy ảnh nào.
  - option: Mở chu kỳ audit mới sau khi sửa các lens còn mở ở vòng 4
    chosen: true
    why: 'Chu kỳ audit cũ: 4 vòng (builder mig-auth-fe, auditor next-ux-auditor, vòng cuối
      2026-11-20T22:24:05.141Z); lens cuối: order pass, layout open, actionable pass, live pass,
      words open, states pass, truth open. Sau vòng 4 đã sửa: lề nội dung 288/1408 (Page thường +
      Grid main-rail thay chrome panes), tên trống hiện "Chưa đặt tên" (khoá
      app.profile.identity.unnamed), avatar vẽ từ email tài khoản như thanh trên, dòng gói rút gọn
      không bị cắt ở 390; meta ghi "Học viên mới" khi chưa có tên, ảnh và dòng xác minh. Các vòng cũ
      nằm trong lịch sử git của file này. Mở chu kỳ mới theo đường harness đã duyệt (audit: null,
      audit run).'
