sections:
  - id: dai-dau-trang
    title: Dải đầu trang
    why: Tiêu đề là nhãn cố định nên giữ thật; dòng meta (loại tài khoản, gói, số mục) là thanh; nút
      Thêm ảnh và tên hay Sửa hồ sơ chỉ hiện khi biết học viên đã có ảnh và tên.
    law: "Luật của chủ sản phẩm 2026-11-21 cho trạng thái đang tải: dưới đường kẻ của dải đầu trang, mọi
      thứ là thanh Skeleton phẳng, một kiểu, không viền, không màu; dải đầu trang, thanh trên và
      thanh bên giữ nguyên."
    grammar: Page header, Skeleton text
  - id: cot-chinh
    title: Cột chính
    why: Danh tính (vòng ảnh và hai thanh), liên kết CV, các dòng CV đã xác minh và tài khoản đều là
      thanh phẳng, cùng một kiểu, không viền; ô liên kết và công tắc không vẽ khung xương riêng.
    law: "Luật của chủ sản phẩm 2026-11-21 cho trạng thái đang tải: dưới đường kẻ của dải đầu trang, mọi
      thứ là thanh Skeleton phẳng, một kiểu, không viền, không màu; dải đầu trang, thanh trên và
      thanh bên giữ nguyên."
    grammar: Grid main-rail, Skeleton circle, Skeleton text
  - id: cot-phai
    title: Cột phải
    why: Tiến độ nhanh và Kinh nghiệm là các thanh ở đúng chỗ của chúng.
    law: "Luật của chủ sản phẩm 2026-11-21 cho trạng thái đang tải: dưới đường kẻ của dải đầu trang, mọi
      thứ là thanh Skeleton phẳng, một kiểu, không viền, không màu; dải đầu trang, thanh trên và
      thanh bên giữ nguyên."
    grammar: Skeleton text
considered:
  - option: Dùng Switch isLoading và CopyField isLoading của Grammar
    chosen: false
    why: "Chủ sản phẩm từ chối: công tắc có khung xương khác màu và ô nhập còn viền (GRAMMAR-GAPS #16).
      Dùng thanh phẳng cho tới khi Grammar có hình cỡ control."
  - option: Trang khung xương vẽ tay, tiêu đề trang giữ thật
    chosen: true
    why: "Luật của chủ sản phẩm 2026-11-21 cho trạng thái đang tải: dưới đường kẻ của dải đầu trang, mọi
      thứ là thanh Skeleton phẳng, một kiểu, không viền, không màu; dải đầu trang, thanh trên và
      thanh bên giữ nguyên."
