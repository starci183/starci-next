title: Hồ sơ, đang tải
route: /profile
area: profile
summary: "Route: `/profile` (ảnh chụp: học viên seed `gallery-cv-multi` khi các truy vấn hồ sơ bị
  giữ). Dải đầu trang giữ tiêu đề Hồ sơ của bạn thật, dòng meta là thanh, nút đầu trang chờ dữ liệu;
  dưới đường kẻ là trang khung xương phẳng theo bố cục hai cột của trang đã tải. Mã:
  `fe/apps/app/src/components/blocks/ProfileHub/` (ProfileSkeleton)."
