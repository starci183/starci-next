sections:
  - id: khung-ung-dung
    title: Khung ứng dụng
    why: "khung chung của app, cùng một chỗ ở mọi trang đã đăng nhập: thanh trên, thanh bên, ngăn kéo ở 390."
    law: nền trắng, hairline 1px, không bóng (skills/claude-design/SKILL.md, mục The look; brand.css của app).
    grammar: "`WorkspaceShell`"
  - id: dai-tieu-de-ho-so-cua-ban
    title: "Dải tiêu đề: Hồ sơ của bạn"
    why: tên trang, dòng sự kiện và đúng một nút chính. "Sửa hồ sơ"; ở trang sửa là "Lưu thay đổi" (Hủy trung tính).
    law: một nút chính mỗi view, các nút khác trung tính (skills/claude-design/SKILL.md, mục The look).
    grammar: "`PageHeader`"
  - id: phan-tu-con-thieu
    title: Phần tử còn thiếu
    why: bản vẽ cần một phần tử mà Grammar chưa có và vẫn vẽ nó, đánh dấu trong khung.
    law: skills/claude-design/SKILL.md, mục Method (một phần tử Grammar còn thiếu không chặn bản vẽ); danh sách ở
      GRAMMAR-GAPS.md.
    grammar: "cần Grammar: vòng tiến độ quanh Avatar khi đang tải ảnh (ghép ProgressCircle với Avatar)"
