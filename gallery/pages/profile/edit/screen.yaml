          verdict: open
          notes: 'Nút "Chọn ảnh" chỉ khoảng 32px, dưới 40 và dưới vùng chạm 44 ở 390 (không nằm trong ListRow hay thanh công cụ dày). Đầu trang: Huỷ và Lưu thay đổi 40px, một dòng ở 390, không tràn. Ở 1440 ô tên (60 ký tự) và Select trải hết bề ngang khoảng 1120px, quá rộng so với nội dung.'
        actionable:
          verdict: pass
          notes: "Ảnh có Chọn ảnh (Xoá ảnh khi đã có ảnh, có xác nhận), tên có ô nhập và bộ đếm, lộ trình có Select, Lưu và Huỷ ở đầu."
