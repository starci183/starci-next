          verdict: open
          notes: "Khi ảnh đang tải lên chỉ đổi dòng gợi ý và tắt nút, không có vòng tiến độ quanh avatar như canvas vẽ (cần Grammar: Avatar progress, GRAMMAR-GAPS #10); không có ảnh chụp trạng thái đang tải ảnh để kiểm."
        words:
          verdict: open
          notes: 'Nút ghi "Huỷ" còn screen.yaml và một khoá khác trong vi.json ghi "Hủy"; gợi ý ghi "khoá" trong khi chỗ khác viết "khóa": một khái niệm hai cách viết. Gợi ý tên "Tên này không xuất hiện trên CV nếu bạn tắt công khai" khó hiểu và nhắc công tắc không có trên trang.'
        states:
          verdict: open
          notes: "Đang tải và lỗi có ảnh riêng (profile/edit-loading, profile/edit-error), nhưng thiếu ảnh tải ảnh lên, ảnh quá nặng, xác nhận xoá ảnh (canvas đã vẽ) và không có quyền ở 1440 và 390."
        truth:
          verdict: open
          notes: "s3 nói có công tắc công khai liên kết CV để đặt ngay lúc sửa, ảnh chụp bằng học viên chưa có mục xác minh nên không thấy công tắc: ảnh không chứng minh được mục s3. Lời gợi ý tên (không xuất hiện trên CV khi tắt công khai) cần đối chiếu verified-experience.md."
