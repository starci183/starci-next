    shows: trang con "Hồ sơ / Sửa". Ảnh gửi thẳng tới kho đối tượng và tự lưu; tên chờ "Lưu thay đổi"
      (Hủy trung tính); đang tải ảnh thì nút Lưu tắt; xóa ảnh hỏi xác nhận. Lưu xong quay về Hồ sơ
      với dòng "Đã cập nhật hồ sơ".
