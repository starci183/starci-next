      (không có mục riêng ở thanh bên). Nút chính "Sửa hồ sơ" (với học viên mới là "Thêm ảnh và tên"). Dòng dưới tiêu
      đề: Học viên · gói · số mục đã xác minh trên ngưỡng giới thiệu việc làm.'
