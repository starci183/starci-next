considered:
  - option: Không còn ngăn nền riêng ở cột bên; công tắc một kiểu.
    chosen: true
    why: "Chủ sản phẩm duyệt cả bảng vẽ ngày 20/11 và luật mới: một kiểu cho mỗi phần tử, bộ lọc là Tabs
      filter, chọn giá trị là ChoiceChips hoặc Select."
  - option: Cho pass vì tên không còn là email
    chosen: false
    why: Lỗi email đã hết, nhưng ảnh vẫn không phải trạng thái có dữ liệu, và nhãn trung tính trùng nhãn
      ô nhập.
  - option: Mở chu kỳ audit mới sau khi sửa các lens còn mở ở vòng 4
    chosen: true
    why: 'Chu kỳ audit cũ: 4 vòng (builder mig-auth-fe, auditor next-ux-auditor, vòng cuối
      2026-11-20T22:24:04.211Z); lens cuối: order pass, layout open, actionable pass, live pass,
      words open, states pass, truth open. Sau vòng 4 đã sửa: lề nội dung 288/1408 (Page thường +
      Grid main-rail thay chrome panes), tên trống hiện "Chưa đặt tên" (khoá
      app.profile.identity.unnamed), avatar vẽ từ email tài khoản như thanh trên, dòng gói rút gọn
      không bị cắt ở 390; ảnh chụp bằng học viên cv-multi có ba dòng đã xác minh. Các vòng cũ nằm
      trong lịch sử git của file này. Mở chu kỳ mới theo đường harness đã duyệt (audit: null, audit
      run).'
audit:
  builder:
    agent: next-one-edition
  auditor:
    agent: next-ux-auditor-2
  rounds:
    - n: 1
      at: 2026-11-21T03:56:47.485Z
      lenses:
        order:
          verdict: pass
          notes: 'Đầu trang có tiêu đề, dòng meta và nút chính "Thêm ảnh và tên"; rồi Danh tính, Liên kết CV, các dòng CV đã xác minh, Tài khoản; cột phải (Tiến độ nhanh, Kinh nghiệm) xuống cuối trang ở 390 đúng như mục s4.'
        layout:
          verdict: open
          notes: 'Ở 390 liên kết đầu mục "Mở Kinh nghiệm" đè lên dòng "3 mục đã xác minh, đủ để được giới thiệu việc làm"; "Xem tiến độ" cũng rơi xuống dòng riêng sát ngay hàng đầu tiên. Chiều cao: các nút "Sao chép", "Quản lý", "Xem Premium" chỉ khoảng 32px, dưới 40 và dưới vùng chạm 44 ở 390 (chúng không nằm trong đầu trang nên cỡ sm trong ListRow được phép, nhưng vùng chạm vẫn phải đủ 44). Không có nhãn xuống dòng: nút đầu trang và "Mở menu" nằm một dòng ở 390, đầu trang không tràn. Ở 1440 mô tả dòng CV bị cắt "…" làm mất mã /verify và phần bằng chứng.'
        actionable:
          verdict: open
          notes: 'Công tắc ở mỗi dòng CV không có nhãn nhìn thấy (chỉ nhãn ẩn), người học không biết bật là công khai dòng đó; mã /verify/… bị cắt "1CE…" nên không đọc được dù là giá trị để chia sẻ. Các giá trị khác đều có đường đổi (Chọn lộ trình, Thêm ảnh và tên, Quản lý, Xem Premium, công tắc liên kết CV).'
        live:
          verdict: open
          notes: "Công tắc liên kết CV tắt khi đang lưu, nhưng công tắc từng dòng CV (toggleLine) không có trạng thái đang lưu hay lỗi: bấm xong không thấy chờ, hỏng không thấy báo. Trang không có việc chạy dài nào khác."
        words:
          verdict: open
          notes: '"Bài Accepted" lẫn tiếng Anh; thanh bên ghi "Projects" còn huy hiệu dòng CV ghi "Dự án" (hai từ cho một khái niệm), "Essentials" cạnh "StarCi Bản chất" trong cùng một dòng; người ký lúc là "Thầy", lúc là "Người duyệt do thầy chỉ định"; mã /verify hiện thô và bị cắt.'
        states:
          verdict: open
          notes: "Code có SlotView cho đang tải, lỗi từng vùng và forbidden=hide, nhưng gallery không có ảnh profile/overview đang tải, lỗi một vùng hay không có quyền ở 1440 và 390, dù canvas đã vẽ overview-loading và overview-partial-error. Chỉ có trạng thái có dữ liệu (và profile/new cho rỗng)."
        truth:
          verdict: open
          notes: 'Summary ghi ảnh chụp "hai dòng CV, một máy nối, gói miễn phí" nhưng ảnh có ba dòng, "Chưa nối máy nào" và gói Premium. Cột phải ghi 0 khái niệm đã chứng minh, 0 bài, chuỗi 0 ngày trong khi có ba mục đã xác minh từ dự án và Essentials: dữ liệu mẫu không khớp nhau. Liên kết CV dùng slug "learner-4" giống mã nội bộ, không phải slug người đọc được.'
  escalate: null
