sections:
  - id: s1
    title: Mục tiêu
    shows: 'thấy mình hiện ra thế nào với người khác, đổi ảnh và tên, lấy liên kết CV; từ đây vào Kinh
      nghiệm và Tiến độ (không có mục riêng ở thanh bên). Nút chính "Sửa hồ sơ" (với học viên mới là
      "Thêm ảnh và tên"). Dòng dưới tiêu đề: Học viên · gói · số mục đã xác minh trên ngưỡng giới
      thiệu việc làm.'
    why: Theo khung Grammar 0.50 của màn này.
    actions: []
    states:
      loading: null
      empty: null
      error: null
    needsApi: []
  - id: s2
    title: Danh tính và liên kết CV
    shows: ảnh, tên, email và lộ trình mục tiêu. Liên kết CV tổng hợp (myCvLink) là hộp có Sao chép và
      công tắc "Cho người khác xem CV bằng liên kết này" (setCvVisibility); chưa có dòng đã xác minh
      thì chỉ nói khi nào liên kết xuất hiện.
    why: Theo khung Grammar 0.50 của màn này.
