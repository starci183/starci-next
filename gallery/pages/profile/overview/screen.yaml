considered:
  - option: Không còn ngăn nền riêng ở cột bên; công tắc một kiểu.
    chosen: true
    why:
      "Chủ sản phẩm duyệt cả bảng vẽ ngày 20/11 và luật mới: một kiểu cho mỗi phần tử, bộ lọc là Tabs filter, chọn giá
      trị là ChoiceChips hoặc Select."
  - option: Cho pass vì tên không còn là email
    chosen: false
    why: Lỗi email đã hết, nhưng ảnh vẫn không phải trạng thái có dữ liệu, và nhãn trung tính trùng nhãn ô nhập.
  - option: Mở chu kỳ audit mới sau khi sửa các lens còn mở ở vòng 4
    chosen: true
    why:
      'Chu kỳ audit cũ: 4 vòng (builder mig-auth-fe, auditor next-ux-auditor, vòng cuối 2026-11-20T22:24:04.211Z); lens
      cuối: order pass, layout open, actionable pass, live pass, words open, states pass, truth open. Sau vòng 4 đã sửa:
      lề nội dung 288/1408 (Page thường + Grid main-rail thay chrome panes), tên trống hiện "Chưa đặt tên" (khoá
      app.profile.identity.unnamed), avatar vẽ từ email tài khoản như thanh trên, dòng gói rút gọn không bị cắt ở 390;
      ảnh chụp bằng học viên cv-multi có ba dòng đã xác minh. Các vòng cũ nằm trong lịch sử git của file này. Mở chu kỳ
      mới theo đường harness đã duyệt (audit: null, audit run).'
  - option: "Auditor vòng 2: cho layout pass vì Grammar cho phép Switch compact trong hàng danh sách"
    chosen: false
    why: "Grammar cho phép compact, nhưng công tắc liên kết CV cũng là hàng cài đặt có nhãn và mô tả; hai kiểu trên một
      trang trái luật một kiểu cho mỗi phần tử và trái chính summary."
audit:
  builder:
    agent: next-one-edition
  auditor:
    agent: next-ux-auditor-3
  rounds:
    - n: 1
      at: 2026-11-21T03:56:47.485Z
      lenses:
        order:
          verdict: pass
          notes:
            Đầu trang có tiêu đề, dòng meta và nút chính "Thêm ảnh và tên"; rồi Danh tính, Liên kết CV, các dòng CV đã xác
            minh, Tài khoản; cột phải (Tiến độ nhanh, Kinh nghiệm) xuống cuối trang ở 390 đúng như mục s4.
        layout:
          verdict: open
          notes:
            'Ở 390 liên kết đầu mục "Mở Kinh nghiệm" đè lên dòng "3 mục đã xác minh, đủ để được giới thiệu việc làm"; "Xem
            tiến độ" cũng rơi xuống dòng riêng sát ngay hàng đầu tiên. Chiều cao: các nút "Sao chép", "Quản lý", "Xem
            Premium" chỉ khoảng 32px, dưới 40 và dưới vùng chạm 44 ở 390 (chúng không nằm trong đầu trang nên cỡ sm
            trong ListRow được phép, nhưng vùng chạm vẫn phải đủ 44). Không có nhãn xuống dòng: nút đầu trang và "Mở
            menu" nằm một dòng ở 390, đầu trang không tràn. Ở 1440 mô tả dòng CV bị cắt "…" làm mất mã /verify và phần
            bằng chứng.'
        actionable:
          verdict: open
          notes:
            Công tắc ở mỗi dòng CV không có nhãn nhìn thấy (chỉ nhãn ẩn), người học không biết bật là công khai dòng đó; mã
            /verify/… bị cắt "1CE…" nên không đọc được dù là giá trị để chia sẻ. Các giá trị khác đều có đường đổi (Chọn
            lộ trình, Thêm ảnh và tên, Quản lý, Xem Premium, công tắc liên kết CV).
        live:
          verdict: open
          notes:
            "Công tắc liên kết CV tắt khi đang lưu, nhưng công tắc từng dòng CV (toggleLine) không có trạng thái đang lưu hay
            lỗi: bấm xong không thấy chờ, hỏng không thấy báo. Trang không có việc chạy dài nào khác."
        words:
          verdict: open
          notes:
            '"Bài Accepted" lẫn tiếng Anh; thanh bên ghi "Projects" còn huy hiệu dòng CV ghi "Dự án" (hai từ cho một khái
            niệm), "Essentials" cạnh "StarCi Bản chất" trong cùng một dòng; người ký lúc là "Thầy", lúc là "Người duyệt
            do thầy chỉ định"; mã /verify hiện thô và bị cắt.'
        states:
          verdict: open
          notes:
            Code có SlotView cho đang tải, lỗi từng vùng và forbidden=hide, nhưng gallery không có ảnh profile/overview đang
            tải, lỗi một vùng hay không có quyền ở 1440 và 390, dù canvas đã vẽ overview-loading và
            overview-partial-error. Chỉ có trạng thái có dữ liệu (và profile/new cho rỗng).
        truth:
          verdict: open
          notes:
            'Summary ghi ảnh chụp "hai dòng CV, một máy nối, gói miễn phí" nhưng ảnh có ba dòng, "Chưa nối máy nào" và gói
            Premium. Cột phải ghi 0 khái niệm đã chứng minh, 0 bài, chuỗi 0 ngày trong khi có ba mục đã xác minh từ dự
            án và Essentials: dữ liệu mẫu không khớp nhau. Liên kết CV dùng slug "learner-4" giống mã nội bộ, không phải
            slug người đọc được.'
    - n: 2
      at: 2026-11-21T04:23:06.592Z
      lenses:
        order:
          verdict: pass
          notes:
            "Giữ thứ tự vòng 1: đầu trang (tiêu đề, meta, nút chính), Danh tính, Liên kết CV, CV đã xác minh, Tài khoản; cột
            phải xuống cuối ở 390."
        layout:
          verdict: open
          notes:
            'Đã sửa: "Mở Kinh nghiệm" không còn đè chữ; Quản lý, Xem Premium, Xem tiến độ, Mở Kinh nghiệm cao 40px; mã
            /verify hiện đủ ở 1440. Còn: (1) hai kiểu công tắc trên cùng trang: công tắc liên kết CV là toggle 72x40,
            công tắc mỗi dòng là compact 32x18, dù cả hai là hàng cài đặt có nhãn và mô tả (Grammar dành compact cho
            hàng cài đặt); summary ghi "công tắc một kiểu" nhưng ảnh không đúng. (2) Tiến độ nhanh: danh sách số chỉ
            rộng khoảng 100px trong cột phải 320px, nhãn "Khái niệm đã chứng minh" xuống hai dòng ở 1440 và 390.
            Checklist: nút đầu trang 40px, một dòng, không tràn ở 390; công tắc compact lấy cả nhãn làm vùng chạm nên đủ
            44.'
        actionable:
          verdict: fixed
          notes:
            'Công tắc mỗi dòng CV nay có nhãn "Hiện trên CV công khai" và mô tả; mã /verify đọc đủ ở 1440, ở 390 rút giữa
            nhưng có nút Sao chép.'
        live:
          verdict: fixed
          notes: "Công tắc mỗi dòng có lineState: đang lưu thì tắt và mô tả đổi sang câu đang lưu, hỏng thì errorMessage
            (ProfileHub cvRowOf). Không có ảnh của hai trạng thái này, kiểm trên code."
        words:
          verdict: open
          notes:
            '"Bài Accepted" ở Tiến độ nhanh vẫn lẫn tiếng Anh (khoá dùng chung với Luyện code, cần một từ tiếng Việt cho cả
            app); dòng CV thứ hai gắn huy hiệu "Essentials" nhưng câu mô tả viết "(StarCi Bản chất)", hai tên cho một
            phần. Huy hiệu "Projects" nay khớp thanh bên.'
        states:
          verdict: pass
          notes:
            "Đang tải (profile/overview-loading) và lỗi một vùng (profile/overview-partial-error) đã có ảnh 1440 và 390; rỗng
            ở profile/new; không có quyền: Tài khoản dùng forbidden=hide. Trạng thái tải ảnh thuộc profile/edit."
        truth:
          verdict: open
          notes:
            'Summary vẫn ghi ảnh chụp "hai dòng CV Đã xác minh, một máy nối, gói miễn phí" trong khi ảnh có ba dòng, "Chưa
            nối máy nào" và Premium. Slug liên kết CV vẫn "learner-4" như mã nội bộ (nếu slug đọc được do API sinh thì
            ghi "cần API"). Số 0 ở Tiến độ nhanh là lỗ seed đã biết của học viên cv-multi, không tính.'
  escalate: null
