    title: CV đã xác minh và tài khoản
    shows: mỗi dòng là một mục Đã xác minh với người ký, ngày, bằng chứng, mã /verify/…, nút Sao chép và
      công tắc công khai riêng. Rỗng thì có chỉ dẫn và nút. Tài khoản gồm máy đã nối và gói, mỗi
      hàng một liên kết.
    why: Theo khung Grammar 0.50 của màn này.
