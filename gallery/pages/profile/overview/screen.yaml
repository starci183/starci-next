    title: Mục tiêu
    shows: 'thấy mình hiện ra thế nào với người khác, đổi ảnh và tên, lấy liên kết CV; từ đây vào Kinh
      nghiệm và Tiến độ (không có mục riêng ở thanh bên). Nút chính "Sửa hồ sơ" (với học viên mới là
      "Thêm ảnh và tên"). Dòng dưới tiêu đề: Học viên · gói · số mục đã xác minh trên ngưỡng giới
      thiệu việc làm.'
    why: Theo khung Grammar 0.50 của màn này.
