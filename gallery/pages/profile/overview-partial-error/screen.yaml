sections:
  - id: cv-da-xac-minh
    title: CV đã xác minh (lỗi)
    why: "Mỗi vùng đọc riêng: vùng hỏng giữ tiêu đề để người học biết phần nào lỗi, kèm một việc làm
      tiếp (Thử lại), không che các vùng khác."
    law: unhandled-case-tells-customer.md
    grammar: Section, Text, Button
  - id: cot-phai
    title: Cột phải
    why: Kinh nghiệm không khẳng định 0 đã xác minh khi không đọc được; Tiến độ nhanh chiếm hết bề rộng
      cột nên nhãn không gãy.
    law: unhandled-case-tells-customer.md
    grammar: Section layout=keyValue
  - id: cac-vung-con-lai
    title: Các vùng còn lại
    why: Danh tính, liên kết CV và tài khoản hiện bình thường.
    law: verified-experience.md
    grammar: Section
considered:
  - option: Một Alert thay cả vùng, không có tiêu đề
    chosen: false
    why: "Vòng audit trước: không nói được phần nào hỏng."
  - option: Đổi chữ Accepted sang tiếng Việt
    chosen: false
    why: Accepted là thuật ngữ chung của khu Luyện code trên toàn app (kết quả của máy chấm); đổi ở một
      nơi sẽ lệch các nơi khác.
  - option: Bỏ dòng Học viên · Premium dưới tiêu đề
    chosen: false
    why: "Dòng meta của trang hồ sơ theo canvas: loại tài khoản, gói và số mục đã xác minh của chính
      trang này."
  - option: Owner decision on "Bài Accepted" (2026-11-21)
    chosen: true
    why: The owner kept "Accepted" as the app-wide grading term of Luyện code ("ok" to the coordinator
      proposal).
