summary: "Route: `/profile` (ảnh chụp: học viên seed `gallery-cv-multi` khi truy vấn MyExperience bị
  từ chối). Các vùng khác vẫn hiện đủ; phần CV đã xác minh giữ tiêu đề với câu Không tải được phần
  này và nút Thử lại 40px; cột Kinh nghiệm nói chưa tải được số mục thay vì 0. Mã:
  `fe/apps/app/src/components/blocks/ProfileHub/`."
