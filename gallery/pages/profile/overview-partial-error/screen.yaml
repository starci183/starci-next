schema: 1
screen: profile/overview-partial-error
title: Hồ sơ, một vùng lỗi
route: /profile
area: profile
summary: '**Concept: Hồ sơ, một vùng lỗi.** Trạng thái của màn này: một vùng lỗi. Mục tiêu: thấy
  mình hiện ra thế nào với người khác, đổi ảnh và tên, lấy liên kết CV; từ đây vào Kinh nghiệm và
  Tiến độ. Thao tác: myProfile (displayName, avatarUrl, goal, limits: contentTypes, maxBytes,
  nameMax), setProfileName, requestAvatarUpload rồi trình duyệt gửi thẳng tới kho đối tượng và
  confirmAvatarUpload, removeAvatar; myExperience (dòng đã xác minh), showExperience,
  verifyExperience (trang /verify/{mã}). cần API: liên kết CV tổng hợp next.starci.vn/cv/{slug}
  (cvLink, setCvVisibility); hiện chỉ có liên kết theo từng dòng. Bố cục: Khung chung: thanh trên
  (logo, StarCi Next, gói, ngôn ngữ, giao diện, avatar) và thanh bên Học · Essentials · Projects ·
  Harness · Luyện code · Ôn tập · Hồ sơ; ở 390 thanh bên vào ngăn kéo mở bằng nút menu. Dải đầu;
  thân: Danh tính (ảnh, tên, email, lộ trình), Liên kết CV (hộp liên kết có Sao chép, công tắc công
  khai), CV đã xác minh (dòng CV, ai ký ngày nào bằng chứng gì, mã verify, công tắc công khai từng
  dòng), Tài khoản (máy, gói). Cột phải: tiến độ nhanh với liên kết "Xem tiến độ" và tóm tắt Kinh
  nghiệm với "Xem kinh nghiệm". Sửa là trang con "Hồ sơ / Sửa". Ảnh: kiểm loại và dung lượng ở trình
  duyệt, đang tải có vòng phần trăm, lỗi quá nặng nói giới hạn lấy từ server, xóa ảnh có xác nhận.
  Nút chính: "Sửa hồ sơ"; ở trang sửa là "Lưu thay đổi" (Hủy trung tính). Lọc: không có. Khác bản
  hiện tại: Hồ sơ là cửa vào Kinh nghiệm và Tiến độ (thanh bên chỉ còn một mục Hồ sơ). Lưu ý xung
  đột: một vùng lỗi không làm hỏng cả trang. Phần tử Grammar của màn: PageHeader, Section, Avatar,
  ProgressCircle, FileButton, Input, Switch, CopyField, Section kind="list", ListRow, AlertDialog.'
