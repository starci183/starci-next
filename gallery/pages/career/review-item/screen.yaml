  `fe/apps/app/src/components/blocks/ReviewItem/component.tsx`. Thầy và người duyệt thấy bảng duyệt
  của một mục (ảnh chụp: học viên seed `gallery-career-teacher`, vai TEACHER, mở một mục Dự án đang
  chờ thầy duyệt trên dữ liệu thật của dev). Tài khoản thường thấy trạng thái cấm, xem
  `career/review-item-forbidden`."
