sections:
  - id: dai-dau-trang
    title: Dải đầu trang
    why: đường dẫn Duyệt kinh nghiệm / Một mục cần duyệt nằm trong `Page header`, thay cho liên kết
      "quay lại" đứng riêng trước đây.
    law: "`page-header-left-sublabel-xs.md`."
    grammar: "`Page header={{ title, breadcrumbs }}`."
  - id: bang-duyet
    title: Bảng duyệt
    why: "cùng bảng duyệt như hàng chờ: thẻ mục, ba danh sách (Bằng chứng, AI chấm theo tiêu chí, Câu
      hỏi bảo vệ), ô ghi chú với Xác minh (nút chính) và Trả lại, Thu hồi cho thầy trên mục đã xác
      minh, rồi Lịch sử."
    law: "`verified-experience-per-part.md`."
    grammar: '`SurfaceCard`, `Section kind="list"`, `Textarea`, `Button`.'
considered:
  - option: Dùng tên mục làm tiêu đề trang
    chosen: true
    why: Canvas đã duyệt làm vậy; tiêu đề chung không nói đang duyệt mục nào.
