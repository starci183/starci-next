schema: 1
screen: career/review-queue-loading
title: Duyệt trải nghiệm, đang tải
route: /review-queue
area: career
summary: "Route: `/review-queue` (ảnh chụp: thầy seed `gallery-career-teacher` khi truy vấn
  ReviewQueue bị giữ). Dải đầu trang giữ đường dẫn Hồ sơ / Duyệt kinh nghiệm, tiêu đề Duyệt kinh
  nghiệm và hai tab Hàng đợi / Người duyệt thật; dòng đếm dưới tiêu đề là một thanh. Dưới đường kẻ
  là khung xương của lưới hàng đợi: cột danh sách (tiêu đề, hàng nút lọc, các hàng) bên trái và
  panel xem trước bên phải. Mã: `fe/apps/app/src/components/blocks/ReviewQueue/` (QueueSkeleton,
  ReviewItem/skeleton.tsx)."
