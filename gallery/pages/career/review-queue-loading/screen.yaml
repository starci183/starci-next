sections:
  - id: dai-dau-trang
    title: Dải đầu trang
    why: Tiêu đề và tab là nhãn cố định nên giữ thật trong lúc tải; dòng đếm (số mục chờ, quá hạn) phụ
      thuộc dữ liệu nên là một thanh cùng cỡ dòng meta, để dải không cao lên khi dữ liệu về.
    law: "Luật của chủ sản phẩm 2026-11-21 cho trạng thái đang tải: dưới đường kẻ của dải đầu trang, mọi
      thứ là Skeleton của HeroUI (if-else, chỉ đặt cỡ và bo góc), một kiểu, không viền, không màu;
      dải đầu trang, thanh trên và thanh bên giữ nguyên."
    grammar: Page header, Skeleton (HeroUI)
  - id: luoi-hang-doi
    title: Lưới hàng đợi
    why: Cột danh sách (thanh tiêu đề, thanh hàng nút lọc, ba hàng) và panel xem trước đều là thanh ở
      đúng chỗ của lưới khi đã tải; không có chữ, nút hay câu chọn một mục trong lúc chờ.
    law: "Luật của chủ sản phẩm 2026-11-21 cho trạng thái đang tải: dưới đường kẻ của dải đầu trang, mọi
      thứ là Skeleton của HeroUI (if-else, chỉ đặt cỡ và bo góc), một kiểu, không viền, không màu;
      dải đầu trang, thanh trên và thanh bên giữ nguyên."
    grammar: Grid main-rail, Skeleton (HeroUI)
considered:
  - option: Page isLoading của Grammar cho cả dải đầu trang
    chosen: false
    why: Biến cả tiêu đề cố định thành khung xương; luật giữ dải đầu trang thật.
  - option: Placeholder có ba tab lọc và một preview giả
    chosen: false
    why: Hiện chữ giả và câu chọn một mục trong lúc tải; luật cấm chữ trong vùng nội dung.
  - option: Trang khung xương vẽ tay theo lưới đã tải, tiêu đề và tab giữ thật
    chosen: true
    why: "Luật của chủ sản phẩm 2026-11-21 cho trạng thái đang tải: dưới đường kẻ của dải đầu trang, mọi
      thứ là Skeleton của HeroUI (if-else, chỉ đặt cỡ và bo góc), một kiểu, không viền, không màu;
      dải đầu trang, thanh trên và thanh bên giữ nguyên."
