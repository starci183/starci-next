considered:
  - option: Lọc theo nguồn là Tabs kind="filter" có số đếm; nút gửi duyệt trong thẻ là nút trung tính
      (một nút chính mỗi trang).
    chosen: true
    why: "Chủ sản phẩm duyệt cả bảng vẽ ngày 20/11 và luật mới: một kiểu cho mỗi phần tử, bộ lọc là Tabs
      filter, chọn giá trị là ChoiceChips hoặc Select."
  - option: Nút Thu hồi trên thẻ đã xác minh của học viên
    chosen: false
    why: "Cần API: revokeExperience chỉ dành cho thầy (lõi từ chối học viên); canvas vẽ Thu hồi cho học
      viên nhưng chưa có thao tác rút lại phía học viên. Tab Đã thu hồi vẫn hiện các mục thầy đã thu
      hồi."
  - option: Hiện khóa nội bộ của mục làm dòng phụ
    chosen: false
    why: Lõi đọc kinh nghiệm nay trả subjectLabel (nhãn người đọc được từ ô chủ đề của danh mục, hoặc
      null) bên cạnh khóa subject; danh sách chỉ hiện nhãn, không đoán theo hình dạng chuỗi.
