    shows: nguồn và trạng thái ở đầu thẻ, ngày ký hoặc gửi ở cuối dòng đầu, rồi tiêu đề, chủ đề, chip
      bằng chứng, hành động tiếp theo. Mục Đã xác minh có công tắc Công khai và nút Sao chép liên
