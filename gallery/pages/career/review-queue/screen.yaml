title: Hàng chờ duyệt (chỉ thầy và người duyệt)
route: /review-queue
area: career
summary: "Route: `/review-queue`. Mã: `fe/apps/app/src/components/blocks/ReviewQueue/component.tsx`.
  Người duyệt thấy hàng chờ và bảng duyệt của mục đang chọn; thầy có thêm các lọc Quá hạn, Chưa giao
  và tab Người duyệt (ảnh chụp: học viên seed `gallery-career-teacher`, vai TEACHER, trên dữ liệu
  thật của dev). Tài khoản thường chỉ thấy trạng thái cấm, xem `career/review-queue-forbidden`."
