            gãy ở 390; hàng danh sách bấm cả hàng nên vùng bấm trên 44px; tràn ở thanh tab như trên.
            Phần "Bạn duyệt phần Backend" của meta cần API (reviewQueue không trả các phần người
            duyệt phụ trách, đã kiểm query-review-queue.ts).'
        actionable:
