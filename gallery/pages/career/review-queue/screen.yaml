sections:
  - id: dai-dau-trang
    title: Dải đầu trang
    why: tên trang và đường dẫn về hồ sơ, như mọi trang khác; trước đây trang không có tiêu đề.
    law: "`page-header-left-sublabel-xs.md`."
    grammar: "`Page header={{ title, breadcrumbs }}`."
  - id: loc-hang-cho
    title: Lọc hàng chờ
    why: Chờ duyệt, Quá hạn, Chưa giao (và Người duyệt cho thầy) là các tab lọc có số đếm; Quá hạn mang
      dấu chú ý khi còn mục.
    law: "`choice-controls.md` (Tabs lọc danh sách)."
    grammar: '`Tabs kind="filter"` với `count`, `isAttention`.'
  - id: hang-cho
    title: Hàng chờ
    why: "mỗi mục là một hàng danh sách: câu mô tả, người học và phần, huy hiệu hạn duyệt; bấm hàng để
      xem bên phải, hàng đang xem có vạch nhấn."
    law: "`rows-in-card.md`, `list-row` một kiểu cho một hàng."
    grammar: '`Section kind="list"` với `ListRow badges onPress edgeTone`.'
  - id: bang-duyet
    title: Bảng duyệt
    why: thẻ mục (phần, người học, trạng thái, dòng AI soạn hai ngôn ngữ), rồi các danh sách Bằng chứng,
      AI chấm theo tiêu chí, Câu hỏi bảo vệ; sau đó Xác minh (nút chính duy nhất) hoặc Trả lại kèm
      ghi chú, Thu hồi cho thầy, và Lịch sử.
    law: "`verified-experience-per-part.md`, một nút chính mỗi view."
    grammar: '`SurfaceCard`, `Section kind="list"`, `Textarea`, `Button`.'
  - id: nguoi-duyet-thay
    title: Người duyệt (thầy)
    why: "bổ nhiệm người duyệt và danh sách người đang duyệt, mỗi hàng có nút Kết thúc cao 40px. CHƯA
      ĐỦ: ô người duyệt vẫn nhận mã người dùng gõ tay; cần API danh sách thành viên để chọn."
    law: copy tiếng Việt, không mã thô.
    grammar: '`Input`, `CheckboxGroup`, `NumberField`, `Section kind="list"`.'
considered:
  - option: Ở 390 giữ bảng duyệt trên danh sách
    chosen: false
    why: Người duyệt đến để chọn mục; danh sách là việc đầu tiên, và trang con career/review-item đã có
      sẵn bảng duyệt.
  - option: Coi mã HV-… là ẩn danh có chủ ý
    chosen: false
    why: Canvas đã duyệt hiện tên người học cho người duyệt; nếu ẩn danh là luật mới thì cần ghi vào
      screen.yaml.
