    - n: 2
      at: 2026-11-21T03:59:54.000Z
      lenses:
        order:
          verdict: fixed
          notes: 'Ở 390 "Hàng chờ duyệt" giờ đứng ngay sau thanh lọc, bảng duyệt xuống dưới năm hàng; ở 1440
            hàng chờ bên trái, bảng duyệt bên phải.'
        layout:
          verdict: open
          notes: 'Đã có đường dẫn "Hồ sơ / Duyệt kinh nghiệm" và dòng meta "5 mục đang chờ · 1 quá hạn"; cột
