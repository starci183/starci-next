  - id: s2
    title: Probe, CI, AI đọc code, thang chấm
    shows: nhật ký probe dạng terminal, bảng mô tả run CI, hai biểu mẫu (chỉ code và endpoint; gửi đoạn
      code cho thầy), thang chấm của AI.
    why: nhãn nhóm trong biểu mẫu là tiêu đề mục, không in đậm.
    actions: []
