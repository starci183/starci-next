summary: "Route: mọi địa chỉ dưới một ngôn ngữ mà không trang nào nhận (ảnh chụp:
  `/vi/khong-co-trang-nay`). Mã: `fe/apps/landing/src/app/[locale]/[...rest]/page.tsx` gọi
  `notFound()`, `app/[locale]/not-found.tsx` vẽ trang; `app/not-found.tsx` là bản gốc cho địa chỉ
  không thuộc ngôn ngữ nào. Trả HTTP 404."
