  - id: trang-thai-khong-tim-thay
    title: Trạng thái không tìm thấy
    why: một trạng thái cấp trang, có hình minh hoạ, một câu nói trang không còn ở đây hoặc đường dẫn gõ
      sai, và MỘT nút "Về trang chủ"; không có nút thử lại vì đây không phải lỗi mạng. Chữ theo ngôn
      ngữ của địa chỉ.
    law: "`surface-layering` (một nút chính)."
    grammar: '`EmptyNotice scope="page"` (`composite/EmptyNotice`) qua `NotFoundNotice` của
      `@starci-next/ui`.'
