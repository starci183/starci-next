sections:
  - id: dai-thuong-hieu-starci-next
    title: Dải thương hiệu "starci-next"
    why: 'một dải trắng cao một hàng, đường kẻ dưới, chỉ có tên dự án bằng chữ thường ở góc trái; không
      logo, không điều hướng, không đổi ngôn ngữ. CHƯA RÕ: ứng dụng học dùng logo StarCi và thanh
      trên có đổi ngôn ngữ, sáng tối; landing dùng chữ thường trần "starci-next" nên chưa cùng
      thương hiệu.'
    law: "`surface-layering` (chrome trắng, phẳng, chỉ đường kẻ)."
    grammar: "`TopBar` chưa dùng; dải là khung dựng sẵn của bộ dựng (`fe/apps/landing/src/features`)."
  - id: dai-tieu-de-chao-mung-den-voi-starci-next
    title: Dải tiêu đề "Chào mừng đến với starci-next"
    why: "dải trắng phẳng, đường kẻ dưới, tiêu đề 18/600 sát trái: lời chào chung của khung. CHƯA RÕ:
      không nói StarCi Next là gì, cho ai, học gì; đây là chữ mặc định của bộ dựng chứ chưa phải lời
      giới thiệu sản phẩm."
    law: "`page-header-left-sublabel-xs.md`, `type-scale-14-12.md`."
    grammar: "`Page header={{ title }}` (`frame/Page/index.d.ts`)."
  - id: doan-mo-ta-va-nut-mo-ung-dung
    title: Đoạn mô tả và nút "Mở ứng dụng"
    why: 'một dòng muted "Mọi thứ bạn cần đều ở trong ứng dụng." và MỘT nút chính "Mở ứng dụng" (viên
      thuốc, màu accent tím) dẫn sang ứng dụng học, cùng họ màu với ứng dụng học. Ghi chú lỗi ảnh:
      khối thân thụt vào so với dải tiêu đề (chữ bắt đầu ở x=112 ở 1440, trong khi tiêu đề ở x=32);
      ở 390 thì thẳng lề. Nút chính vẽ nền tím nhạt với chữ đen.'
    law: "`surface-layering` (một nút chính), `theme-and-type` (accent là tín hiệu của nút chính)."
    grammar: '`Button intent="commit" href` (`leaf/Button`).'
  - id: phan-bien
    title: Phản biện
    why: tự phản biện của lần chụp này; liệt kê điều còn sai trên màn hình, không sửa trong lần chụp
      (chủ duyệt rồi mới sửa).
    law: "`surface-layering`, `theme-and-type`."
    grammar: 'không phải vùng của màn hình; không có thành phần. - 1440: khối thân (dòng mô tả và nút)
      thụt vào x=112 ở 1440 trong khi dải thương hiệu và tiêu đề dính x=32; ba cột lề khác nhau,
      lệch trục. - 390: thân thẳng lề với tiêu đề, nhưng nút "Mở ứng dụng" chỉ rộng bằng chữ, không
      có dấu hiệu là CTA chính của trang; nửa dưới màn hình trống. - 1440, 390, dải thương hiệu: chữ
      "starci-next" thường, nhỏ, không logo, không điều hướng; khác thương hiệu ứng dụng học (logo
      StarCi Next). - 1440, 390, tiêu đề "Chào mừng đến với starci-next" là lời chào mặc định, không
      nói sản phẩm là gì; dòng mô tả "Mọi thứ bạn cần đều ở trong ứng dụng." xám nhạt cỡ 14, tương
      phản thấp. - 1440: gần 80% chiều cao trang trống, nội dung dồn lên trên trái.'
