  phẩm. Toàn trang trắng, các dải ngăn nhau bằng đường kẻ 1px. Mã nguồn màn hình nay nằm trong nhóm
  tuyến `(pages)`; giao diện không đổi. Mã nguồn màn hình nay nằm trong nhóm tuyến `(pages)`; giao
  diện không đổi."
