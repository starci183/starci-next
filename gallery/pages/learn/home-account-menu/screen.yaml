considered:
  - option: Bản vẽ đã duyệt 2026-11-20 (Duyệt hết)
    chosen: true
    why: "Mã theo canvas đã duyệt; luật Grammar 0.50: một nút chính, nút cao 40, không minh họa trong
      thẻ, chỉ SlotView rẽ nhánh tải"
  - option: '1440, 390, vị trí menu: lớp nổi dính ngay dưới avatar, mép trên khoảng y=60 chạm vạch kẻ
      dưới thanh trên và che nút "Xem hướng dẫn" (chỉ còn thấy chữ "n" lọt ra ở 1440) cùng dòng phụ
      của dải tiêu đề ở 390; không có khoảng thở giữa trigger và menu.'
    chosen: false
    why: Ghi nhận ở lần chụp trước, chưa làm
  - option: '1440, 390, bóng và góc bo: góc bo rất lớn (khoảng 20px) và bóng mềm lan rộng, lớn hơn mọi
      chỗ khác; đúng luật "lớp nổi mới có bóng" nhưng góc bo không cùng họ với nút và ô.'
    chosen: false
    why: Ghi nhận ở lần chụp trước, chưa làm
  - option: '390, hàng email: bị bẻ giữa chữ ("gallery-" / "theme@example.test"), xuống hai dòng và làm
      hàng cao hơn các hàng khác.'
    chosen: false
    why: Ghi nhận ở lần chụp trước, chưa làm
