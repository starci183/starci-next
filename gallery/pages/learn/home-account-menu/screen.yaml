  - id: s4
    title: Nhãn nhóm "Tài khoản"
    shows: '`DropdownMenuSection` của Grammar luôn vẽ tiêu đề nhóm (12 mờ); nhãn "Tài khoản" đặt tên cho
      nhóm gồm hàng danh tính, lệnh gói, hồ sơ cho trình đọc màn hình. Giữ hay bỏ là quyết định của
      chủ sản phẩm.'
    why: "`surface-layering` (nhãn nhóm 12, weight 500, mờ)."
