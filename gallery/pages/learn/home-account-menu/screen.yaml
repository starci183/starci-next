sections:
  - id: s1
    title: Hàng danh tính
    shows: 'đầu menu cho biết đang đăng nhập là ai (email) và gói hiện tại (dòng 12 mờ "Premium" / "Chưa
      có Premium"). Là một hàng không dẫn đi đâu. Ghi chú lỗi ảnh: ở 390 email dài bị bẻ giữa chữ
      ("gallery-" / "theme@example.test") và menu che dòng phụ của dải tiêu đề.'
    why: "`surface-layering`, `type-scale-14-12.md`; plan in the avatar menu, no sidebar footer (owner
      2026-11-10)."
    actions: []
    states:
      loading: null
      empty: null
      error: null
    needsApi: []
  - id: s2
    title: Lệnh gói
    shows: 'hành động đầu tiên sau danh tính. Chưa Premium: "Nâng cấp Premium"; đã Premium: "Gói của
      bạn" (như ảnh); cả hai là liên kết thật tới trang Premium, chữ foreground thường, không
      accent.'
    why: "`surface-layering` (liên kết điều hướng không ↗), `theme-and-type` (liên kết phụ là plain,
      không accent)."
    actions: []
    states:
      loading: null
      empty: null
      error: null
    needsApi: []
  - id: s3
    title: Hồ sơ và Đăng xuất
    shows: trang cá nhân rồi lệnh đăng xuất (tone danger, chữ đỏ). Khách chưa đăng nhập chỉ có "Đăng
      nhập" mở hộp thoại tại chỗ.
    why: "`signed-out-header-avatar-modal.md`, `theme-and-type` (lỗi và nguy hiểm dùng `--danger`)."
    actions: []
    states:
      loading: null
      empty: null
      error: null
