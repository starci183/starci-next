summary: 'Route: `/` (mở menu avatar trên thanh trên). Ảnh chụp với học viên đã Premium nên dòng gói
  đọc "Gói của bạn"; học viên chưa Premium thấy "Nâng cấp Premium" ở cùng vị trí. Khung chung xem
  `learn/home/explain.md`. Menu là lớp nổi nên là chỗ duy nhất có bóng và góc bo lớn; nền trắng, nằm
  đè lên trang.'
