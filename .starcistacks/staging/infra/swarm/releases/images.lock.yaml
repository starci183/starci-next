# The app images of a staging release (core, app, cli, db, storage) are built by `starci app stack build --env staging --push --execute` from a tagged commit
# and pinned by digest in the release record the deploy stores on the manager; this lock names the third-party images the stack source pins itself.
schema: starci/images-lock@1
environment: staging
status: per-release
images:
  redis: redis:7@sha256:c6eabf748fc7a61dbb5a705c78bcf3d6377b1127a97d0ce965c11c44ba46896f
