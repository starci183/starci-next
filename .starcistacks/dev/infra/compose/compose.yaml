# The dev environment's dependencies, run by `starci app stack up --env dev --execute` (PROJECT-STACKS-3, PROJECT-STACKS-6); nobody runs docker by hand.
# Only infrastructure runs here: the database, redis, qdrant, the mail sink, the object store and the dev ingress. The core api, the product app and the landing run natively
# on the host (environments.dev.local.processes). Host ports come from environments.dev.local.ports through STACK_PORT_<NAME>; the superuser
# password is read from a file through the least grant STACK_GRANT_DB (a directory holding only POSTGRES_PASSWORD), never from the environment.
name: starci-next-dev
services:
  # The app's own PostgreSQL, the db component: the image .starcistacks/images/db/Dockerfile builds (official postgres plus pgvector and pgmq).
  db:
    build:
      context: ../../../images/db
    image: starci-next-db:local
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
    ports:
      - "127.0.0.1:${STACK_PORT_DB}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ${STACK_GRANT_DB}:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
  # The declared Redis (hfs.json sides.be.backing) of the BullMQ queue: AOF on a named volume, no eviction.
  redis:
    image: redis:7@sha256:c6eabf748fc7a61dbb5a705c78bcf3d6377b1127a97d0ce965c11c44ba46896f
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${STACK_PORT_REDIS}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 3s
    restart: unless-stopped
  # The dev vector index (Qdrant) of the MCP semantic search: REST on loopback only (the core api reaches it as QDRANT_URL); the collection is made by the app at start.
  qdrant:
    image: qdrant/qdrant:v1.20.1@sha256:d18c8e5061be3eaea2f53fbee1f0bf0382dc59cbb9b7112e41ffcc937ec14220
    ports:
      - "127.0.0.1:${STACK_PORT_QDRANT}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped
  # The dev mail sink (Mailpit): the core api sends the sign-in mails to its SMTP port on loopback, a person reads them in its web UI.
  mail:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    environment:
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025
      MP_UI_BIND_ADDR: 0.0.0.0:8025
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:${STACK_PORT_MAIL}:1025"
      - "127.0.0.1:${STACK_PORT_MAILUI}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped
  # The dev object store (the StarCi source-built MinIO, pinned by digest): its root credentials are the dev `storage` member's keys, the same keys the core api
  # signs with, read from the least grant `storage`; the core api creates its bucket at boot. Only the S3 port is published on the tunnel, never the console.
  storage:
    build:
      context: ../../../..
      dockerfile: .starcistacks/images/storage/Dockerfile
    image: starci-next-storage:local
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/STORAGE_ACCESS_KEY_ID
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/STORAGE_SECRET_ACCESS_KEY
      # Presigned uploads are PUT from the app's public origin straight to the store's public host (the dev tunnel).
      MINIO_API_CORS_ALLOW_ORIGIN: "https://starci-next-app-dev.starci.org,http://localhost:3280"
      STATICS_BUCKET: starci-next-dev
      STATICS_PREFIX: statics
      STATICS_PUBLIC: download
    ports:
      - "127.0.0.1:${STACK_PORT_STORAGE}:9000"
      - "127.0.0.1:${STACK_PORT_STORAGE_CONSOLE}:9001"
    volumes:
      - storage-data:/data
      - ${STACK_GRANT_STORAGE}:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/statics-ready && wget -q -O /dev/null http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped
  # The dev entry origin http://localhost:${STACK_PORT_INGRESS}: /api/* and /graphql to the native core api, everything else to the native app (Caddyfile).
  # The upstreams are the host's processes, reached as host.docker.internal (Docker Desktop resolves it; host-gateway covers a Linux engine).
  ingress:
    image: caddy:2.10.2@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
    configs:
      - source: ingress-config
        target: /etc/caddy/Caddyfile
    environment:
      CORE_PORT: "${STACK_PORT_CORE}"
      APP_PORT: "${STACK_PORT_APP}"
    ports:
      - "127.0.0.1:${STACK_PORT_INGRESS}:3080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
configs:
  ingress-config:
    file: ./Caddyfile
volumes:
  db-data: {}
  redis-data: {}
  qdrant-data: {}
  storage-data: {}
