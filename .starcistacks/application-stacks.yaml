            MINIO_ROOT_USER_FILE: /run/secrets/STORAGE_ACCESS_KEY_ID
            MINIO_ROOT_PASSWORD_FILE: /run/secrets/STORAGE_SECRET_ACCESS_KEY
      verify:
        http:
          - {name: core liveness, url: "https://api.next.starci.org/health/live", status: 200, retry: true}
          - {name: core readiness, url: "https://api.next.starci.org/health/ready", status: 200, retry: true}
          - {name: app home, url: "https://next.starci.org/", status: 200, retry: true}
          # The signed-out door of the app-owned auth: no cookie answers the core's 401 code.
          - {name: auth session door, url: "https://api.next.starci.org/auth/session", status: 401, contains: IDENTITY_REFRESH_INVALID, retry: true}
          # The device socket path: the app host's /socket.io/* reaches the core api, whose socket server takes WebSocket only and refuses a polling handshake.
          - {name: device socket through the app host, url: "https://next.starci.org/socket.io/?EIO=4&transport=polling", status: 400, contains: Transport unknown, retry: true}
          - {name: storage liveness, url: "https://minio.next.starci.org/minio/health/live", status: 200, retry: true}
# The database a swarm deploy migrates: the stack's own `db` service, reached inside its container; the first start of an empty database gives the app role (app_be) the sealed DB_APP_PASSWORD of the environment's `db` member.
database:
  target: stack
  service: postgres
  appPassword: {member: db, key: DB_APP_PASSWORD}
  baseline: baseline
  adopt: {legacyHistory: [primary_migrations]}
data:
  stores:
    # The seed door of the standard (PROJECT-STACKS-13, "The loader"): `cli data database <verb>` serves the store over starci/data-entries@1 from the compiled cli,
    # run from the app root in the api's environment; each set of the standard is an upsert by natural key through the capability that owns its tables.
    - {id: database, kind: database, level: logical, component: db, adapter: {module: be/src/modules/integrations/seed/database.adapter.ts, command: [node, be/dist/apps/cli/src/main.js, data, database]}}
    # The same database in staging and production, where its swarm service and component are postgres (owner 2026-11-22).
    - {id: swarm-database, kind: database, level: logical, component: postgres, adapter: {module: be/src/modules/integrations/seed/database.adapter.ts, command: [node, be/dist/apps/cli/src/main.js, data, database]}}
  derived:
    # The object store of a swarm environment: the statics are mirrored again from the storage image on every start; learner uploads (avatars) have no
    # store adapter yet, so a lost volume loses them (owner follow-up: a storage StoreAdapter like the database's).
    - {component: storage, rebuild: "the storage image mirrors statics/ into the bucket on start; uploaded objects are re-uploaded by their owners"}
    - {component: ingress, rebuild: the ingress re-issues its certificates (ACME)}
    - {component: qdrant, from: database, rebuild: "cli mcp reindex rebuilds the vector index from the database and the content sources; points of removed content are deleted by the same job"}
    - {component: redis, from: database, rebuild: "BullMQ jobs are born from Postgres outbox rows; a job Redis lost is added again by the relay from its waiting row"}
  sets:
    # The content of the product: Essentials lessons and topics, and the check set of Projects (catalog, probes, learner kit). The one path in (R435): the bring-up's
    # seed step reads the standard at this commit, never a clone or a content-sync command. Move the pin by editing `commit`; a moved pin is reported
    # DATA_STANDARD_CHANGED until `force: true` is declared on the set (it then applies once per commit).
    - id: content
      purpose: seed-standard
      stores: [database]
      environments: [dev]
      to: [{driver: git, repository: "https://github.com/starci183/starci-next-seed-standard"}]
      commit: 3cc0d20dba7c201b288f61aac73a37dafa7b7a11
      # Applies once at this commit (content/essence-redo: Bản chất by chapter of the night, server-graded self-checks and glossary in sections/2-essence/reading.yaml, both lessons; the reading opens with an unnumbered "Mở bài" intro and the incident chapters are 1..N); remove it after the bring-up.
      force: true
gates:
  lint: {run: off, reason: "owner 2026-11-23: same as NIVO, code first, proof by e2e; hfs, secrets and db kept"}
  format: {run: off, reason: "owner 2026-11-23: same as NIVO, code first, proof by e2e; hfs, secrets and db kept"}
  sonar: {run: off, reason: "owner 2026-11-23: same as NIVO, code first, proof by e2e; hfs, secrets and db kept"}
  codecov: {run: off, reason: "owner 2026-11-23: same as NIVO, code first, proof by e2e; hfs, secrets and db kept"}
  test: {run: off, reason: "owner 2026-11-23: same as NIVO, code first, proof by e2e; hfs, secrets and db kept"}
  coverage: {run: off, reason: "owner 2026-11-23: same as NIVO, code first, proof by e2e; hfs, secrets and db kept"}
  build: {run: off, reason: "owner 2026-11-23: same as NIVO, code first, proof by e2e; hfs, secrets and db kept"}
  audit: {run: off, reason: "owner 2026-11-23: same as NIVO, code first, proof by e2e; hfs, secrets and db kept"}
  wiring: {run: off, reason: "owner 2026-11-23: same as NIVO, code first, proof by e2e; hfs, secrets and db kept"}
  deps: {run: off, reason: "owner 2026-11-23: same as NIVO, code first, proof by e2e; hfs, secrets and db kept"}
k8s:
  status: deferred
  reason: This starter declares Docker Swarm production; no Kubernetes environment is provisioned.
ci:
  secrets:
    - {name: SONAR_TOKEN, scope: repository, purpose: Sonar analysis token provisioned for this app, optional: true}
    - {name: SOPS_AGE_KEY, scope: environment, environment: production, purpose: Decrypt app members during deployment, optional: true}
  vars:
    - {name: SONAR_HOST_URL, scope: repository, value: "https://sonar.starci.org", purpose: The public endpoint of the host Sonar server that scans release tags}
services:
  sonar:
    provider: sonarqube
    mode: local
    qualityGate: starci-quality-lite
    host: {local: http://localhost:9010, public: https://sonar.starci.org}
    stack:
      owner: host
      root: .claude/ext/sonar
      environment: dev
      compose: compose.yaml
    auth: token
    credentials:
      - id: analysis
        project: "starci-next"
        key: SONAR_TOKEN
        custody: {repository: "starci-next", path: .starcistacks/dev/secrets/sonar.enc.yaml}
    projects: [{repository: "starci-next", key: "starci-next"}]
    ci: {wiring: required, workflow: .github/workflows/ci.yml, token: SONAR_TOKEN, hostVar: SONAR_HOST_URL, secrets: [{name: SONAR_TOKEN, credential: analysis}]}
    ownerAction:
      needed: the starci-next project token from sonar.starci.org as the repository secret SONAR_TOKEN (starci app ci secret set SONAR_TOKEN).
      reason: the token is a credential only the owner can mint on the host Sonar server.
  codecov:
    provider: codecov
    mode: hosted
    purpose: Report application coverage through GitHub OIDC.
    auth: oidc
    target: 100
    components: auto
    required: true
    ci: {wiring: required, workflow: .github/workflows/ci.yml}
    ownerAction: none
  dependabot:
    provider: github
    mode: hosted
    purpose: Keep application dependencies and workflow actions current.
    ecosystems: [npm, docker, github-actions]
    schedule: {interval: weekly}
    groups: {minorPatch: grouped, major: per-package}
    ignore: ['@starci/*']
    security: immediate
    ownerAction: none
  audit:
    provider: npm
    mode: local
    purpose: Refuse high severity production dependency vulnerabilities.
    level: high
    omitDev: true
    in: [release-gate, ci]
    ownerAction: none
  container-registry:
    provider: ghcr
    mode: hosted
    purpose: Publish this app's deployment images with the workflow GitHub token.
    host: {public: https://ghcr.io}
    auth: github-token
    projects: [{repository: "starci-next", key: "starci-next"}]
    ci: {wiring: required}
    ownerAction: none
