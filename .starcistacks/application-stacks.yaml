    - {id: database, kind: database, level: logical, component: postgres, adapter: {module: be/src/modules/integrations/seed/database.adapter.ts, command: [node, be/dist/apps/cli/src/main.js, data, database]}}
  derived:
    # The object store of a swarm environment: the statics are mirrored again from the storage image on every start; learner uploads (avatars) have no
    # store adapter yet, so a lost volume loses them (owner follow-up: a storage StoreAdapter like the database's).
    - {component: storage, rebuild: "the storage image mirrors statics/ into the bucket on start; uploaded objects are re-uploaded by their owners"}
    - {component: ingress, rebuild: the ingress re-issues its certificates (ACME)}
    - {component: qdrant, from: database, rebuild: "cli mcp reindex rebuilds the vector index from the database and the content sources; points of removed content are deleted by the same job"}
    - {component: keycloak, rebuild: "the development realm is imported again from the dev realm file on start; production uses the owner-provisioned realm"}
  sets:
    # The content of the product: Essentials lessons and topics, and the check set of Projects (catalog, probes, learner kit). The one path in (R435): the bring-up's
    # seed step reads the standard at this commit, never a clone or a content-sync command. Move the pin by editing `commit`; a moved pin is reported
    # DATA_STANDARD_CHANGED until `force: true` is declared on the set (it then applies once per commit).
    - id: content
      purpose: seed-standard
      stores: [database]
      environments: [dev]
      to: [{driver: git, repository: "https://github.com/starci183/starci-next-seed-standard"}]
      commit: db452247aadae9f919c1297563a43d60684b1f93
      # Applies once at this commit although the pin moved from the first review commit (DATA_STANDARD_CHANGED); remove it after the bring-up.
      force: true
gates:
  lint: {run: off, reason: "owner 2026-11-17: product model not settled; code first, quality gates later"}
  sonar: {run: off, reason: "owner 2026-11-17: product model not settled; code first, quality gates later"}
  test: {run: off, reason: "owner 2026-11-17: product model not settled; code first, quality gates later"}
  coverage: {run: off, reason: "owner 2026-11-17: product model not settled; code first, quality gates later"}
  codecov: {run: off, reason: "owner 2026-11-17: product model not settled; code first, quality gates later"}
k8s:
  status: deferred
  reason: This starter declares Docker Swarm production; no Kubernetes environment is provisioned.
ci:
  secrets:
    - {name: SONAR_TOKEN, scope: repository, purpose: Sonar analysis token provisioned for this app, optional: true}
    - {name: SOPS_AGE_KEY, scope: environment, environment: production, purpose: Decrypt app members during deployment, optional: true}
    - {name: VPS_SSH_KEY, scope: environment, environment: production, purpose: Deployment SSH key, optional: true}
    - {name: VPS_KNOWN_HOSTS, scope: environment, environment: production, purpose: Pinned deployment SSH host keys, optional: true}
  vars:
    - {name: SONAR_HOST_URL, scope: repository, value: "https://sonar.starci.org", purpose: The public endpoint of the host Sonar server that scans release tags}
services:
  sonar:
    provider: sonarqube
    mode: local
    qualityGate: starci-quality
    host: {local: http://localhost:9010, public: https://sonar.starci.org}
    stack:
      owner: host
      root: .claude/ext/sonar
      environment: dev
      compose: compose.yaml
    auth: token
    credentials:
      - id: analysis
        project: "starci-next"
        key: SONAR_TOKEN
        custody: {repository: "starci-next", path: .starcistacks/dev/secrets/sonar.enc.yaml}
    projects: [{repository: "starci-next", key: "starci-next"}]
    ci: {wiring: required, workflow: .github/workflows/ci.yml, token: SONAR_TOKEN, hostVar: SONAR_HOST_URL, secrets: [{name: SONAR_TOKEN, credential: analysis}]}
    ownerAction:
      needed: the starci-next project token from sonar.starci.org as the repository secret SONAR_TOKEN (starci app ci secret set SONAR_TOKEN).
      reason: the token is a credential only the owner can mint on the host Sonar server.
  codecov:
    provider: codecov
    mode: hosted
    purpose: Report application coverage through GitHub OIDC.
    auth: oidc
    target: 100
    components: auto
    required: true
    ci: {wiring: required, workflow: .github/workflows/ci.yml}
    ownerAction: none
  dependabot:
    provider: github
    mode: hosted
    purpose: Keep application dependencies and workflow actions current.
    ecosystems: [npm, docker, github-actions]
    schedule: {interval: weekly}
    groups: {minorPatch: grouped, major: per-package}
    ignore: ['@starci/*']
    security: immediate
    ownerAction: none
  audit:
    provider: npm
    mode: local
    purpose: Refuse high severity production dependency vulnerabilities.
    level: high
    omitDev: true
    in: [release-gate, ci]
    ownerAction: none
  container-registry:
    provider: ghcr
    mode: hosted
    purpose: Publish this app's deployment images with the workflow GitHub token.
    host: {public: https://ghcr.io}
    auth: github-token
    projects: [{repository: "starci-next", key: "starci-next"}]
    ci: {wiring: required}
    ownerAction: none
