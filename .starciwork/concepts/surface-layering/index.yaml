schema: work/concept@1
id: concept.surface-layering
title: Surface layering - white chrome, one pink well of separate white cards
rule: >-
  The chrome - sidebar, top bar, page header band and the right aside pane - is white (`--surface`), flat and separated by
  borders only. Only the middle well takes the pink `--background`; it holds SEPARATE floating white cards (shadow, no border),
  one card per job, 12 to 16 px apart, and never a card inside a card. Block labels sit on the well above their card. The
  aside pane is made of sections and rows with dividers, never floating cards, and below lg it becomes the first blocks of
  the well. The header band is flush left; the well's content is capped at 80rem (`--grammar-content-max`) and centred.
  One card holds one content (list, form, table or figures); a lone sentence is a row of a list card. Group sublabels above
  a card are 12 px, weight 500, muted. Buttons: only a primary CTA (md or lg) carries a leading icon; size sm never has an
  icon; neutral buttons, suggestion pills and row actions are text only. Icons are outline only; an icon standing alone is an
  icon tile, an inline icon is plain. Links are the primary colour, underlined on hover only, with an arrow at the end for
  inline links; navigation links in a section head end with "→" and sidebar items carry no arrow. Empty, loading and error
  states live inside their card, with a neutral "Thử lại" on error.
why: >-
  The owner reacted to shots: filters on pink looked patched together, one big card lost the separate blocks, and the
  header was ruled white with a border.
forbids:
  - Merging blocks into one big card, a card in a card, or aside items as floating cards.
  - Centring the header band over narrow content.
  - A size sm button with an icon, a filled icon, or an icon on a neutral button.
  - A lone sentence inside its own card.
example: >-
  The Dự án page: a white band with the title, the well with one list card (tabs and search in its toolbar zone, rows
  below) under a label "Dự án của bạn" with a grey count chip, and a white aside "Máy của bạn".
livesIn:
  - path: fe/apps/app/src/components/blocks
    holds: the page blocks built from Grammar SurfaceCard, Pane and PaneGrid (ProjectsList, LessonStudy, LearnHub, EssentialsCatalog and others)
  - path: fe/packages/starci-next-ui/src
    holds: the shared composites and the error, empty and loading states
