  - Not verified that the three MVP lessons are imported in any database; the lane holds no content snapshot.
  - Not verified that the grouping holds exactly 16 groups (the map is in lesson-group.policy.ts, not counted).
  - The simulation and apply phases need the learner CLI and the relay for tests on the learner's machine; see concept.learner-cli-relay-proof.
  - Grammar 0.37.14 follow-ups (navigation rows without the external arrow, article headings on 14) wait for the local registry.
