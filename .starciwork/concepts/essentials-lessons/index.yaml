schema: work/concept@1
id: concept.essentials-lessons
title: Bản chất (Essentials) - a separate part that teaches industry knowledge
rule: >-
  Bản chất (VI; Essentials in EN; id `essentials`) is a separate part of the product that teaches knowledge of the
  industry, not knowledge for the harness's agents. One item is a "bài" (lesson); one lesson is one concept of the
  teacher's concepts/ V2 format. The levels are group (16) then topic (one source module) then lesson, on the routes
  /essentials, /essentials/[topic] and /essentials/[topic]/[lesson]. A lesson has six phases - challenge (diagnostic
  interview), predict, explore (state-machine simulation), explain (theory), apply (workspace with `node --test`, then a
  transfer exercise), reflect (re-interview) - and five activity kinds: explain, choice, simulation, exercise,
  retrieval. Each activity carries a rubric of expected evidence plus a misconception; feedback is released after submit;
  retrieval is spaced at 1, 7 and 21 days. The MVP is the teacher's three existing lessons (2-cqrs-read-models,
  4-health-probe-semantics, 0-request-response-lifecycle), not new writing. V1 lessons are source material only; V2 is
  rewritten, never edited in place.
why: >-
  The owner wants the industry knowledge taught as its own part with the real format of the teacher's data repo, so the
  screens are designed from the phases and activity kinds, not from an invented flow.
forbids:
  - A nine-stage flow of our own; the phases are the six of concepts/ V2.
  - The old name "Knowledge Shard" or "mảnh kiến thức".
  - Editing a V1 lesson in place.
  - Releasing feedback before the learner submits.
example: >-
  /essentials/<topic>/<lesson> shows the overview, one list card of the six phases (each with a state chip or a lock) and
  an aside with the learning result, the retrieval after 1, 7 and 21 days and the references.
livesIn:
  - path: be/src/modules/domain/lesson/lesson.contracts.ts
    holds: the six phases, LESSON_FREE_PHASE, the three difficulties, the five activity kinds, vi and en locales
  - path: be/src/modules/domain/lesson/lesson-access.policy.ts
    holds: "which phase is free: the teacher's isPremium mark of a section or lesson first, then LESSON_FREE_PHASE"
  - path: be/src/modules/domain/attempt/outcome-level.policy.ts
    holds: "levelsOf (an attempt gives understood only) and provedLevelOf (proved needs the incident mutation score >= 80)"
  - path: be/src/modules/domain/attempt/attempt-proof.service.ts
    holds: recordMutationScore, the only writer of the proved level
  - path: be/src/modules/domain/lesson/lesson-group.policy.ts
    holds: the map from the teacher's category or a lesson to its catalog group
  - path: be/src/modules/domain/review/review.contracts.ts
    holds: "RETRIEVAL_AFTER_DAYS = [1, 7, 21]"
  - path: fe/apps/app/src/app/[locale]/(app)/essentials
    holds: the catalog, the topic and the lesson routes
  - path: fe/apps/app/src/components/blocks/LessonStudy
    holds: the lesson page with the six phases
