amendments:
  - at: 2026-11-10
    by: coordinator under owner delegation
    words:
      - "cứ làm theo ý trò đi, cách nào tốt nhất thì làm"
      - "the 'proved' level needs the incident mutation score (owner 2026-11-08, reaffirmed)"
    rulings:
      - >-
        Proof level: "Đã chứng minh" (proved, outcome level 2) REQUIRES the incident mutation score, at least 80 percent. An
        Áp dụng (apply) exercise scoring 80 percent or more gives at most the level below proved (understood, level 2). A
        graded attempt never raises `proved`.
      - >-
        Free tier of a lesson: the teacher's `isPremium: false` mark on a lesson or a section makes it free; without a mark
        only the challenge phase (Bị hỏi) is free. See concept.premium-unlocks-all.
