  - "Proof level rule built 2026-11-10: levelsOf gives understood only, provedLevelOf(mutationScore) gives 2 at 80 percent or more, AttemptProofService.recordMutationScore keeps the best score of a learner per lesson (new table lesson_incident_scores, migration 1798100000000) and raises `proved` for the outcomes the learner fully understood. Unit specs run and pass."
