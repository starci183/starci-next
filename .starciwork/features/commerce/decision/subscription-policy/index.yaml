schema: work/policy-decision@1
id: decision.commerce.subscription-policy
title: Premium grant and renewal policy
state: todo
activity: idle
question: When and how does a paid purchase grant or extend Premium?
options:
  - Grant only on verified IPN or webhook
  - grant on browser return
  - extend from end or now
  - grace or no grace
recommendation: Grant only on authenticated provider IPN or webhook after reference, status, amount
  and currency match; apply each purchase once; extend from future premiumUntil or confirmation time
  when expired; no grace period.
recommendationReason: Browser returns are not payment proof; idempotency prevents duplicate
  extensions and no-grace behavior is explicit.
outcome: open
chosen: null
reason: "The proposed grant policy is ready for implementation without implying an owner outcome.
  Accept verified matching confirmation once, including ORDER_PAID after cancellation or expiry with
  an audit event (Q-W2-3); extend an active renewal from its current end (Q-W2-5); use UTC calendar
  arithmetic clamped to month end (Q-CALENDAR-ARITHMETIC). Browser return alone never proves
  payment; expiry has no grace period. Q6 remains open: one real 229.000 VND charge requires
  explicit owner approval and never runs without it; the already-authorized sandbox walk proceeds
  otherwise. These proposed defaults authorize implementation and record no chosen owner outcome."
