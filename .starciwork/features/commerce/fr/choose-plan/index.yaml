id: fr.commerce.choose-plan
title: Choose a Premium plan
state: todo
activity: idle
actors: [learner]
trigger: Learner opens the Premium plans screen.
mainFlow:
  - Show current server-defined monthly and yearly offers with price, term, and renewal terms.
  - Learner selects an offer and starts a purchase for the authenticated learner.
