schema: work/functional-requirement@1
id: fr.commerce.choose-plan
title: Choose a Premium plan
state: todo
activity: idle
actors:
  - learner
trigger: Learner opens the Premium plans screen.
mainFlow:
  - Show the server-defined monthly 229.000 ₫ and yearly 2.290.000 ₫ offers with terms
    (Q-PRICE-DISPLAY).
  - Select the learner last-used rail when available; otherwise propose SePay as the default
    (Q-W2-6).
  - Learner selects an offer and starts a purchase for the authenticated learner.
exceptionFlows:
  - If offers cannot be loaded, explain that plans are temporarily unavailable and provide retry.
  - If the learner is already Premium, show current expiry and that a new verified purchase extends
    from that end.
  - SePay sandbox account access and merchant/IPN secrets in sealed custody are prerequisites
    (Q-W2-2); no secret value is recorded here.
postconditions:
  - A pending purchase is created for the selected offer and learner.
composes:
  - br.commerce.premium-subscription
  - decision.commerce.commercial-offers
  - ui.commerce.plans
  - contract.commerce.payment-rail
requiresProof:
  - required: true
    command: npm test -- src/modules/domain/purchase
      --collectCoverageFrom=src/modules/domain/purchase/**/*.{service,schema,policy,projection,guard,mapper,client,adapter,filter,interceptor,processor,step,saga,saga-step,compensation,consumer,webhook}.ts
    note: Required scoped purchase unit proof with the managed per-file coverage threshold unchanged at
      100; this record remains todo pending green evidence.
  - required: true
    command: npm run test:integration -- src/tests/integration/commerce/purchase
    note: Required scoped purchase integration proof; no passed result is claimed.
  - required: true
    command: npm run test:e2e -- src/tests/e2e/commerce/purchase
    note: Required scoped purchase end-to-end proof; no passed result is claimed.
  - required: true
    command: npm run build:fe
    note: Required front-end build proof for the Premium plans and checkout-result flow; this record
      remains todo pending green evidence.
change:
  rev: 3
  kind: revised
  at: 2026-10-28
  reason: Replace invalid proof commands with root-managed scoped obligations, assign unified
    PaymentRail proof to purchase, and isolate the sandbox acceptance scenarios; retain open
    proposed defaults and todo state.
