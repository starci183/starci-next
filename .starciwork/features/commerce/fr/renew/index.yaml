schema: work/functional-requirement@1
id: fr.commerce.renew
title: Renew Premium
state: todo
activity: idle
actors:
  - learner
trigger: Learner with active or expired Premium chooses a new plan.
mainFlow:
  - Create a separate purchase for the chosen current offer.
  - On verified confirmation, extend an active entitlement from its current
    future premiumUntil (proposed yes, Q-W2-5); if expired, start at
    confirmation time, with UTC calendar arithmetic clamped at month end
    (Q-CALENDAR-ARITHMETIC).
  - Apply the plan term once, with no automatic charge.
exceptionFlows:
  - Failed, canceled, or unverified payments leave entitlement unchanged.
  - Duplicate provider events do not extend a second time.
postconditions:
  - A verified renewal extends premiumUntil according to the selected plan.
composes:
  - data.commerce.purchase
  - data.commerce.entitlement
  - decision.commerce.subscription-policy
  - contract.commerce.entitlement
requiresProof:
  - required: true
    command: npm --prefix be test -- --runInBand
    note: Scoped back-end tests for active renewal extension, expired start and
      replay; remains todo until green.
change:
  rev: 2
  kind: revised
  at: 2026-10-28
  reason: Restore approved Premium questions, proof obligations and repository
    module owners.
