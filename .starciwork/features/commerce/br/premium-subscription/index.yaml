schema: work/business-rule@1
id: br.commerce.premium-subscription
title: Premium subscription offers
state: todo
activity: idle
statements:
  - The server offers Premium monthly for 229.000 ₫ and Premium yearly for 2.290.000 ₫; display
    formatting follows proposed Q-PRICE-DISPLAY.
  - A verified matching provider confirmation grants the purchased Premium term once, including
    ORDER_PAID after cancellation or expiry with an audit event as proposed in Q-W2-3.
  - An active renewal extends from the existing future entitlement end date as proposed in Q-W2-5;
    expired Premium has no grace period.
  - A Premium purchase sells no course and creates no enrollment.
  - A real 229.000 VND charge is never run without owner approval (Q6); sandbox walks are used
    otherwise.
acceptance:
  - given: A learner chooses either published Premium offer.
    when: The matching payment is verified by provider IPN or webhook.
    then: The learner receives the selected Premium term exactly once.
  - given: A learner buys Premium.
    when: The purchase completes.
    then: No course or enrollment is created.
authorityRefs:
  - decision.commerce.commercial-offers
  - decision.commerce.subscription-policy
appliesTo:
  - fr.commerce.choose-plan
  - fr.commerce.pay
  - fr.commerce.renew
  - fr.commerce.expire
requiresProof:
  - required: true
    command: npm test -- src/modules/domain/purchase
      --collectCoverageFrom=src/modules/domain/purchase/**/*.{service,schema,policy,projection,guard,mapper,client,adapter,filter,interceptor,processor,step,saga,saga-step,compensation,consumer,webhook}.ts
    note: Required scoped purchase unit proof with the managed per-file coverage threshold unchanged at
      100; this record remains todo pending green evidence.
  - required: true
    command: npm run test:integration -- src/tests/integration/commerce/purchase
    note: Required scoped purchase integration proof; no passed result is claimed.
  - required: true
    command: npm run test:e2e -- src/tests/e2e/commerce/purchase
    note: Required scoped purchase end-to-end proof; no passed result is claimed.
  - required: true
    command: npm test -- src/modules/domain/entitlement
      --collectCoverageFrom=src/modules/domain/entitlement/**/*.{service,schema,policy,projection,guard,mapper,client,adapter,filter,interceptor,processor,step,saga,saga-step,compensation,consumer,webhook}.ts
    note: Required scoped entitlement unit proof with the managed per-file coverage threshold unchanged
      at 100; this record remains todo pending green evidence.
  - required: true
    command: npm run test:integration -- src/tests/integration/commerce/entitlement
    note: Required scoped entitlement integration proof; no passed result is claimed.
  - required: true
    command: npm run test:e2e -- src/tests/e2e/commerce/entitlement
    note: Required scoped entitlement end-to-end proof; no passed result is claimed.
change:
  rev: 3
  kind: revised
  at: 2026-10-28
  reason: Replace invalid proof commands with root-managed scoped obligations, assign unified
    PaymentRail proof to purchase, and isolate the sandbox acceptance scenarios; retain open
    proposed defaults and todo state.
