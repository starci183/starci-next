schema: work/integration@1
id: integration.commerce.sepay
title: SePay Payment Gateway
state: todo
activity: idle
provider: SePay Payment Gateway
boundary: Server creates a signed checkout form and accepts SePay IPN; browser return is not confirmation.
endpoints:
  - purpose: create checkout
    method: provider checkout form
    details: Sign form fields using current SePay Payment Gateway signing specification; never expose
      signing secret to browser.
  - purpose: payment notification
    method: HTTPS POST IPN
    details: Authenticate X-Secret-Key when configured; process ORDER_PAID and match
      order_invoice_number and order_amount to the persisted purchase, including late ORDER_PAID
      under proposed Q-W2-3; acknowledge successful receipt as provider requires.
credential: Merchant account, form signing secret and configured IPN X-Secret-Key are
  owner-provisioned secrets stored only in server secret configuration.
sandbox: Use provider sandbox merchant/account if enabled; do not claim live verification without
  owner-provisioned account and public HTTPS callback.
research:
  readAt: 2026-10-28
  sources:
    - title: SePay Payment Gateway IPN
      url: https://developer.sepay.vn/en/cong-thanh-toan/IPN
  findings: SePay documents an IPN POST to a publicly reachable HTTPS URL, X-Secret-Key when auth type
    SECRET_KEY is configured, notification_type values ORDER_PAID and TRANSACTION_VOID, and order
    fields order_invoice_number and order_amount. Live verification must create a sandbox or
    approved merchant order, receive its IPN, validate authentication/reference/amount/status, and
    confirm acknowledgement/retry behavior.
  prerequisites: Owner provisions merchant account, enables/configures IPN authentication and signing
    credentials, and registers public HTTPS callback.
requiresProof:
  - required: true
    command: npm test -- src/modules/integrations
      --collectCoverageFrom=src/modules/integrations/{sepay,payos}/**/*.{service,schema,policy,projection,guard,mapper,client,adapter,filter,interceptor,processor,step,saga,saga-step,compensation,consumer,webhook}.ts
    note: Required scoped provider client unit proof; the sepay typed client does not import the other
      provider client.
  - required: true
    command: npm run test:e2e -- src/tests/e2e/commerce/sepay-live
    note: Required provider-live sandbox proof after the named account, environment, public callback and
      sealed credentials are provisioned; no live proof is claimed.
change:
  rev: 3
  kind: revised
  at: 2026-10-28
  reason: Replace invalid proof commands with root-managed scoped obligations, assign unified
    PaymentRail proof to purchase, and isolate the sandbox acceptance scenarios; retain open
    proposed defaults and todo state.
blockers:
  - Missing sepay sandbox merchant account/access
  - Missing commerce-sandbox environment resource
  - Missing public HTTPS callback endpoint
  - Missing sepay provider credentials held in sealed custody
