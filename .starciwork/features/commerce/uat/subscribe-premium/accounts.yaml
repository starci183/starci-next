schema: work/disposable-accounts@1
id: accounts.commerce.subscribe-premium
disposable: true
accounts:
  - role: learner-monthly
    identity: _resources/identities/commerce-sandbox-learner-monthly
  - role: learner-yearly
    identity: _resources/identities/commerce-sandbox-learner-yearly
  - role: provider-sepay
    identity: _resources/identities/commerce-sepay-sandbox
  - role: provider-payos
    identity: _resources/identities/commerce-payos-sandbox
blockers:
  - Missing distinct sealed learner-monthly identity resource
    _resources/identities/commerce-sandbox-learner-monthly
  - Missing distinct sealed learner-yearly identity resource
    _resources/identities/commerce-sandbox-learner-yearly
  - Missing SePay sandbox merchant account and sealed merchant/IPN credentials referenced by
    _resources/identities/commerce-sepay-sandbox
  - Missing payOS sandbox merchant account and sealed credentials referenced by
    _resources/identities/commerce-payos-sandbox
