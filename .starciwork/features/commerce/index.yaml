schema: work/feature@1
id: commerce
purpose: Learners can buy Premium access through SePay or payOS and use entitlement-backed premium features.
decided:
  - Premium is available monthly for 229.000 ₫ and yearly for 2.290.000 ₫, equivalent to ten monthly payments.
  - A successful purchase grants learner PREMIUM; the purchase sells no course and creates no enrollment.
  - Premium becomes active only after a verified provider IPN or webhook, extends from the existing entitlement end when still active, and has no grace period.
delivers:
  - Learners choose a plan, complete checkout, see the result, renew, and lose premium access at expiry.
  - The server owns the two commercial offers and provides an entitlement contract for other features.
excludes:
  - Course sales and enrollment.
  - Automatic recurring billing.
openQuestions:
  - id: Q-W2-2
    question: Should offer amounts be displayed as VND integer đồng and localized with dot thousands separators?
    proposedDefault: Display 229.000 ₫ and 2.290.000 ₫ to match the approved Vietnamese price presentation.
    state: open
  - id: Q-W2-3
    question: Which SePay and payOS merchant accounts and live credentials will be used for production?
    proposedDefault: Owner configures one merchant account per enabled rail; credentials remain in server secret storage.
    state: open
  - id: Q-W2-5
    question: Should a verified payment for an expired or superseded checkout still grant the selected plan?
    proposedDefault: Grant the exact purchased plan once the provider confirms the matching unpaid purchase; flag mismatches for reconciliation.
    state: open
  - id: Q-W2-6
    question: What is the production callback origin and who configures provider webhook URLs?
    proposedDefault: Use the public HTTPS server origin; owner configures and verifies each provider callback before release.
    state: open
  - id: Q6
    question: What calendar arithmetic defines a monthly or yearly entitlement end date?
    proposedDefault: Add one calendar month or one calendar year in UTC, clamping to the last valid day of the target month.
    state: open
change: {rev: 1, kind: created, at: '2026-10-28', reason: 'Define requested Premium commerce scope and open owner questions.'}
