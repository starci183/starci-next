      --collectCoverageFrom=src/modules/domain/entitlement/**/*.{service,schema,policy,projection,guard,mapper,client,adapter,filter,interceptor,processor,step,saga,saga-step,compensation,consumer,webhook}.ts
    note: Required scoped entitlement unit proof with the managed per-file coverage threshold unchanged
      at 100; this record remains todo pending green evidence.
  - required: true
    command: npm run test:integration -- src/tests/integration/commerce/entitlement
    note: Required scoped entitlement integration proof; no passed result is claimed.
  - required: true
    command: npm run test:e2e -- src/tests/e2e/commerce/entitlement
    note: Required scoped entitlement end-to-end proof; no passed result is claimed.
