schema: work/sds-component@1
id: sds.commerce.payments
title: Premium payments and entitlement
state: todo
activity: idle
responsibility: Coordinate server-owned offers, pending purchases, provider checkout and verified
  payment events, idempotent entitlement updates, and learner entitlement reads. Use the learner
  last-used payment rail when available, otherwise SePay by default (Q-W2-6); handle valid matching
  late ORDER_PAID once with an audit event (Q-W2-3), and extend active renewals from the existing
  end (Q-W2-5).
interfaces:
  - name: createPurchase
    direction: inbound
    accepts: authenticated learner and plan
    returns: purchase and checkout destination
  - name: providerCallback
    direction: inbound
    accepts: provider payload
    returns: acknowledged only after safe processing
  - name: entitlementRead
    direction: outbound
    accepts: learner identity
    returns: isPremium and premiumUntil
owners:
  - be
stateMachine:
  - select plan
  - create pending purchase
  - create checkout
  - verify provider event
  - record paid once
  - extend entitlement
sequence:
  - Server reads the single commercial offer definition and snapshots amount and term.
  - Purchase uses its unified PaymentRail abstraction to call the selected provider typed client and
    persists provider reference with unique (rail, providerRef); provider integrations do not import
    each other.
  - Provider callback is authenticated and validated against the persisted purchase, including valid
    matching late ORDER_PAID after cancellation or expiry under proposed Q-W2-3.
  - One transaction records paid purchase and extends entitlement; duplicate event is a no-op.
  - Other features consume entitlement through the shared contract.
requiresProof:
  - required: true
    command: npm test -- src/modules/domain/purchase
      --collectCoverageFrom=src/modules/domain/purchase/**/*.{service,schema,policy,projection,guard,mapper,client,adapter,filter,interceptor,processor,step,saga,saga-step,compensation,consumer,webhook}.ts
    note: Required scoped purchase unit proof with the managed per-file coverage threshold unchanged at
      100; this record remains todo pending green evidence.
  - required: true
    command: npm run test:integration -- src/tests/integration/commerce/purchase
    note: Required scoped purchase integration proof; no passed result is claimed.
  - required: true
    command: npm run test:e2e -- src/tests/e2e/commerce/purchase
    note: Required scoped purchase end-to-end proof; no passed result is claimed.
  - required: true
    command: npm test -- src/modules/integrations
      --collectCoverageFrom=src/modules/integrations/{sepay,payos}/**/*.{service,schema,policy,projection,guard,mapper,client,adapter,filter,interceptor,processor,step,saga,saga-step,compensation,consumer,webhook}.ts
    note: Required scoped payment-rails unit proof with the managed per-file coverage threshold
      unchanged at 100; this record remains todo pending green evidence.
  - required: true
    command: npm run test:integration -- src/tests/integration/commerce/payment-rails
    note: Required scoped payment-rails integration proof; no passed result is claimed.
  - required: true
    command: npm run test:e2e -- src/tests/e2e/commerce/payment-rails
    note: Required scoped payment-rails end-to-end proof; no passed result is claimed.
  - required: true
