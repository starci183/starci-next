schema: work/data@1
id: data.commerce.purchase
title: Premium purchase
state: todo
activity: idle
fields:
  - name: purchaseId
    type: opaque identifier
    required: true
  - name: learnerId
    type: learner reference
    required: true
  - name: plan
    type: monthly or yearly
    required: true
  - name: amountVnd
    type: integer đồng price snapshot
    required: true
  - name: rail
    type: sepay or payos
    required: true
  - name: providerRef
    type: provider order or invoice reference
    required: true
  - name: status
    type: pending
    paid: null
    failed: null
    canceled: null
    required: true
  - name: confirmedAt
    type: UTC timestamp
    required when paid: null
invariants:
  - Unique idempotency identity is (rail, providerRef).
  - Paid confirmation must match purchase, expected amount and currency VND and
    be verified by the provider-specific mechanism.
  - Price and plan are immutable snapshots once checkout is created.
  - A valid matching ORDER_PAID confirmation received after cancellation or
    expiry is proposed to grant exactly once and create an audit/reconciliation
    record (Q-W2-3).
  - The default rail is proposed as the learner last-used rail, otherwise SePay
    (Q-W2-6).
stateMachine:
  - pending -> paid
  - pending -> failed
  - pending -> canceled
requiresProof:
  - required: true
    command: npm --prefix be test -- --runInBand
    note: Scoped purchase tests for late confirmation audit, rail default and
      idempotency; remains todo until green.
change:
  rev: 2
  kind: revised
  at: 2026-10-28
  reason: Restore approved Premium questions, proof obligations and repository
    module owners.
