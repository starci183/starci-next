schema: work/data@1
id: data.commerce.entitlement
title: Premium entitlement
state: todo
activity: idle
fields:
  - name: learnerId
    type: learner reference
    required: true
  - name: premiumUntil
    type: UTC timestamp
    required: true
  - name: updatedAt
    type: UTC timestamp
    required: true
invariants:
  - isPremium(learner) is true exactly while premiumUntil is later than current
    UTC time.
  - Entitlement changes only after a verified provider event matching a paid
    purchase.
  - A paid term extends from a future existing premiumUntil; otherwise it begins
    at confirmation time.
  - An active renewal extends from the existing future premiumUntil (Q-W2-5);
    expired access has no grace period and falls back to preview.
  - Monthly and yearly end dates use proposed UTC calendar arithmetic clamped to
    month end (Q-CALENDAR-ARITHMETIC).
stateMachine:
  - inactive -> active
  - active -> active by extension
  - active -> inactive at premiumUntil
requiresProof:
  - required: true
    command: npm --prefix be test -- --runInBand
    note: Scoped entitlement tests for active extension, calendar boundaries and
      immediate expiry; remains todo until green.
change:
  rev: 2
  kind: revised
  at: 2026-10-28
  reason: Restore approved Premium questions, proof obligations and repository
    module owners.
