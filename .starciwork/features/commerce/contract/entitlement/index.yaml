schema: work/contract@1
id: contract.commerce.entitlement
title: Premium entitlement contract
state: todo
activity: idle
owner: be
between:
  - commerce server
  - other features
surface:
  - isPremium(learner) returns true only when premiumUntil is later than current UTC time.
  - premiumUntil(learner) returns the stored UTC entitlement end or null when no entitlement exists.
guarantees:
  - Other features can read current Premium status without coupling to payment providers
  - Expired entitlement is inactive with no grace period
  - An active renewal extends from the current future entitlement end as proposed in Q-W2-5.
consumerObligations:
  - Pass the authenticated learner identity
  - enforce the returned status at the feature boundary
refs:
  - data.commerce.entitlement
requiresProof:
  - required: true
    command: npm test -- src/modules/domain/entitlement
      --collectCoverageFrom=src/modules/domain/entitlement/**/*.{service,schema,policy,projection,guard,mapper,client,adapter,filter,interceptor,processor,step,saga,saga-step,compensation,consumer,webhook}.ts
    note: Required scoped entitlement unit proof with the managed per-file coverage threshold unchanged
      at 100; this record remains todo pending green evidence.
  - required: true
    command: npm run test:integration -- src/tests/integration/commerce/entitlement
    note: Required scoped entitlement integration proof; no passed result is claimed.
  - required: true
    command: npm run test:e2e -- src/tests/e2e/commerce/entitlement
    note: Required scoped entitlement end-to-end proof; no passed result is claimed.
