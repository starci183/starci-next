extensions:
  pathBase: All owners are module-root directories relative to the one git app repository root; repository be/fe
    names the logical side from workspace.yaml. These are target owners, not claims code has already been delivered.
  responsibilities:
  - The page feature owns the central original article, exact outline/preview, independent language selector, five
    distinct answer forms, step rail, in-page ask region and server-driven streaming/error/resume states.
  - The localized route composes LessonPage through the supplied AppLayout/SiteShell reading surface and existing
    brand.
  - Task context includes both UI records, the full steps contract, all data/requirements/design records and fixture
    manifest/source assets; a UI direction must show real section-1 bytes and outline, not a fake generic teaser.
  contextRule: Coding workers read named context only. Resolve every refs id explicitly into the task context, including
    the fixture resource, manifest and selected/all source files needed by the slice; refs are not assumed to auto-load
    transitive dependencies.
  activation: Open decision gates apply to the effects they own. Content parsing, public projections and fake-provider
    proofs can proceed; fixed-step rollout, credit policy, concrete provider configuration and live verification
    remain conditional.
  proofStatus: Implementation and downstream runtime/browser proof are not run by this docs task; state remains
    todo.
