- decision.lessons.five-steps
- decision.lessons.ai-credit
- contract.commerce.entitlement
extensions:
  proposalVersion: five-steps-candidate-1
  essentialUnknowns:
  - Q-W1-1 owns approval of this proposed fixed sequence; no prior exact step names exist in the supplied Work.
  - Q-W1-2 owns whether coaching is free and Premium-gated; do not charge credits or infer universal free access.
