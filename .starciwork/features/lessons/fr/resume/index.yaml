schema: work/functional-requirement@1
id: fr.lessons.resume
title: Resume a lesson
state: todo
activity: idle
change:
  rev: HEAD
  kind: created
  at: '2026-10-28'
  reason: Define the lessons feature and its acceptance, design, implementation and
    fixture records.
actors:
- learner
trigger: A learner returns to a lesson with saved progress.
mainFlow:
- Load the same lesson version and saved step answers.
- Restore the current step and reading position.
- Allow the learner to continue or revisit completed steps.
exceptionFlows:
- If the selected translation is unavailable, offer an available language without
  replacing saved progress.
- If the coach is unavailable, retain the submitted answer and allow retry or continuation.
postconditions:
- The learner resumes without losing saved progress.
composes:
- br.lessons.interactive-ai-lesson
- data.lessons.content
- data.lessons.turn
