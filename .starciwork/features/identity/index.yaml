schema: work/feature@1
id: identity
title: Identity
purpose: Learners authenticate through Keycloak and retain an application session across reloads.
decisions:
  - Keycloak realm: starci-next-identity.
  - Sign-in uses OpenID Connect authorization code flow with PKCE S256.
  - An authenticated identity with no operator role is a learner for this feature; no learner realm role is required.
  - Only verified issuer and subject establish identity; roles are accepted only from provider-asserted role claims after token verification. Client-supplied claims grant no authority.
  - PREMIUM is an entitlement owned by subscription-premium, not a Keycloak role.
  - The realm has no admin role; author-editor is an operator role outside this feature.
  - Sessions are opaque, server-managed and stored durably in identity-owned PostgreSQL state; the raw session reference exists only in its secure cookie.
  - This slice does not refresh provider tokens automatically; session expiry requires fresh sign-in.
  - 'Owner ruling r-a6c777d4da5e (Q-A1 answered, tk-0f64ccd66b5e, goal v55): development issuer https://localhost:8089/realms/starci-next-identity; the app reuses confidential client starci-next-identity-lane with its secret in custody keycloak-client-secret; callback https://localhost:3001/api/identity/session/callback and post-logout https://localhost:3000/sign-in are registered on that client; local Keycloak and app origins serve HTTPS with Secure cookies; the learner test account holds no operator role in custody keycloak-learner-test.'
delivers:
  - Learner sign-in, session restoration, and sign-out.
excludes:
  - Account registration and password recovery.
  - Subscription entitlement decisions.
openQuestions:
  - Drawing remains held until the published grammar fill-height fix and an owner-approved grammar version are available.
