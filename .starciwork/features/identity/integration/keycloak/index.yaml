schema: work/integration@1
id: integration.identity.keycloak
title: Keycloak identity provider
state: todo
activity: idle
provider: Keycloak
boundary: The application delegates authentication to the configured Keycloak OIDC realm, validates the returned identity, and establishes a local application session for an authenticated identity without requiring an operator role.
endpoints:
  authorization: <unresolved development issuer>/realms/starci-next-identity/protocol/openid-connect/auth
  token: <unresolved development issuer>/realms/starci-next-identity/protocol/openid-connect/token
  userInfo: <unresolved development issuer>/realms/starci-next-identity/protocol/openid-connect/userinfo
  logout: <unresolved development issuer>/realms/starci-next-identity/protocol/openid-connect/logout
credential: The development runbook documents keycloak-client-secret as the confidential-client secret for client starci-next-identity-lane in realm starci-next-identity, encrypted with SOPS for the shared master age recipient and materialized only on the owner machine. Never store or copy its value or identity here. Whether this app reuses that client or registers a separate client remains Q-A1.
sandbox: Non-production development Keycloak realm starci-next-identity; issuer, client choice, callback and post-logout URI, and learner test-account custody name are unresolved owner prerequisites under Q-A1.
research:
  readAt: '2026-10-28'
  sources:
    - https://www.keycloak.org/securing-apps/oidc-layers
    - https://www.keycloak.org/docs/latest/server_admin/#_oidc
  findings:
    - Keycloak documents authorization code flow as browser redirect to authorization endpoint followed by a short-lived code returned to the registered callback and exchanged at the token endpoint.
    - Keycloak exposes realm-relative authorization, token, userinfo, and logout endpoints; the realm name is part of each endpoint.
    - PKCE uses a code challenge in the authorization request and a code verifier during code exchange; use S256.
    - Exact callback and post-logout URIs depend on the owner-provisioned client.
  lifecycleLimits:
    - Authorization codes are short-lived and single-use; exchange promptly and reject replay or mismatched state.
    - Validate issuer, audience, signature, expiry, and nonce when used before creating a session; do not require a learner role claim.
    - User logout and token/session revocation behavior depends on configured client and realm and remains unverified.
  prerequisites:
    - Q-A1 OPEN: owner supplies the app development Keycloak issuer, decides reuse of starci-next-identity-lane versus a separate client, and names learner test-account custody.
    - Owner provisions exact callback and post-logout URIs and disposable learner credentials; keycloak-client-secret stays in documented SOPS custody, never in Work.
  liveVerification: Blocked by Q-A1 until issuer, client choice, and named learner test-account custody are supplied; then verify PKCE S256, callback validation, signed-in session reload, and application/provider logout against the actual non-production realm.
requiresProof:
  - required: true
    command: starci task verify <task-id>
    note: Verify integration design and record completeness; live provider verification remains blocked by Q-A1.
change: {rev: HEAD, kind: revised, at: '2026-10-28', reason: Correct learner role assumptions and record owner-held development prerequisites and secret custody.}
extensions:
  sessionContract: The application establishes a server-managed session after callback and exposes a session-backed identity read to the frontend; cookie name, secure/httpOnly/sameSite attributes, lifetime, refresh behavior, CSRF behavior, exact API route and response schema are not established in the available backend result/current record and must be confirmed before FE integration. Sign-out must invalidate the local session and initiate provider logout; exact response and revocation semantics remain unverified.
  authorization: An authenticated identity without operator role is a learner for this feature. PREMIUM is an entitlement owned by subscription-premium. There is no realm admin role; author-editor is an operator role outside this goal.
