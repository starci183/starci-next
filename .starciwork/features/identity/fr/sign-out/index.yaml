schema: work/functional-requirement@1
id: fr.identity.sign-out
title: Sign out
state: todo
activity: idle
actors: [learner]
trigger: The signed-in learner chooses Đăng xuất in the account menu.
mainFlow:
  - The browser sends a same-origin sign-out request (OriginGuard and the CSRF policy).
  - The backend revokes the application session durably first, then revokes the Keycloak refresh token it holds (token revocation endpoint). It clears the session cookie and answers success. The browser never visits a Keycloak page.
  - The browser shows /sign-in with "Bạn đã đăng xuất".
exceptionFlows:
  - An expired or already revoked session still clears the cookie and answers signed out, without creating or extending a session.
  - If Keycloak revocation fails after local revocation, the learner stays signed out locally; the failure is logged for retry and is not shown as an error.
postconditions:
  - The application no longer treats the learner as signed in; the Keycloak refresh token held for that session is revoked or queued for revocation.
composes: [br.identity.sign-in, decision.identity.auth-model, sds.identity.session, contract.identity.session-contract, integration.identity.keycloak]
reference: starci-academy-backend features/api/core/graphql/mutations/keycloak/sign-out (keycloakTokenService.revokeRefreshToken).
requiresProof:
  - required: true
    command: npm run test -- src/modules/domain/identity src/modules/integrations/keycloak --runInBand
    note: Local revocation first, Keycloak revocation, failure tolerance, idempotent sign-out.
change: {rev: HEAD, kind: revised, at: '2026-11-08', reason: 'decision.identity.auth-model B: back-channel token revocation replaces the RP-Initiated Logout redirect.'}
extensions: {}
