schema: work/functional-requirement@1
id: fr.identity.sign-out
title: Sign out
state: todo
activity: idle
actors: [learner]
trigger: The signed-in learner chooses sign out.
mainFlow:
  - The browser submits a same-origin sign-out request protected by OriginGuard and the existing CSRF policy.
  - The application atomically revokes the current server-side session before clearing its cookie and initiating Keycloak RP-Initiated Logout with client_id and the registered application post_logout_redirect_uri; Keycloak may require user confirmation without an ID-token hint.
  - The browser returns to the fixed /sign-in location in a signed-out state; the final app redirect carries only a fixed outcome and no identity, role, credential, authorization code, or provider token.
exceptionFlows:
  - If the session is already expired or revoked, sign-out clears the cookie and returns the signed-out result without recreating or extending a session.
  - If provider logout is unavailable after local revocation, the application remains signed out, reports that provider sign-out could not be confirmed, and does not restore the local session.
  - Concurrent sign-out and protected requests resolve against durable current revocation state; requests observing revocation are refused, and a copied revoked session reference never authenticates.
postconditions:
  - The application no longer treats the learner as signed in and the raw session cookie is cleared.
  - The server-side session is revoked before provider logout begins.
composes: [br.identity.sign-in, sds.identity.session, contract.identity.session-contract, integration.identity.keycloak]
requiresProof:
  - required: true
    command: npm run test -- src/modules/domain/identity src/modules/integrations/keycloak --runInBand
    note: Exercise local revocation ordering, cookie clearing, provider logout failure, replay and concurrent request behavior.
  - required: true
    command: npm run test:integration -- src/tests/integration/identity --runInBand
    note: Exercise durable revocation, cookie deletion attributes and logout redirect transport.
change: {rev: HEAD, kind: revised, at: '2026-10-28', reason: Specify local revocation before provider logout and fail-closed behavior.}
extensions: {}
