Review ?state=idle|redirecting|failed|signed-in and &theme=light|dark; otherwise system theme.

page-header.choose.head:no-band: one Page without header; Page owns the page inset and region-step top gap.

card.choose.role:entity; card.choose.highlight:plain. Sign-in playbook and single-column Form idiom.
SurfaceCopyGroup title/support is the one primary focal point; action and conditional feedback are secondary.
button.choose.role:text; button.choose.intent:commit; button.choose.width:fill; scale.choose.step:standalone.

toast-alert.choose.owner:region for failure, :durable for authenticated settlement; appearance:soft in the form.
Redirecting: only the initiating Button isPending; the same Sign in label and box; one polite status sentence.
Failed: one negative Alert, recovery via the same Sign in command. Signed-in: one affirmative Alert and Continue.
The static drawing issues no authentication requests, assertions, fabricated settlement or destination.
Sign in initiates the product identity boundary. Continue invokes the authenticated continuation boundary.
No local credential fields, learner realm role, operator role, alternate journey or destination is invented.
No artwork slot: mascot is for AI assistant surfaces; shell=null; logo is limited to the product navbar.

<script>
const params=new URLSearchParams(location.search);
const selected=['idle','redirecting','failed','signed-in'].includes(params.get('state'))?params.get('state'):'idle';
const drawing=document.getElementById('drawing');
drawing.replaceChildren(document.getElementById('state-'+selected).content.cloneNode(true));
const requestedTheme=params.get('theme');
const theme=requestedTheme==='dark'||requestedTheme==='light'?requestedTheme:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
const root=drawing.firstElementChild;
root.dataset.grammarTheme=theme;
root.classList.toggle('dark',theme==='dark');
root.classList.toggle('light',theme==='light');
document.documentElement.style.colorScheme=theme;
// A drawing has no live identity boundary; pressing its command never fabricates a result.
drawing.addEventListener('submit',event=>event.preventDefault());
const pending=drawing.querySelector('[data-pending="true"],button[aria-busy="true"]');
if(pending) pending.addEventListener('click',event=>event.preventDefault());
</script></body></html>
