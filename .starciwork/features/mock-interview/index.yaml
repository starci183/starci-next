schema: work/feature@1
id: mock-interview
state: todo
activity: idle
title: Phỏng vấn thử (Mock Interview)
summary: A text interview with the StarCi AI interviewer, drawn from the teacher's question banks (technical banks per course, one shared behavioural bank). The learner answers a short session with no feedback in between. Then the whole session is graded once against the teacher's rubrics, checklists and idealAnswers. The report links each gap back to the Bản chất lesson to study again.
purpose: Learners who know the material but cannot say it out loud practise a Vietnamese-first interview, see their score per criterion and retake it to watch the score rise.
decided:
  - Wave A builds the mock interview, text first; voice comes later (research §6 Q1, decided).
  - One Premium (contract.commerce.entitlement isPremium) unlocks unlimited sessions under a server-side fair-use cap; no credits are shown (Q-KS-1, Q4).
  - Without Premium a learner gets one short session per calendar month, drawn only from questions the teacher marked isPremium false (Q4).
  - The session is graded once, after the last answer, against the teacher's own rubric, checklist and idealAnswer. There is no per-answer feedback and no retrieval over lesson content (the teacher's bank README and blog 14).
  - The teacher grades a sample of 30 answers to measure AI agreement before the banks are widened (Q6).
  - A session is set up for an outcome track of the learning program; the track chooses the banks (decision.learning-program.outcome-layer).
delivers:
  - Session setup (track, bank, tier, code language), the interview room (chat), the graded report, retake, history.
  - Import of courses/*/mock-interview (82 banks, 985 questions) and mock-interview-eq (3 banks, 45 questions) from starci-lab/data.
  - Interview evidence (best score per family, tier and track) for the learning-program path progress and the career profile.
excludes:
  - Voice (speech in or out), the code editor and run tools of debug, optimize and coding questions (text answers only), the 5-phase system-design capstone (kind design), live human interviewers.
  - Per-answer feedback during a session.
