invariants:
  - A learner without Premium owns at most PROJECT_FREE_PROJECTS projects, counted under a per-learner lock.
  - The CI secret is shown once, when the project is created or the secret rotated; it is never served again.
  - Concept pointers (location, endpoint, sample body) live per project and concept and never hold a secret-like file path.
