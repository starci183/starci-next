schema: work/data@1
id: data.projects.project
title: Learner project
state: todo
activity: idle
fields:
  - {name: projectId, type: uuid, required: true}
  - {name: learnerId, type: uuid, required: true}
  - {name: name, type: text up to 80, required: true}
  - {name: kind, type: app | agent, required: true}
  - {name: topic / language / stack, type: free text, required: true}
  - {name: track, type: claude | openclaw | hermes, required: false}
