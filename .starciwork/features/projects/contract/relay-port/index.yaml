schema: work/contract@1
id: contract.projects.relay-port
title: Relay check results as Dự án reads them
state: todo
activity: idle
owner: projects
between: [projects, the relay capability inside the core app (be/src/modules/domain/relay)]
surface:
  - {name: checkResults, kind: in-process port, path: ProjectRelayPort.checkResults, request: '{learnerId, projectId, after}', response: '[{eventId, runId, conceptId, slot test|e2e|probe, ref, passed, commit, at}] oldest first', errors: []}
guarantees:
  - Each result is one check.result event of contract.relay.channel; the event id is stable, so a repeat counts once.
  - Results are practice only. The app binds the port with ProjectModule.register({ relay }); core binds RelayProjectService, and NoRelayClient, the default, reads none. The relay runs in core's process: one replica while the realtime hub is in memory, and a start-first deploy may drop a frame.
consumerObligations:
  - The relay adapter reads only the results of the learner's own paired devices for the named project.
