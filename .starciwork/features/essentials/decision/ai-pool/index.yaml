recommendation: Carry over decision.lessons.ai-pool unchanged. Use one shared pool through @starci/ai-router exactly 0.5.0 (the harness canon pin) with one OpenRouter provider (baseUrl https://openrouter.ai/api/v1) and one custody key reference OPENROUTER_API_KEY. A lesson profile prefers deepseek/deepseek-v4.1-flash, with ordered fallback deepseek/deepseek-v4-pro.
recommendationReason: Owner correction r-4d87cd331347 (goal v38) set one key and these two model ids for lesson coaching. The router owns health-aware selection, retries, fallback, streaming and redacted telemetry.
