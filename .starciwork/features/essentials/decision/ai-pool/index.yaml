extensions:
  carriedFrom: [decision.lessons.ai-pool, integration.lessons.ai-router, decision.lessons.ai-credit]
  rules:
    - No learner email, id or token is sent to a provider; requests carry an opaque request id.
    - Tests and the walk use the package's testing module (a deterministic fake provider); no live call without an authorised, funded key.
    - Premium includes the AI teacher under a server-side fair-use cap per learner per UTC day (ATTEMPT_COACH_DAILY_LIMIT, default 100); the learner sees no credits, only the stable code ATTEMPT_COACH_LIMIT_REACHED once the cap is reached.
    - The OpenRouter key is the owner's: the sealed member ai holds a placeholder in dev and production until the owner sets the real one (starci app secret set --env <env> ai OPENROUTER_API_KEY); the models are non-secret AI_GATEWAY_MODEL and AI_GATEWAY_FALLBACK_MODEL.
    - The cost cap belongs to Q-KS-1 in decision.essentials.product.
