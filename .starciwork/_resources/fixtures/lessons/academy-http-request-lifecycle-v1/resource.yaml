  languages:
    en:
      title: How an HTTP request reaches a server
      description: Follow a browser request from URL to response.
      body:
      - heading: Resolve the host
        text: The client resolves the hostname to an IP address, often through DNS.
      - heading: Establish a connection
        text: The client opens a transport connection; HTTPS also negotiates TLS.
      - heading: Send the request
        text: The client sends an HTTP method, path, headers and optional body to
          a handler.
      - heading: Build the response
        text: The handler returns status, headers and optional body in an HTTP response.
      - heading: Render or consume
        text: A browser may render HTML and request assets; another client may parse
          JSON.
      challenges:
      - id: trace-request
        prompt: Describe the request path and response in order.
        rubric:
        - Names host resolution before connection.
        - Mentions TLS for HTTPS.
        - Names method, path and headers.
        - Explains response status, headers and body.
