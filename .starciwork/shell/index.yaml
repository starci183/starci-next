    layout:
      component: SiteShell
      chrome: visible
      state: todo
      rev: 1
      composition: >-
        The locale layout resolves appI18n.readLocaleSegment (locale, messages,
        Asia/Ho_Chi_Minh time zone) and mounts LocaleShell (html lang, body, ui Providers), then
        AppProviders (next-themes class theme, redux, SWR defaults, auth session and SWR side
        effects, HeroUI toast region), then AppLayout. AppLayout is a server component that renders
        SiteShell from @starci-next/ui, a WorkspaceShell of viewport "flow" with a TopBar whose brand
        TextAction links to APP_ROUTES.home "/" and the routed body in a PageContainer of reading
        measure. The brand word resolves from the app catalog key app.shell.brand; brand direction
        itself is not authored here.
      nav:
        component: APP_ROUTES
        source: fe/apps/app/src/modules/routes/index.ts
        items:
          - key: home
            route: /
            target: /[locale]
        findings:
          - code: SHELL_CHROME_MINIMAL
            detail: >-
              The observed chrome is site chrome only - a TopBar carrying the wordmark that
              links home; there are no named navigation destinations, no sidebar, and no right
              cluster (language, theme, notifications, account). Whether the product app grows the
              richer app chrome FE-APP-SHELL-1..7 describe is not decided in this record.
      page: >-
        The locale segment's page mounts AppHomePage; loading, error and not-found slots mount
        AppLoadingPage, AppErrorPage and AppNotFoundPage respectively.
