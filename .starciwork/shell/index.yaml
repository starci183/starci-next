      locale negotiation.
gaps:
  - id: shell.locale-implementation-vs-product-locale
    statement: >-
      The owner-settled product locale is en only (productLocale above), but the app's
      i18n package declares LOCALES ["vi","en"] with DEFAULT_LOCALE "vi" and localePrefix
      "as-needed", and a Vietnamese catalog vi.json ships beside en.json. This is an implementation
      observation recorded against the settled locale, not a product choice; the owner decides
      whether the routing narrows to en.
    closedBy: []
  - id: shell.richer-app-chrome-absent
    statement: >-
      The current shell is the shared SiteShell site chrome (brand TopBar plus a
      reading-measure body). The persistent navbar destinations, optional sidebar, right cluster
      and compact drawer that FE-APP-SHELL-1..7 describe for an app shell are absent; later
      directions frame them against this record.
    closedBy: []
