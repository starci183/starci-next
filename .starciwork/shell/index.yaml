  source: >-
    Settled by brand.decide from the accepted brand record - brand/index.yaml rev 4
    voice.locales [en] with localeSource "the product locale is en (shell/index.yaml
    productLocale.default, which this op settles) ... Academy's bilingual catalogs are not a StarCi
    Next requirement" - and the owner ruling that the look is identical to the StarCi Academy
    dashboard and subscription renders, whose own i18n/config.ts declares LOCALES ["en","vi"] with
    DEFAULT_LOCALE "en" and PRODUCT_TIME_ZONE "Asia/Ho_Chi_Minh". Preserved verbatim from the
    sibling record D:/Repositories/starci-next/.starciwork/shell/index.yaml as owner-settled; this
    record does not re-decide it. The current implementation observed below still ships a vi
    catalog and a vi-default routing table, recorded under gaps.
