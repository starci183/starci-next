        text and non-text pair listed in measuredPairs (light) and darkPairs (dark), on the canvas, the surface, the
        secondary surface and the tertiary face. No pair is carried by an exception. Ratios are WCAG 2.x, computed from the
        oklch values with the same conversion scripts/checks/brand.mjs uses; a formula, not a composed-pixel capture.
