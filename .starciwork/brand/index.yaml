schema: work/brand@1
id: brand
kind: brand
state: todo
activity: idle
rev: 7
brand:
  identity:
    name: StarCi Next
    product: starci-next
    family: starci
    familyId: core
    tokenVocabulary: The Core family's own token names - the semantic bindings the Core root sets
      (--accent, --accent-foreground, --background, --surface, --surface-foreground, --surface-secondary,
      --surface-secondary-foreground, --foreground, --muted, --border, --separator, --focus, --success,
      --success-foreground, --warning, --warning-foreground, --danger, --danger-foreground, --info,
      --info-foreground) plus the family-owned binding --starci-surface-tertiary, over the --starci-core-*
      anatomy knobs the family maps them from. Every name is a
      token the Core DNA snapshot declares (knowledge/grammars/starci/DNA.yaml, familyId core, provenance
      version 0.5.0, regenerated with the unreleased tertiary surface role); starci-next-fe consumes them through @starci/grammar/core.css
      (starci-next-fe/src/app/globals.css line 3).
    identitySource: The StarCi Academy dashboard and subscriptions render, read from
      starci-academy-fe/src/app/globals.css (sha256 0ee8a826f7523716cd7cc9fe4fda0ab852974ad8d3f640d0a74987579e2793f3),
      which paints the [lang]/dashboard surfaces (DashboardPage plus layout.tsx) and the
      [lang]/subscriptions surfaces (ShellNav plus ProSubscriptionPage). Every colour value below is read
      from a declaration in that file; the file list is in sources.
    ownerRulingsVerbatim: |-
      Ruling of 2026-09-23, relayed by the supervisor and recorded in incident inc-8965d90fa153:
      starci next dùng core grammar, brand mặc định như trang dashboard và subscriptions của starci academy á

      Ruling of 2026-09-24 (goal revision 1, identity ba03ea2d42b19dba), carried verbatim in this dispatch's
      params.ownerRulings: the starci-next brand and page look are IDENTICAL to the original StarCi Academy
      dashboard and subscription pages. brand.decide re-derives the brand from those renders and supersedes
      brand rev 3 where they differ.

      Answer of 2026-09-24, option A of serve-ask ctx_eb5a945a39ea (answeredBy owner at
      2026-09-24T18:27:55.561Z), verbatim: A. Giống hệt Academy cả 3 màu, chấp nhận độ tương phản dưới chuẩn
      (xám 4.0-4.8:1, chữ trên nút đỏ 3.45:1, link 4.46:1)
    ownerRulingsEnglish: StarCi Next uses the Core grammar, and its brand is the one the StarCi Academy
      dashboard and subscriptions pages show. Where the Academy render and the Core grammar export disagree -
      the muted grey, the danger red and the link violet - the Academy render wins, and the owner accepted
      those three tones' sub-AA contrast (grey 4.0-4.8:1, white ink on danger 3.45:1, link 4.46:1).
      (Translation for readers; the verbatim text above is the ruling.)
    decisions:
      - subject: grammarFamily
        options: [core]
        chosen: core
        authority: inc-8965d90fa153 ("starci next dùng core grammar")
      - subject: primary
        options: ["--accent #7547ff (the Academy dashboard/subscriptions accent)"]
        chosen: "--accent #7547ff"
        authority: inc-8965d90fa153 plus the 2026-09-24 ruling; the value is read from
          starci-academy-fe/src/app/globals.css line 143.
      - subject: dangerMayMatchPrimary
        options: [false]
        chosen: false
        authority: The Academy render ships an orange-red danger (hue 37.78, 41.15 OKLab deltaE x100 from the
          purple accent) and no ruling allows danger to share the primary hue.
      - subject: typography
        options: [Be Vietnam Pro via --starci-font-sans]
        chosen: Be Vietnam Pro
        authority: inc-8965d90fa153, traced to the Academy root layout that serves dashboard and subscriptions.
      - subject: brandColourValues
        options:
          - "A. Academy render values for all three tones; accept the sub-AA contrast (muted 4.04-4.85:1, white ink on danger 3.45:1, link 4.46:1)"
          - "B. Academy look with the Core grammar 0.5.0 AA values for the three tones (rev 3: muted 52%, danger 55%, accent-text #6a3cf2)"
          - "C. Academy values for muted and link, AA danger (white ink 5.17:1)"
        chosen: "A. Academy render values for all three tones; accept the sub-AA contrast"
        authority: "Owner answer A, serve-ask ctx_eb5a945a39ea, answeredBy owner at 2026-09-24T18:27:55.561Z;
          receipt .starciwork/kernel-evidence/wf-sn-foundation-mufrhftf/serve-ask/answer-1790274475561.json.
          It withdraws rev 3's decision core-grammar-0.5.0-source-values and records the three accepted tones
          as color.policy.contrastExceptions, keeping color.policy.minContrast at the WCAG AA floor 4.5:1. SUPERSEDED
          2026-09-30: the sub-AA tones stay as brand values under decision contrastFollowsHeroUI."
      - subject: contrastFollowsHeroUI
        options:
          - "Adjust the tones in lightness at the same hue so every pair reaches AA (task y90, 2026-09-30)"
          - "Follow HeroUI: bright solid status tones with a soft pair (a HeroUI flat Chip) for text and icons, no extreme contrast"
        chosen: "Follow HeroUI: bright solid status tones with a soft pair for text and icons, no extreme contrast"
        decision: "owner 2026-09-30: follow HeroUI soft pairing, no extreme contrast"
        authority: "Owner 2026-09-30: follow HeroUI, no need for extreme contrast. text-soft goes with background-soft like a Chip soft/flat variant, not strictly standard but acceptable, or lower the contrast requirement. Not just miamia: nivo and starci-next too. Applied by task y92; it supersedes y90's AA darkening (decision contrastAdjustedForAA, withdrawn) and restores the Academy render values for muted, link ink, success, warning and info. Danger is oklch(62% 0.2335 37.78), between the Academy 65.32% and y90's 56%. See color.policy.heroUiPairing."
      - subject: surfaceTertiary
        options: ["--starci-surface-tertiary oklch(93.73% 0.0012 354.13) (the Academy render's --surface-tertiary), utility bg-starci-surface-tertiary; HeroUI --surface-tertiary untouched"]
        chosen: "--starci-surface-tertiary oklch(93.73% 0.0012 354.13)"
        authority: "Owner ruling relayed by the supervisor in incident inc-b077846a4012 and carried in this
          dispatch's title (job op-brand.decide-4792c615ef, attempt 10): declare --starci-surface-tertiary =
          oklch(93.73% 0.0012 354.13) with utility class bg-starci-surface-tertiary and do NOT override HeroUI
          --surface-tertiary. The runtime change brand-planned-token-value-source (contract-changes.yaml,
          effective 2026-09-25T03:40:00+07:00) added the name to the Core DNA and let a planned token bind a
          valueSource; the value is read from starci-academy-fe/src/app/globals.css line 152."
      - subject: darkMode
        options:
          - "A. Light only (rev 6: dark optional, Academy's own dark block left unsettled)"
          - "B. Light and dark, system default with a persisted user choice, dark values derived from the light palette at AA"
        chosen: "B. Light and dark: system default, user toggle, persisted; dark palette in color.dark"
        authority: "Owner ruling of 2026-09-29, 'dark mode light mode phai co' (no exceptions), relayed to the lead. The
          dark VALUES were derived by the lead, not by the owner: they keep the purple hue 287 and the neutral hue
          354.13, meet WCAG AA outright on every pair color.policy.darkPairs lists, and are PENDING OWNER REVIEW.
          Open owner questions: (1) the dark accent is a lighter purple (oklch 68% 0.17 287) with dark ink, not the
          light #7547ff with white ink, so that the accent indicator clears 3:1 on every dark surface; (2) dark
          danger is lifted to oklch 70% 0.17 36.67 with dark ink, so danger clears AA as text and as a fill."
