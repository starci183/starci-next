  direction:
    rev: 2
    status: proposed
    surfaceClass: "learning catalog: a learner chooses a published section, then reads one section's
      ordered lesson summaries and opens a selected lesson"
    referenceClass: The StarCi Academy dashboard and subscription light surfaces, applied to a calm
      learning catalog rather than copied as a dashboard
    authority: knowledge/ui composition and proof, then the StarCi Core DNA, then the settled StarCi
      Next identity and shell; this direction may not override them
    principles:
      - id: P1
        name: One job and one focal point
        rule: The page names the collection in one heading. The collection heading and the neutral summary
          are its two secondary ranks; all entity names are equal scan anchors. Cut any element with
          no part in choosing a section.
        cites:
          - composition/taste.yaml DISCIPLINE-1 case-1
          - composition/hierarchy.yaml HIERARCHY-6 case-1
      - id: P2
        name: Equal sections remain equal
        rule: Published learning sections have no inferred prerequisite or recommendation. Their cards have
          equal weight and order follows the published display order. A section action uses a quiet
          Button; when no global action is justified, the page has no filled primary Button.
        cites:
          - composition/hierarchy.yaml HIERARCHY-3 case-1
          - composition/accent.yaml ACCENT-1 case-3
          - proof/render-truth.yaml TRUTH-1 case-1
      - id: P3
        name: Grammar default surfaces
        rule: Use the Core PageContainer, SectionHeader, SurfaceCard, Text and Button anatomy. The canvas is
          HeroUI --background and cards use --surface. A notice is the DNA Alert, a verified ratio the
          DNA Meter, and an identity tile neutral; missing variants are grammar proposals.
        cites:
          - grammars/starci/DNA.yaml
          - composition/accent.yaml ACCENT-6 case-4
          - composition/taste.yaml DISCIPLINE-1 case-5
          - composition/accent.yaml ACCENT-2 case-1
      - id: P4
        name: Accent is scarce
        rule: Keep purple under ten percent of the content area, for the one justified primary action,
          focus, or a small navigation cue. Counts and facts stay in the default tone. Never use
          danger for a normal section.
        cites:
          - composition/accent.yaml ACCENT-6
          - composition/taste.yaml DISCIPLINE-2 case-5
          - proof/brand.yaml BRAND-1
      - id: P5
        name: No mascot in the collection
        rule: The brand mascot is confined to its AI assistant slots. List rows and tables use no mascot,
          hero illustration or second brand moment; the product logo remains in the shell lockup only.
        cites:
          - composition/taste.yaml DISCIPLINE-3 case-2
          - proof/brand.yaml BRAND-2
          - proof/taste.yaml TASTE-8
      - id: P6
        name: Detail preserves one subject
        rule: A detail page names one section, puts the selected lesson's verified facts and one onward
          action within reach, then lets the learner scan its ordered lesson summaries. Do not reveal a
          lesson body, claim unknown progress, or promote a metadata fact into a status.
        cites:
          - composition/taste.yaml DISCIPLINE-1 case-1 and case-4
          - composition/hierarchy.yaml HIERARCHY-6
          - proof/render-truth.yaml TRUTH-1
    geometry:
      contentWidth: 1184px desktop; 390px mobile reference viewport
      canvas: --background, the Core/HeroUI light canvas (composition/accent.yaml ACCENT-6 case-4)
      card: --surface; Core SurfaceCard default radius and shadow, no added outline
        (grammars/starci/DNA.yaml)
      rhythm: 24px between regions, 16px between peer cards, 12px between rows, 8px inline
        (proof/taste.yaml TASTE-3; grammars/starci/DNA.yaml)
      mobileInset: 16px (composition/responsive.yaml RESPONSIVE-1)
    archetypes:
      list:
        status: proposed
        regionOrder:
          - "page header: one h1, one supporting line, optional global action"
          - optional neutral summary, at most four facts
          - conditional attention or last-result Alert, before the collection when an actionable
            condition exists
          - collection heading with count and published order, then peer entities
          - pagination only when the source paginates
        grid1184: At 1184px, a three-cell neutral summary and two equal entity columns; switch to rows for
          terse entities. Keep a 32px content inset and 16px peer gap.
        grid390: At 390px, a two-column neutral summary with the third fact full width, then one entity
          column; DOM order is unchanged and the 16px inset stays clear.
        emphasis: "Primary focal point: the page h1 naming the list. Secondary: the collection heading and
          the neutral summary. Equal entity names are scan anchors beneath them; no metric or image
          outweighs the h1."
        primaryActionPlacement: A justified global action belongs beside the heading at desktop and within
          easy reach below it on mobile. For equal section choices, omit the global primary;
          per-entity onward actions use quiet Buttons in each card action band.
        never:
          - a SurfaceCard wrapping the collection of SurfaceCards
          - filled primary Buttons repeated per entity
          - Badge on a plain lesson count or display order
          - mascot art on a list row or table
          - status colour as the only meaning
          - a chosen section implied by visual weight when all choices are peers
        whenNotToUse: Use detail for one entity with no comparison; use empty for a collection with no
          published entries; use dashboard only when verified overview numbers are the page job.
        components:
          - PageContainer
          - SectionHeader
          - SurfaceCard
          - Text
          - Button
          - Alert
          - Meter
          - IconTile
        notes:
          - Golden copy and counts use the three-section LearnContentSections frontend fixture
            (component.spec.tsx, 3 sections, 10 lessons, 2 studied); it is a reference, not a live
            capture.
          - The product shell owns its real navigation and lockup; a page direction is composed into
            that shell by interface.draw.
          - A current frontend list gives every card a filled primary Button; this proposal asks for a
            quiet per-card action and does not claim that implementation has changed.
      detail:
        status: proposed
        regionOrder:
          - breadcrumb back to the collection, then the one section heading and supporting summary
          - learner progress as plain text only when the section read supplied a count
          - selected lesson facts with the one dominant Open lesson action
          - published lesson summaries in source order with quiet per-row View lesson actions
        grid1184: At 1184px, use a 32px page inset and a 24px gap. The selected lesson occupies the
          first column at roughly two fifths of the width; the joined lesson list occupies the rest.
          Align their top edges and keep each as one Core SurfaceCard with its own title.
        grid390: At 390px, keep a 16px page inset. Stack the selected lesson before the ordered list in
          DOM and visual order; keep the one primary action full width and at least 40px high. The
          list reflows to one column and no detail or action clips.
        emphasis: "Primary focal point: the section h1. Secondary: the selected lesson title and the
          Lessons heading. Facts, progress and row titles stay below those ranks; no illustration or
          number competes with the section name."
        primaryActionPlacement: The selected lesson's Open lesson Button ends its fact card. It is the
          only filled primary; each list row uses a quiet TextAction. On mobile, the selected card
          precedes the list so the action remains reachable without searching below every row.
        never:
          - lesson body or quiz answer shown in the section overview
          - a progress value when the learner read returned no count
          - metadata facts rendered as success or warning badges
          - a second filled primary in a lesson row
          - mascot or decorative artwork in the lesson list or a loading state
          - CSS order that reverses the semantic reading sequence
        whenNotToUse: Use list when the learner compares independent sections; use empty when the selected
          section has no published lessons; use the lesson viewer for a lesson body or challenge.
        components:
          - PageContainer
          - Breadcrumbs
          - SectionHeader
          - SurfaceCard
          - DescriptionList
          - Text
          - Button
          - TextAction
          - EmptyNotice
          - Alert
        notes:
          - The golden uses the ContentSectionPage ready fixture and the two lesson summaries from
            ContentSectionLessons/index.spec.tsx as reference copy; it is not a live product capture.
          - Pending, unavailable, refused, not found and no-lessons states preserve the same heading
            frame and replace facts with the Core EmptyNotice or Alert appropriate to the state.
          - The current frontend renders the list before the selected summary; this proposed direction
            places the selected action first on mobile and does not claim implementation has changed.
    vocabulary:
      listHeader:
        dna:
          - SectionHeader
          - Button
        recipe: One heading and one muted line. Show a global Button only when the page job has one dominant
          global action; a backlink is secondary.
      neutralSummary:
        dna:
          - SurfaceCard
          - Text
        recipe: At most four neutral facts. Values have their own noun or unit and never receive a success
          or danger tone merely for being a count.
      entityCard:
        dna:
          - SurfaceCard
          - Text
          - Button
        recipe: One peer SurfaceCard per section with its name, one supporting line, plain lesson count and
          one quiet onward Button in the final band. No nested card or count Badge.
      attentionNotice:
        dna:
          - Alert
          - Button
        recipe: "Only for an actual condition needing action. Use the HeroUI Alert anatomy: white surface,
          small toned indicator to the left of the title, and its action in the actions slot; never a
          tone-filled card."
      verifiedRatio:
        dna:
          - Meter
        recipe: A verified completion ratio uses the DNA Meter, full-width track; a discrete n/m may use the
          published segments variant only when the consuming grammar version supports it.
      identityTile:
        dna:
          - IconTile
        recipe: If a section needs a glyph for scanning, use the DNA IconTile in neutral tone with its text
          name beside it; the golden reference has no unnecessary tiles.
      detailHeader:
        dna:
          - Breadcrumbs
          - SectionHeader
          - Text
        recipe: A trail back to the collection and one section h1 with one summary line. Show a study
          count as muted Text only when the learner read supplied it; never invent zero or a time.
      selectedLesson:
        dna:
          - SurfaceCard
          - DescriptionList
          - Button
        recipe: One joined card names the selected lesson, presents only its answered learning outcome,
          phase, prerequisite and code language facts, and ends in the single filled Open lesson Button.
      lessonRows:
        dna:
          - SurfaceCard
          - Text
          - TextAction
        recipe: One joined Lessons card keeps publication order. Each row has an ordinal, title,
          supporting line and quiet View lesson TextAction; the selected row may use a neutral surface.
      detailFallback:
        dna:
          - SurfaceCard
          - EmptyNotice
          - Alert
          - Button
          - TextAction
        recipe: Missing lessons use EmptyNotice and a way back; an actionable failure uses the Core
          Alert with its recovery action. Withheld or unknown facts never appear as empty or zero.
    voice:
      locale: en
      persona: learner Mai from shell/index.yaml
      rule: Use the product locale, name the section and action plainly, and claim progress only from
        verified learner data. Keep internal keys and route paths out of visible copy.
      time: Show a source time only when the data source supplies one; never invent freshness.
    antiPatterns:
      - id: A1
        seen: Existing LearnContentSections frontend card, 2026-09-27
        bad: Each peer section has a filled primary Button, making independent choices compete.
        fix: Use quiet per-card Buttons; reserve one filled primary for a justified global action.
        cites:
          - composition/accent.yaml ACCENT-1 case-3
          - proof/taste.yaml TASTE-5
      - id: A2
        bad: A plain lesson count rendered as a status Badge.
        fix: Show the count as neutral Text with the lesson unit.
        cites:
          - composition/hierarchy.yaml HIERARCHY-4 case-1
          - composition/taste.yaml DISCIPLINE-1 case-3
      - id: A3
        bad: Mascot or decorative artwork inside a list card.
        fix: Leave the list quiet; the mascot remains in the settled AI assistant slots.
        cites:
          - proof/brand.yaml BRAND-2
          - composition/taste.yaml DISCIPLINE-3 case-2
    rubric:
      gateCap: 5
      checks:
        - id: H1
          group: hierarchy
          gate: true
          test: On a list at both widths the Learn content h1 is the one focal point; collection heading
            and summary follow it, and no card or number visually outweighs it.
          cites:
            - composition/hierarchy.yaml HIERARCHY-6
            - proof/taste.yaml TASTE-1
        - id: H2
          group: hierarchy
          test: "On a list, DOM and visual order match: header, summary, conditional notice, collection,
            then real pagination if present."
          cites:
            - composition/hierarchy.yaml HIERARCHY-3
            - composition/responsive.yaml RESPONSIVE-1
        - id: B1
          group: brand
          gate: true
          test: "Canvas is --background, cards are --surface, accent matches --accent #7547ff and covers less
            than ten percent of the content area."
          cites:
            - proof/brand.yaml BRAND-1
            - composition/accent.yaml ACCENT-6
            - proof/taste.yaml TASTE-5
        - id: B2
          group: brand
          test: No mascot appears in list or detail rows, notices, loading states or tables; the shell
            alone carries the logo.
          cites:
            - proof/brand.yaml BRAND-2
            - composition/taste.yaml DISCIPLINE-3
        - id: A1
          group: action
          gate: true
          test: On a list, equal entity choices have equal quiet actions. A filled primary appears only
            when a single global action is justified, never once per peer card.
          cites:
            - composition/accent.yaml ACCENT-1 case-3
            - composition/hierarchy.yaml HIERARCHY-6
        - id: T1
          group: truth
          gate: true
          test: Section and lesson titles, counts and progress come from the bound data. Plain counts
            carry no Badge or success tone; unknown progress is not rendered as zero.
          cites:
            - proof/render-truth.yaml TRUTH-1
            - composition/hierarchy.yaml HIERARCHY-4
        - id: G1
          group: grammar
          test: Every recipe maps to published Core DNA components; an actionable notice uses Alert and a
            verified ratio uses Meter.
          cites:
            - grammars/starci/DNA.yaml
            - composition/taste.yaml DISCIPLINE-1 case-5
        - id: M1
          group: mobile
          gate: true
          test: At 390px cards form one column, a list summary reflows without changing meaning order,
            text and actions remain unclipped, and the page has no horizontal scroll.
          cites:
            - composition/responsive.yaml RESPONSIVE-1
            - proof/taste.yaml TASTE-4
        - id: C1
          group: copy
          test: Copy is English, names the action in plain words, and shows no section key, route or internal
            enum.
          cites:
            - proof/ux.yaml UX-11
            - proof/render-truth.yaml TRUTH-1
        - id: R1
          group: reference
          gate: true
          test: The render belongs beside the Academy light dashboard/subscription visual class in
            typography, quiet surfaces and purple accent while preserving its own page job.
          cites:
            - proof/taste.yaml TASTE-12
            - proof/brand.yaml BRAND-3
        - id: D1
          group: detail hierarchy
          gate: true
          test: At both widths the section h1 is the one focal point. Selected lesson facts and action
            appear before the ordered list on mobile without CSS order reversal or horizontal scroll.
          cites:
            - composition/hierarchy.yaml HIERARCHY-6
            - composition/responsive.yaml RESPONSIVE-1
            - proof/taste.yaml TASTE-1
        - id: D2
          group: detail truth
          gate: true
          test: The section and lesson names, summaries, facts, publication order and progress come from
            their bound read. An unknown study count, unpublished lesson body or challenge answer is absent.
          cites:
            - proof/render-truth.yaml TRUTH-1
            - composition/taste.yaml DISCIPLINE-1
        - id: D3
          group: detail action
          gate: true
          test: The selected lesson has the only filled Open lesson Button. Row actions are quiet
            TextActions and the primary is reachable before the list on mobile.
          cites:
            - composition/accent.yaml ACCENT-1
            - proof/ux.yaml UX-9
        - id: D4
          group: detail grammar
          test: Breadcrumbs, SectionHeader, joined SurfaceCard, DescriptionList, Button and TextAction
            follow Core DNA. A no-lessons state uses EmptyNotice; an actionable failure uses Alert.
          cites:
            - grammars/starci/DNA.yaml
            - composition/taste.yaml DISCIPLINE-1 case-5
        - id: D5
          group: detail brand
          test: The HeroUI --background canvas and Core --surface cards remain calm; purple occupies under
            ten percent of content area; mascot and extra artwork are absent from the lesson detail.
          cites:
            - composition/accent.yaml ACCENT-6
            - proof/brand.yaml BRAND-2
      beautyAnchors:
        - score: 1-2
          anchor: A plain text dump with no clear list heading, actions or grouping.
        - score: 3-4
          anchor: Correct content and colours but flat rhythm, competing filled actions or badges on facts.
        - score: 5-6
          anchor: Readable list with a focal point, yet crowded summary or weak mobile reflow.
        - score: 7-8
          anchor: Calm Academy-family list with equal peer cards, one clear focal point, accurate copy and
            clean mobile.
        - score: 9-10
          anchor: "A highly polished product catalog: every element earns its place and a reviewer sorts it
            into the Academy-class family at first glance."
