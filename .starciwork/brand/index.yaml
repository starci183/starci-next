        - knob: --starci-core-muted
          value: oklch(55.17% 0.003 354.13)
        - knob: --starci-core-danger
          value: oklch(62% 0.2335 37.78)
        - knob: --starci-core-accent-text
          value: "#7547ff"
          because: The Core root sets --link and the soft-accent ink from this knob; Academy has no
            accent-text and derives them from --accent, so the knob equals the accent value.
      grammarKnobsNote: These are the only three knobs that must move for the Academy render; every other
        --starci-core-* value the installed export declares already equals the value above. The knob is the
        Core root's own name for the binding, so the FE may set the knob or the binding, never a second
        invented name.
      usage:
        - Primary actions, the selected navigation state and focus rings use --accent with
          --accent-foreground, and links use the same --accent, exactly as on the Academy dashboard and
          subscriptions pages.
        - Pages sit on --background; cards and panels are --surface lifted by the core surface shadow, with
          --surface-secondary for a second level and --starci-surface-tertiary (utility
          bg-starci-surface-tertiary) for the Academy tertiary face - never outlined boxes, and never by
          re-binding HeroUI --surface-tertiary.
        - --muted carries secondary text only. It measures 4.01:1 to 4.82:1 on the four surfaces (HeroUI-like, owner 2026-09-30), and it is still secondary copy;
          do not use it for the primary reading text of a surface.
        - Success, warning, danger and info are status tones only; categorical data maps onto them rather
          than adding a hue. Danger is a fill; never set it as text on a surface. A status shown as text or an icon uses its soft pair (--<tone>-soft-foreground on --<tone>-soft), like a HeroUI flat Chip.
        - The Core root maps the semantic names from the --starci-core-* knobs; where the installed export
          still carries the grammar's own AA values (muted, danger, accent-text) the FE must re-point the knob
          as recorded in grammarKnobs, or the pages will render the grammar's tones instead of Academy's.
