        text pair reaches 4.5:1 and every non-text pair 3:1 outright. The owner ruled on 2026-09-29 that dark
        and light mode are both required; the values are pending owner review. Ratios are WCAG 2.x, computed
        from the oklch values with the same conversion scripts/checks/brand.mjs uses.
