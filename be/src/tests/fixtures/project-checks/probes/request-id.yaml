# StarCi probe (learners do not edit it). Check-flow language: docs/check-flow.md. A draft file written by an AI.
schema: starci-next-data/check-flow@1
status: draft
author: ai-placeholder
id: request-id
label:
  vi: The request id is echoed, and each request gets its own
  en: The request id is echoed, and each request gets its own
question:
  vi: Where does a request id enter and reach the logs, and where do you look when you trace a failure?
  en: Where does a request id enter and reach the logs, and where do you look when you trace a failure?
needs: [endpoint]
steps:
  - id: echoed
    request:
      method: GET
      path: "{{endpoint.path}}"
      headers: { x-request-id: "{{run.id}}-trace" }
    expect:
      - { that: header x-request-id, eq: "{{run.id}}-trace", fail: not-echoed }
  - id: minted
    request: { method: GET, path: "{{endpoint.path}}" }
    capture: { minted: header x-request-id }
    expect:
      - { that: header x-request-id, exists: true, fail: not-minted }
  - id: minted-again
    request: { method: GET, path: "{{endpoint.path}}" }
    expect:
      - { that: header x-request-id, ne: "{{minted}}", fail: constant-id }
pass: echoed
reasons:
  echoed:
    {
      vi: "The sent id came back and minted ids differ per request.",
      en: "The sent id came back and minted ids differ per request.",
    }
  not-echoed:
    {
      vi: The response did not echo the x-request-id that was sent.,
      en: The response did not echo the x-request-id that was sent.,
    }
  not-minted:
    { vi: A request without an id got no x-request-id back., en: A request without an id got no x-request-id back. }
  constant-id: { vi: Two different requests got the same id., en: Two different requests got the same id. }
fixtures:
  endpoint: POST /starci-test/items
  sample: '{"name":"book"}'
  cheats:
    - { name: no request id, app: { requestId: none }, fails: not-echoed }
    - { name: one constant id, app: { requestId: constant }, fails: not-echoed }
    - { name: ignores the incoming id, app: { requestId: ignore-incoming }, fails: not-echoed }
