# StarCi probe (learners do not edit it). Check-flow language: docs/check-flow.md. A draft file written by an AI.
# The learner's sample body must hold {{value}} where the value changes, for example {"name":"{{value}}"}; the probe fills a new value each run.
schema: starci-next-data/check-flow@1
status: draft
author: ai-placeholder
id: cache-write-then-read
label:
  vi: A read right after a write sees the new value, and repeats are stable
  en: A read right after a write sees the new value, and repeats are stable
question:
  vi: Where does the write invalidate or update the cache, and what happens when that step fails?
  en: Where does the write invalidate or update the cache, and what happens when that step fails?
needs: [endpoint, sample, sample.value]
vars:
  value: "{{run.id}}"
steps:
  - id: warm
    request: { method: GET, path: "{{endpoint.path}}" }
    expect:
      - { that: status, is: 2xx, fail: read-failed }
  - id: write
    request:
      method: "{{endpoint.method}}"
      path: "{{endpoint.path}}"
      body: "{{sample.body}}"
    expect:
      - { that: status, is: 2xx, fail: write-failed }
  - id: read
    request: { method: GET, path: "{{endpoint.path}}" }
    capture: { fresh: body }
    expect:
      - { that: body, contains: "{{run.id}}", fail: stale-read }
  - id: again
    request: { method: GET, path: "{{endpoint.path}}" }
    expect:
      - { that: body, eq: "{{fresh}}", fail: unstable }
pass: fresh
reasons:
  fresh:
    {
      vi: "The read after the write saw the new value, and the repeat matched.",
      en: "The read after the write saw the new value, and the repeat matched.",
    }
  read-failed: { vi: The GET did not answer 2xx., en: The GET did not answer 2xx. }
  write-failed: { vi: The write did not answer 2xx., en: The write did not answer 2xx. }
  stale-read:
    {
      vi: The read right after the write still saw the old value (a stale cache).,
      en: The read right after the write still saw the old value (a stale cache).,
    }
  unstable: { vi: Two reads in a row differed., en: Two reads in a row differed. }
fixtures:
  endpoint: PUT /starci-test/profile
  sample: '{"name":"{{value}}"}'
  cheats:
    - { name: write does not clear the cache, app: { cache: stale }, fails: stale-read }
