# StarCi probe (learners do not edit it). Check-flow language: docs/check-flow.md. A draft file written by an AI.
schema: starci-next-data/check-flow@1
status: draft
author: ai-placeholder
id: error-shape
label:
  vi: A 404 and a 400 share one JSON error shape, with no stack or secret
  en: A 404 and a 400 share one JSON error shape, with no stack or secret
question:
  vi: "Are errors turned into responses in one place or scattered, and how does that place hide the stack trace?"
  en: "Are errors turned into responses in one place or scattered, and how does that place hide the stack trace?"
needs: [endpoint]
vars:
  leak: '(\bat \S+ \(|\.(ts|js|java|cs|go|py):\d+|Traceback|Exception in thread|goroutine \d+|[Pp]assword|PRIVATE KEY)'
steps:
  - id: missing
    request: { method: GET, path: "{{endpoint.path}}/starci-missing-{{run.id}}" }
    capture: { shape: keys }
    expect:
      - { that: status, eq: 404, fail: no-404 }
      - { that: keys, exists: true, fail: not-json }
      - { that: body, notMatches: "{{leak}}", fail: stack-leaked }
  - id: broken
    request: { method: POST, path: "{{endpoint.path}}", body: '{"starci":' }
    expect:
      - { that: status, is: 4xx, fail: not-4xx }
      - { that: keys, eq: "{{shape}}", fail: shape-differs }
      - { that: body, notMatches: "{{leak}}", fail: stack-leaked }
pass: one-shape
reasons:
  one-shape:
    vi: "The 404 and the 400 are JSON of one shape, with no stack or secret."
    en: "The 404 and the 400 are JSON of one shape, with no stack or secret."
  no-404:
    vi: "A missing resource did not answer 404."
    en: "A missing resource did not answer 404."
  not-json:
    vi: "The 404 is not a JSON object."
    en: "The 404 is not a JSON object."
  stack-leaked:
    vi: "The error response leaks a stack trace, a file path or a secret."
    en: "The error response leaks a stack trace, a file path or a secret."
  not-4xx:
    vi: "Broken JSON did not answer 4xx."
    en: "Broken JSON did not answer 4xx."
  shape-differs:
    vi: "The 400 is shaped differently from the 404."
    en: "The 400 is shaped differently from the 404."
fixtures:
  endpoint: POST /starci-test/items
  sample: '{"name":"book"}'
  good: { authz: open }
  cheats:
    - { name: framework HTML 404, app: { errors: html-404 }, fails: not-json }
    - { name: stack in the error, app: { errors: stack }, fails: stack-leaked }
    - { name: two error shapes, app: { errors: mixed }, fails: shape-differs }
