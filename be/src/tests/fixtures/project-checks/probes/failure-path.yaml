# StarCi probe (learners do not edit it). Check-flow language: docs/check-flow.md. A draft file written by an AI.
# The learner's sample body must hold {{message}} where the user message goes; the probe sends an empty message.
schema: starci-next-data/check-flow@1
status: draft
author: ai-placeholder
id: failure-path
label:
  vi: The failure path still answers in control
  en: The failure path still answers in control
question:
  vi: "When a tool or the model fails, what does the agent tell the user and what does it log?"
  en: "When a tool or the model fails, what does the agent tell the user and what does it log?"
needs: [endpoint, sample, sample.message]
vars:
  message: ""
steps:
  - id: empty
    request: { method: "{{endpoint.method}}", path: "{{endpoint.path}}", body: "{{sample.body}}" }
    expect:
      - { that: status, lt: 500, fail: server-error }
pass: graceful
reasons:
  graceful:
    vi: "An empty message still got a response that is not 5xx."
    en: "An empty message still got a response that is not 5xx."
  server-error:
    vi: "An empty message made the agent answer 5xx."
    en: "An empty message made the agent answer 5xx."
fixtures:
  endpoint: POST /starci-test/agent
  sample: '{"message":"{{message}}"}'
  cheats:
    - { name: crashes on an empty message, app: { agent: crashes }, fails: server-error }
