# StarCi probe (learners do not edit it). Check-flow language: docs/check-flow.md. A draft file written by an AI.
schema: starci-next-data/check-flow@1
status: draft
author: ai-placeholder
id: idempotency-replay
label:
  vi: "A replay with the same Idempotency-Key: the same result, another body refused"
  en: "A replay with the same Idempotency-Key: the same result, another body refused"
question:
  vi: Where is the second call with the same key recognised, and how is the first result stored?
  en: Where is the second call with the same key recognised, and how is the first result stored?
needs: [endpoint, sample]
steps:
  - id: first
    request:
      method: "{{endpoint.method}}"
      path: "{{endpoint.path}}"
      headers: { idempotency-key: "{{run.id}}-replay" }
      body: "{{sample.body}}"
    capture: { firstBody: body }
    expect:
      - { that: status, is: 2xx, fail: first-failed }
  - id: replay
    request:
      method: "{{endpoint.method}}"
      path: "{{endpoint.path}}"
      headers: { idempotency-key: "{{run.id}}-replay" }
      body: "{{sample.body}}"
    expect:
      - { that: status, is: 2xx, fail: replay-failed }
      - { that: body, eq: "{{firstBody}}", fail: second-differs }
  - id: other-body
    request:
      method: "{{endpoint.method}}"
      path: "{{endpoint.path}}"
      headers: { idempotency-key: "{{run.id}}-replay" }
      body: '{"starci":"{{run.id}}-other"}'
    expect:
      - { that: status, in: [409, 422], fail: mismatch-accepted }
pass: replayed
reasons:
  replayed:
    {
      vi: "The replay returned the first body; another body got 409/422.",
      en: "The replay returned the first body; another body got 409/422.",
    }
  first-failed: { vi: The first call did not answer 2xx., en: The first call did not answer 2xx. }
  replay-failed:
    { vi: The replay with the same key did not answer 2xx., en: The replay with the same key did not answer 2xx. }
  second-differs:
    {
      vi: The replay returned another body (the work ran again).,
      en: The replay returned another body (the work ran again).,
    }
  mismatch-accepted:
    { vi: The same key with another body was accepted., en: The same key with another body was accepted. }
fixtures:
  endpoint: POST /starci-test/items
  sample: '{"name":"book"}'
  good: { authz: open }
  cheats:
    - { name: ignores the key, app: { idempotency: none }, fails: second-differs }
    - { name: same key any body, app: { idempotency: ignore-body-mismatch }, fails: mismatch-accepted }
