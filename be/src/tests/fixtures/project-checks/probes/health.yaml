schema: starci-next-data/check-flow@1
status: draft
author: ai-placeholder
id: health
label:
  vi: "Health: dịch vụ báo sống, nhanh"
  en: "Health: the service says it is alive, fast"
question:
  vi: Health của bạn trả 200 khi nào, và nó có kiểm tra phụ thuộc quan trọng không?
  en: When does your health endpoint answer 200, and does it check a critical dependency?
needs: []
steps:
