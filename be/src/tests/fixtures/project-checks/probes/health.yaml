    request: { method: GET, path: "{{endpoint.path ?? /health}}" }
    expect:
      - { that: status, eq: 200, fail: not-200 }
      - { that: ms, lte: 2000, fail: slow }
pass: ok
reasons:
  ok: { vi: Health trả 200 trong 2 giây., en: Health answered 200 within 2 seconds. }
  not-200: { vi: Health không trả 200., en: Health did not answer 200. }
  slow: { vi: Health trả lời chậm hơn 2 giây., en: Health took longer than 2 seconds. }
fixtures:
  endpoint: GET /health
  cheats:
    - { name: health reports down, app: { health: down }, fails: not-200 }
    - { name: no health route, app: { health: missing }, fails: not-200 }
