# StarCi probe (learners do not edit it). Check-flow language: docs/check-flow.md. A draft file written by an AI.
# The learner's app sends the event of the write to the address in the X-StarCi-Sink header (StarCi's public sink).
schema: starci-next-data/check-flow@1
status: draft
author: ai-placeholder
id: outbox-delivery
label:
  vi: A write delivers exactly one event to the StarCi sink
  en: A write delivers exactly one event to the StarCi sink
question:
  vi: Where is the event written in the same transaction as the data, and how does the relay avoid sending it twice?
  en: Where is the event written in the same transaction as the data, and how does the relay avoid sending it twice?
needs: [endpoint, sample]
steps:
  - id: write
    request:
      method: "{{endpoint.method}}"
      path: "{{endpoint.path}}"
      headers: { x-starci-sink: "{{sink.url}}" }
      body: "{{sample.body}}"
    expect:
      - { that: status, is: 2xx, fail: write-failed }
  - id: events
    sink: { within: 8000 }
    expect:
      - { that: count, gte: 1, fail: not-delivered }
      - { that: count, lte: 1, fail: delivered-twice }
pass: delivered-once
reasons:
  delivered-once:
    { vi: The sink got exactly one event within 8 seconds., en: The sink got exactly one event within 8 seconds. }
  write-failed: { vi: The write did not answer 2xx., en: The write did not answer 2xx. }
  not-delivered: { vi: The sink got no event within 8 seconds., en: The sink got no event within 8 seconds. }
  delivered-twice: { vi: The sink got the event more than once., en: The sink got the event more than once. }
fixtures:
  endpoint: POST /starci-test/items
  sample: '{"name":"book"}'
  good: { authz: open }
  cheats:
    - { name: never publishes, app: { outbox: never }, fails: not-delivered }
    - { name: publishes twice, app: { outbox: twice }, fails: delivered-twice }
