    kind: behaviour
    http: true
    requires: [[test, e2e], [probe]]
    probes: [cache-write-then-read]
    learn:
      - lesson: distributed-cache
        pending: true
  - id: rate-limiting
    label:
      vi: Rate limiting
      en: Rate limiting
    kind: behaviour
    http: true
    requires: [[test, e2e], [probe]]
    probes: [burst]
    learn: []
  - id: cursor-pagination
    label:
      vi: Cursor pagination that holds under inserts
      en: Cursor pagination that holds under inserts
    kind: behaviour
    http: true
    requires: [[test, e2e], [probe]]
    probes: [stable-pages]
    learn:
