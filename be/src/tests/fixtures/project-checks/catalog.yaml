    kind: behaviour
    http: true
    requires: [[test, e2e], [probe]]
    probes: [error-shape]
    learn: []
  - id: unit-testing-behavior
    label:
      vi: Behavioural unit testing
      en: Behavioural unit testing
    kind: structure
    http: false
    requires: [[test], [code-read]]
    probes: []
    learn: []
