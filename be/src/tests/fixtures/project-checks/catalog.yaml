    kind: structure
    http: false
    requires: [[test], [code-read]]
    probes: []
    learn: []
  - id: tools-permissions
    label:
      vi: Công cụ và quyền tối thiểu
      en: Tools and least privilege
    kind: behaviour
    http: true
    requires: [[test, e2e], [probe], [code-read]]
    probes: [prompt-injection, permission]
    learn: []
  - id: verify
    label:
      vi: Kiểm chứng trước khi tin
      en: Verify before you trust
    kind: structure
    http: false
    requires: [[test], [code-read]]
    probes: []
    learn: []
  - id: decompose
    label:
      vi: Chia việc
      en: Decomposing the work
    kind: structure
    http: false
    requires: [[test], [code-read]]
    probes: []
    learn: []
  - id: cost-limits
    label:
      vi: Chi phí và giới hạn
      en: Cost and limits
    kind: structure
    http: false
    requires: [[test], [code-read]]
    probes: []
    learn: []
  - id: operate
    label:
      vi: Vận hành
      en: Operating the agent
    kind: behaviour
    http: true
    requires: [[test, e2e], [probe]]
    probes: [failure-path]
    learn: []
  - id: agent-harness-control-loop
    label:
      vi: Vòng điều khiển agent
      en: The agent control loop
    kind: structure
    http: false
    requires: [[test], [code-read]]
    probes: []
    learn: []
milestones:
  - id: bf-http-foundation
    title:
      vi: Nền tảng HTTP
      en: HTTP foundation
    concepts: [request-response-lifecycle, health-probe-semantics, error-contract, unit-testing-behavior]
  - id: bf-data-and-cache
    title:
      vi: Dữ liệu và cache
      en: Data and cache
    concepts: [cache-freshness, cursor-pagination]
  - id: bf-safe-and-reliable
    title:
      vi: An toàn và tin cậy
      en: Safe and reliable
    concepts: [authz-no-idor, rate-limiting, idempotent-retry, transactional-outbox]
  - id: agent-mindset
    title:
      vi: Tư duy agent chuẩn
      en: The standard agent mindset
    concepts: [task-spec, context, tools-permissions, verify, decompose, cost-limits, operate]
  - id: agent-theory
    title:
      vi: Vòng điều khiển agent
      en: The agent control loop
    concepts: [agent-harness-control-loop]
kinds:
  app: [bf-http-foundation, bf-data-and-cache, bf-safe-and-reliable]
  agent: [bf-http-foundation, agent-mindset, agent-theory]
