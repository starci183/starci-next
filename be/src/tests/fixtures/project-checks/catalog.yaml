# Danh mục kiểm tra của Dự án (bộ chốt 2026-11-17: 10 concept cho dự án app, cộng nhánh agent giữ nguyên).
# Thêm một concept hay một probe là thêm DỮ LIỆU: một mục ở đây, probes/<id>.yaml, starci/e2e/<concept>.md. Không viết code app.
# `npm run validate` kiểm mọi luật của mô hình chứng minh (xem docs/check-flow.md, mục "Luật của danh mục").
schema: starci-next-data/project-catalog@2
status: draft
author: ai-placeholder
concepts:
  - id: request-response-lifecycle
    label:
      vi: Vòng đời request và response
      en: Request-response lifecycle
    kind: behaviour
    http: true
    requires: [[test, e2e], [probe]]
    probes: [invalid-input, request-id]
    learn: []
  - id: health-probe-semantics
    label:
      vi: Health và readiness probe
      en: Health and readiness probes
    kind: behaviour
    http: true
    requires: [[test, e2e], [probe]]
    probes: [health, readiness]
    learn: []
  - id: idempotent-retry
    label:
      vi: Gửi lại an toàn với Idempotency-Key
      en: Safe retries with an Idempotency-Key
    kind: behaviour
    http: true
    requires: [[test, e2e], [probe]]
    probes: [idempotency-replay, idempotency-parallel]
    learn:
      - lesson: outbox-idempotency
        pending: true
      - lesson: idempotency
  - id: transactional-outbox
    label:
      vi: Transactional outbox, giao sự kiện đúng một lần
      en: Transactional outbox, one delivery per event
    kind: behaviour
    http: true
    requires: [[test, e2e], [probe]]
    probes: [outbox-delivery]
    learn:
      - lesson: outbox-idempotency
        pending: true
  - id: cache-freshness
    label:
      vi: Cache không trả dữ liệu cũ sau khi ghi
      en: A cache never serves stale data after a write
    kind: behaviour
    http: true
    requires: [[test, e2e], [probe]]
    probes: [cache-write-then-read]
    learn:
      - lesson: distributed-cache
        pending: true
  - id: rate-limiting
    label:
      vi: Giới hạn tốc độ
      en: Rate limiting
    kind: behaviour
    http: true
    requires: [[test, e2e], [probe]]
    probes: [burst]
    learn: []
  - id: cursor-pagination
    label:
      vi: Phân trang bằng cursor, ổn định khi có bản ghi mới
      en: Cursor pagination that holds under inserts
    kind: behaviour
    http: true
    requires: [[test, e2e], [probe]]
    probes: [stable-pages]
    learn:
      - lesson: indexing-and-query-plans
  - id: authz-no-idor
    label:
      vi: Phân quyền, không lộ tài nguyên của người khác (IDOR)
      en: Authorization with no IDOR
    kind: behaviour
    http: true
    requires: [[test, e2e], [probe]]
    probes: [owner-only]
    learn: []
  - id: error-contract
    label:
      vi: Hợp đồng lỗi nhất quán, không lộ stack hay bí mật
      en: One error contract, no stack or secret leaks
    kind: behaviour
    http: true
    requires: [[test, e2e], [probe]]
    probes: [error-shape]
    learn: []
  - id: unit-testing-behavior
    label:
      vi: Unit test theo hành vi
      en: Behavioural unit testing
    kind: structure
    http: false
    requires: [[test], [code-read]]
    probes: []
    learn: []
  # Nhánh agent (dự án kind agent, bằng chứng của Agent lab): giữ như trước, nay cũng là dữ liệu.
  - id: task-spec
    label:
      vi: Giao việc rõ
