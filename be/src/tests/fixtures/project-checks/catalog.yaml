# The project check catalog (the set settled on 2026-11-17: 10 concepts for an app project, plus the unchanged agent branch).
# Adding a concept or a probe adds DATA: one entry here, probes/<id>.yaml, starci/e2e/<concept>.md. No app code.
# `npm run validate` checks every rule of the proof model (see docs/check-flow.md, section "Catalog rules").
schema: starci-next-data/project-catalog@2
status: draft
author: ai-placeholder
concepts:
  - id: request-response-lifecycle
    label:
      vi: Request-response lifecycle
      en: Request-response lifecycle
    kind: behaviour
    http: true
    requires: [[test, e2e], [probe]]
    probes: [invalid-input, request-id]
    learn: []
  - id: health-probe-semantics
    label:
      vi: Health and readiness probes
      en: Health and readiness probes
    kind: behaviour
    http: true
    requires: [[test, e2e], [probe]]
    probes: [health, readiness]
    learn: []
  - id: idempotent-retry
    label:
      vi: Safe retries with an Idempotency-Key
      en: Safe retries with an Idempotency-Key
    kind: behaviour
    http: true
    requires: [[test, e2e], [probe]]
    probes: [idempotency-replay, idempotency-parallel]
    learn:
      - lesson: outbox-idempotency
        pending: true
      - lesson: idempotency
  - id: transactional-outbox
    label:
      vi: Transactional outbox, one delivery per event
      en: Transactional outbox, one delivery per event
    kind: behaviour
    http: true
    requires: [[test, e2e], [probe]]
    probes: [outbox-delivery]
    learn:
      - lesson: outbox-idempotency
        pending: true
