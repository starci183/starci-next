# Doctor probe: the project has a real CLAUDE.md. The CLI runs `check` on the learner repo; good and bad are the fixtures the CLI tests use.
schema: starci/harness-probe@1
status: draft
author: ai-placeholder
id: claude-md-present
tool: claude
order: 1
title:
  vi: Dự án có CLAUDE.md với nội dung thật
  en: The project has a real CLAUDE.md
guide: claude-md
check:
  file:
    path: [CLAUDE.md, .claude/CLAUDE.md]
    exists: true
    contains: "## "
    minBytes: 200
fix:
  vi: Tạo CLAUDE.md ở thư mục gốc, ít nhất 200 byte, chia thành các mục `##`. Ghi lệnh build và test, quy ước code và những việc Claude không được làm.
  en: Create CLAUDE.md in the repo root, at least 200 bytes, split into `##` sections. Put the build and test commands, the code conventions and what Claude must not do.
good:
  files:
    CLAUDE.md: |
      # Shop API

      ## Commands
      - `npm test` runs the unit tests. Run it before every commit.
      - `npm run build` compiles to `dist/`.

      ## Conventions
      - TypeScript strict, no `any`. Errors are typed, never strings.
      - Tests sit next to the code as `*.test.ts`.

      ## Never
      - Never edit files under `generated/`.
      - Never commit `.env`.
bad:
  files:
    CLAUDE.md: |
      # notes
      TODO
