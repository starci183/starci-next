# Doctor probe: permissions.deny covers force pushes and recursive deletes.
schema: starci/harness-probe@1
status: draft
author: ai-placeholder
id: permissions-deny-destructive
tool: claude
order: 5
title:
  vi: "`git push --force` and `rm -rf` are denied"
  en: "`git push --force` and `rm -rf` are denied"
guide: permissions
check:
  json:
    path: [.claude/settings.json, .claude/settings.local.json, ~/.claude/settings.json]
    at: permissions.deny
    matchesAll:
      - "^Bash\\(git push\\b[^)]*(--force|-f\\b)"
      - "^Bash\\(rm\\s+-(rf|fr|r\\s+-f|f\\s+-r)"
fix:
  vi: Add `Bash(git push --force:*)`, `Bash(git push -f:*)` and `Bash(rm -rf:*)` to `permissions.deny`.
  en: Add `Bash(git push --force:*)`, `Bash(git push -f:*)` and `Bash(rm -rf:*)` to `permissions.deny`.
good:
  files:
    .claude/settings.json: |
      {
        "permissions": {
          "deny": [
            "Bash(git push --force:*)",
            "Bash(git push -f:*)",
            "Bash(rm -rf:*)"
          ]
        }
      }
bad:
  files:
    .claude/settings.json: |
      {
        "permissions": {
          "deny": ["Bash(git push --force:*)"]
        }
      }
