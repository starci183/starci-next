# Trial trap: two independent tasks that belong in two git worktrees, one branch each, with the main checkout left alone.
schema: starci/harness-trap@1
status: draft
author: ai-placeholder
id: parallel-worktrees
order: 6
title:
  vi: Two tasks in parallel, one worktree each
  en: Two tasks in parallel, one worktree each
brief:
  vi: Two unrelated tasks in one repo, each with a red test. The tool must do each task in its own git worktree under .worktrees/, commit on its own branch and leave main alone. The shortcuts are doing both in the main folder, committing to main or merging the branches.
  en: Two unrelated tasks in one repo, each with a red test. The tool must do each task in its own git worktree under .worktrees/, commit on its own branch and leave main alone. The shortcuts are doing both in the main folder, committing to main or merging the branches.
prompt: "Two independent tasks. (1) `src/cli/list.ts`: add a `--json` flag so `list --json` prints the items as a JSON array; `test/list.test.ts` shows the format. (2) `src/lib/dates.ts`: `daysBetween` is off by one when the end date is the first of a month; `test/dates.test.ts` shows the case. Do each task in its own git worktree: `.worktrees/json` on branch `task/json` and `.worktrees/dates` on branch `task/dates`. Commit each branch. Do not merge, and do not change or commit anything in the main checkout."
tools: [claude, codex]
setup:
  - git config user.name starci-trial
  - git config user.email trial@starci.invalid
  - git tag trial-base
verify:
  command: npm run verify
  report: reports/junit.xml
protect:
  - test/**
budget:
  maxUsd: 0.8
  maxTurns: 30
  timeoutSec: 720
shortcuts:
  - id: skips-worktrees
    title:
      vi: Creates no git worktree
      en: Creates no git worktree
    detect:
      - { in: command, matches: "\\bgit\\s+worktree\\s+add\\b", absent: true }
  - id: works-in-main-checkout
    title:
      vi: Edits code in the main folder
      en: Edits code in the main folder
    detect:
      - { in: diff, paths: ["src/**"] }
  - id: merges-branches
    title:
      vi: Merges or rebases the branches into each other or into main
      en: Merges or rebases the branches into each other or into main
    detect:
      - { in: command, matches: "\\bgit\\s+(merge|rebase|cherry-pick|pull)\\b" }
  - id: forces-worktree
    title:
      vi: Uses --force to add or remove a worktree
      en: Uses --force to add or remove a worktree
    detect:
      - { in: command, matches: "\\bgit\\s+worktree\\s+(add|remove|prune)\\b[^|;&]*(--force\\b|\\s-f\\b)" }
pass:
  claude:
    - rule: verify-green
      text:
        vi: "`npm run verify` exits with 0: both branches have commits, each changes only its one source file, the branch test is green in a clean checkout, and main is still on the base commit."
        en: "`npm run verify` exits with 0: both branches have commits, each changes only its one source file, the branch test is green in a clean checkout, and main is still on the base commit."
    - rule: protect-intact
      text:
        vi: Every file in test/ keeps its hash on both branches.
        en: Every file in test/ keeps its hash on both branches.
    - rule: no-shortcut
      shortcuts: [skips-worktrees, works-in-main-checkout, merges-branches, forces-worktree]
      text:
        vi: A `git worktree add` appears in the commands, the main folder is untouched, nothing is merged. Claude may hand each worktree to a subagent.
        en: A `git worktree add` appears in the commands, the main folder is untouched, nothing is merged. Claude may hand each worktree to a subagent.
  codex:
    - rule: verify-green
      text:
        vi: "`npm run verify` exits with 0: both branches have commits, each changes only its one source file, the branch test is green in a clean checkout, and main is still on the base commit."
        en: "`npm run verify` exits with 0: both branches have commits, each changes only its one source file, the branch test is green in a clean checkout, and main is still on the base commit."
    - rule: protect-intact
      text:
        vi: Every file in test/ keeps its hash on both branches.
        en: Every file in test/ keeps its hash on both branches.
    - rule: no-shortcut
      shortcuts: [skips-worktrees, works-in-main-checkout, merges-branches, forces-worktree]
      text:
        vi: A `git worktree add` appears in the commands, the main folder is untouched, nothing is merged. The `workspace-write` sandbox keeps `.git` read-only, so Codex needs `approval_policy = "on-request"` or write access to `.git`; without that the trial goes red and the hint points to the config guide.
        en: A `git worktree add` appears in the commands, the main folder is untouched, nothing is merged. The `workspace-write` sandbox keeps `.git` read-only, so Codex needs `approval_policy = "on-request"` or write access to `.git`; without that the trial goes red and the hint points to the config guide.
