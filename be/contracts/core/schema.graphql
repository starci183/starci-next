  """
  One course of the catalog: the fields of `courses` plus system {nodes[{id, service, label, role}], edges[{from, to}]} for the intro map; free for every signed-in learner. COURSE_NOT_FOUND.
  """
  course(input: CourseCatalogInput!): CourseCatalogDetailType!
  """
  Every case of a lab in order (happy, then unhappy) with status locked|open|red|green|error, everGreen, hintsOpened, diffAvailable, resetAvailable and the last run; currentCaseId is the first open case never green. COURSE_LESSON_NOT_FOUND, COURSE_PREMIUM_REQUIRED.
  """
  courseCases(input: CourseCasesInput!): CourseCasesType!
  courseLab(input: CourseLabInput!): CourseLabType!
